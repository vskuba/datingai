# Автовыкладка DatingAi на прод по пушу в master.
#
# Секреты репозитория: HOST, USERNAME, SSH_KEY, ENV_FILE (содержимое `.env.prod`
# целиком — пароль базы, токен соседа, ключ сессии).
#
# Blue-Green здесь не нужен: панель не держит долгих запросов, и перерыв в пару
# секунд на перезапуск незаметен. У соседа он есть, потому что там workflow-прогоны
# идут минутами и обрывать их нельзя.
#
# Ручная выкладка остаётся рабочей и никуда не девается: `./deploy.sh` делает то же
# самое с машины разработчика. Она нужна, когда правку надо проверить, не выкладывая
# её в master.

name: Deploy DatingAi

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Без этого шага **вторая и все следующие выкладки падают**. `scp-action`
      # архивирует рабочий каталог целиком, вместе с `.git`, а файлы пачек git
      # кладёт только для чтения (`-r--r--r--`). На сервере они уже лежат с прошлой
      # выкладки, и `tar` не может открыть их на запись: «Cannot open: Permission
      # denied», выход 2, шаг красный. Первый прогон проходит — файлов ещё нет,
      # и поломка выглядит как «вчера работало».
      #
      # На сервере история не нужна: там разворачивают код, а не работают с ним.
      # Тем же занят и `deploy.sh` — он исключает `.git` из архива.
      - name: Убираю историю git из выкладки
        run: rm -rf .git py_modules/.git

      - name: Копирую код на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "~/datingai"
          # `.env.prod` не перезаписываем содержимым репозитория — его там нет.
          overwrite: true

      - name: Обновляю окружение и поднимаю сервисы
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/datingai
            # Окружение прода приходит секретом: пароль базы, токен соседа, ключ сессии.
            echo "${{ secrets.ENV_FILE }}" > .env.prod

            # Копирование идёт поверх и лишних файлов не убирает. Локальной
            # накладки в репозитории нет (она в `.gitignore`), но попади она на
            # сервер иным путём — compose подхватил бы её сам, и прод поднялся бы
            # с пустой локальной базой. `docker-compose.prod.yml` остался с тех
            # пор, когда прод описывался накладкой, и теперь только путает.
            rm -f docker-compose.override.yml docker-compose.prod.yml

            # Без `-f`: базовый `docker-compose.yml` и есть прод.
            COMPOSE="docker compose"
            $COMPOSE build dating_uvicorn
            $COMPOSE up -d --force-recreate dating_uvicorn dating_worker
            docker image prune -f

            # Смена держателя сокетов. Пересоздание контейнеров обрывает текущее
            # задание, но его ключ single-flight живёт ещё две с половиной минуты —
            # и восстановление на старте сервера, увидев занятый ключ, ничего не
            # делает. Задание к тому моменту мёртвое, сокеты стоят, живой чат молчит.
            #
            # Ключ снимаем: здесь это безопасно, воркер только что пересоздан и
            # прежняя смена его пережить не могла.
            sleep 10
            docker exec dating_uvicorn python3 -c "
            from src.worker.dating.chat_worker import (chat_worker_enqueue,
                                                       chat_worker_flight_release)
            chat_worker_flight_release()
            print('смена поставлена:', chat_worker_enqueue())"

      - name: Проверяю панель
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://92.5.17.195.sslip.io/dating/health || true)
            [ "$code" = "200" ] && echo "панель отвечает" && exit 0
            sleep 6
          done
          echo "панель не ответила" && exit 1
