# Автовыкладка DatingAi на прод по пушу в master.
#
# Секреты репозитория: HOST, USERNAME, SSH_KEY, ENV_FILE (содержимое `.env.prod`
# целиком — пароль базы, токен соседа, ключ сессии).
#
# Blue-Green здесь не нужен: панель не держит долгих запросов, и перерыв в пару
# секунд на перезапуск незаметен. У соседа он есть, потому что там workflow-прогоны
# идут минутами и обрывать их нельзя.
#
# Ручная выкладка остаётся рабочей и никуда не девается: `./deploy.sh` делает то же
# самое с машины разработчика. Она нужна, когда правку надо проверить, не выкладывая
# её в master.

name: Deploy DatingAi

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ⚠⚠⚠ Ключ ставится ДО checkout, потому что подмодуль `dashboard`
      # **приватный**, а `GITHUB_TOKEN`, которым checkout тянет подмодули,
      # действует только на СВОЙ репозиторий. Без ключа выкладка падает на
      # `Permission denied` ровно там, где раньше работала молча.
      #
      # ⚠ Ключ — read-only deploy key самого `dashboard` (один на три проекта),
      # а не личный токен: украденный из раннера, он не даёт ни записи, ни
      # доступа к чему-либо ещё.
      #
      # ⚠ Серверу он не нужен: сюда код приезжает `scp-action`-ом уже собранным,
      # и git на сервере подмодули не тянет.
      - name: Ключ к приватному подмодулю dashboard
        env:
          DASHBOARD_DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DASHBOARD_DEPLOY_KEY" > ~/.ssh/dashboard_deploy
          chmod 600 ~/.ssh/dashboard_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'CONF'
          Host github.com
            IdentityFile ~/.ssh/dashboard_deploy
            IdentitiesOnly yes
          CONF
          # ⚠ Подмена адреса точечная — только `dashboard`. Общая подмена
          # `https://github.com/` увела бы по ssh и сам репозиторий, и
          # публичный `py_modules`, которым ssh не нужен вовсе.
          git config --global \
            url."git@github.com:vskuba/dashboard".insteadOf \
            "https://github.com/vskuba/dashboard"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Без этого шага **вторая и все следующие выкладки падают**. `scp-action`
      # архивирует рабочий каталог целиком, вместе с `.git`, а файлы пачек git
      # кладёт только для чтения (`-r--r--r--`). На сервере они уже лежат с прошлой
      # выкладки, и `tar` не может открыть их на запись: «Cannot open: Permission
      # denied», выход 2, шаг красный. Первый прогон проходит — файлов ещё нет,
      # и поломка выглядит как «вчера работало».
      #
      # На сервере история не нужна: там разворачивают код, а не работают с ним.
      # Тем же занят и `deploy.sh` — он исключает `.git` из архива.
      #
      # ⚠⚠ Submodule здесь **два**, и перечислены оба: `dashboard` появился
      # 05.10.2026, а строка осталась про один. Список именами тем и плох —
      # забывается ровно тогда, когда заводят третий; но `rm -rf` это шелл, а не
      # `tar`, и подстановки «любой `.git` в дереве» у него нет.
      #
      # ⚠ У `deploy.sh` той же беды нет: `tar --exclude='.git'` **не привязан к
      # корню** и уносит вложенные сам (проверено опытом, а не по памяти).
      - name: Убираю историю git из выкладки
        run: rm -rf .git py_modules/.git dashboard/.git

      - name: Копирую код на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "~/datingai"
          # `.env.prod` не перезаписываем содержимым репозитория — его там нет.
          overwrite: true

      - name: Обновляю окружение и поднимаю сервисы
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # ⚠⚠ Без этой строки шаг режется на **десяти минутах** — таково
          # умолчание `ssh-action`, и в обычную выкладку (5–6 минут) оно влезало.
          # Не влезло 20.10.2026, когда кэш сборки оказался холодным: слой
          # Playwright докачивал 114 МБ Chromium, `COPY . /app` шёл две минуты, и
          # на выгрузке образа шаг оборвали — «Run Command Timeout».
          #
          # ⚠⚠⚠ Обрыв опаснее, чем кажется: файлы на сервер кладёт **предыдущий**
          # шаг (`scp-action`), и к этому мгновению они уже новые, а контейнеры
          # держат прежний код. Выкладка красная, прод — наполовину новый, и
          # никакая проверка об этом не скажет: статику он раздаёт из
          # примонтированного каталога, то есть свежую, а Python — из памяти, то
          # есть старый. Отсюда 30 минут: запас на холодный кэш, а не на «чтобы
          # не падало».
          command_timeout: 30m
          script: |
            cd ~/datingai
            # Окружение прода приходит секретом: пароль базы, токен соседа, ключ сессии.
            echo "${{ secrets.ENV_FILE }}" > .env.prod

            # Копирование идёт поверх и лишних файлов не убирает. Локальной
            # накладки в репозитории нет (она в `.gitignore`), но попади она на
            # сервер иным путём — compose подхватил бы её сам, и прод поднялся бы
            # с пустой локальной базой. `docker-compose.prod.yml` остался с тех
            # пор, когда прод описывался накладкой, и теперь только путает.
            rm -f docker-compose.override.yml docker-compose.prod.yml

            # Без `-f`: базовый `docker-compose.yml` и есть прод.
            COMPOSE="docker compose"
            # ⚠⚠ Собираем **оба** образа, хотя dockerfile у них один. Здесь стояло
            # только `dating_uvicorn`, и воркер поднимался на образе, собранном
            # когда-то давно: код в него доезжал (он монтируется), а зависимости —
            # нет. Поймано живьём — четыре недели спустя после того, как в
            # требования добавили `socksio`, воркер падал на каждом обращении к
            # `socks5://`-выходу, хотя пакет был в `requirements.txt`.
            $COMPOSE build dating_uvicorn dating_worker

            # Движки поднимаем отдельной строкой и **без** `--force-recreate`:
            # они свои (MySQL, Redis, phpMyAdmin), и пересоздавать базу на каждой
            # выкладке незачем — том переживёт, но перерыв будет на ровном месте.
            # Строка нужна для машины, где их ещё нет: на `dating_phpmyadmin`
            # никто не ссылается через `depends_on`, и сам он не поднялся бы.
            $COMPOSE up -d dating_mysql dating_redis dating_phpmyadmin

            # А вот код пересоздаём всегда: ради него выкладка и затевалась.
            $COMPOSE up -d --force-recreate dating_uvicorn dating_worker
            docker image prune -f

            # Смена держателя сокетов. Пересоздание контейнеров обрывает текущее
            # задание, но его ключ single-flight живёт ещё две с половиной минуты —
            # и восстановление на старте сервера, увидев занятый ключ, ничего не
            # делает. Задание к тому моменту мёртвое, сокеты стоят, живой чат молчит.
            #
            # Ключ снимаем: здесь это безопасно, воркер только что пересоздан и
            # прежняя смена его пережить не могла.
            #
            # ⚠⚠ Зовём **дверь проекта** `chat_worker_lock_release`, а не слой и
            # не приватный ключ. Прежде здесь стояла `chat_worker_flight_release`,
            # и при переезде смены в общий слой её не стало: шаг падал
            # `ImportError`, смена не вставала, а выкладка до того докладывала
            # «успех» — беда видна только в логе чужого шага.
            sleep 10
            docker exec dating_uvicorn python3 -c "
            from src.worker.dating.chat_worker import (chat_worker_enqueue,
                                                       chat_worker_lock_release)
            print('ключ прежней смены:',
                  'снят' if chat_worker_lock_release() else 'уже был свободен')
            print('смена поставлена:', chat_worker_enqueue())"

      - name: Проверяю панель
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://dating.92.5.17.195.sslip.io/health || true)
            [ "$code" = "200" ] && echo "панель отвечает" && exit 0
            sleep 6
          done
          echo "панель не ответила" && exit 1
