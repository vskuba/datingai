{% extends "base.html" %}

{% block title %}Dating | AI System{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ static_url('css/dating_page.css') }}">
    <style>
        /* Обойма страницы, шапка и белая панель — в `dating_page.css`, общем с
           «Профилями». Здесь только раскладка этой страницы: две колонки, список
           анкет слева и профиль с собеседниками справа.

           Журнала на странице больше нет: он есть у выбранной анкеты на
           «Профилях» и целой лентой на «Журналах» — третья копия тех же строк
           только отнимала бы место у переписки.

           Ширина колонки — в переменной: её тянут разделителем, и она
           запоминается, чтобы не выставлять заново на каждой странице. */
        .dating-page {
            --col: 380px;
            grid-template-columns: var(--col) 6px 1fr;
            grid-template-rows: auto minmax(0, 1fr);
        }

        .dating-right {
            grid-column: 3; grid-row: 2;
            display: grid; grid-template-rows: minmax(0, 1fr);
            min-height: 0;
        }

        /* Разделители: узкая полоса, которая заметна только под курсором — рамка
           между панелями не должна спорить с содержимым за внимание. */
        .split { border-radius: 3px; background: transparent; }
        .split:hover, .split.drag { background: #c7d2fe; }
        .split-col { grid-column: 2; grid-row: 2; cursor: col-resize; }

        /* Место шапки в сетке: во всю ширину над колонками. Сама она общая. */
        .dating-head { grid-column: 1 / -1; }

        .dating-profiles-pane { grid-column: 1; grid-row: 2; }

        /* Чекбокс автоответа стоит в ряду кнопок и должен читаться как их часть,
           а не как обрывок формы. */
        .auto-box {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 5px 9px; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 12px; color: #374151; cursor: pointer; user-select: none;
        }
        .auto-box:hover { border-color: #c7d2fe; color: #4338ca; }
        .auto-box input { margin: 0; cursor: pointer; }

        /* Форма заведения — над списком, скрыта до нажатия «+». */
        .dating-form { display: none; flex-direction: column; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .dating-form.open { display: flex; }
        .dating-form input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
        .dating-form-row { display: flex; gap: 6px; }

        /* ---------- Левая колонка: девушки ---------- */

        /* Строка списка — **тот же вид, что на «Профилях»**: плоская строка с
           волосяной чертой снизу, подсветкой под курсором и полосой слева у
           выбранной. Не карточка в рамке: человек ходит между двумя страницами
           одного меню, и один и тот же список, свёрстанный по-разному, читается
           как две разные системы.

           Числа взяты оттуда же (`.prof-table` в `dating_profile.html`) — отступы
           6/12, черта `#f1f5f9`, наведение `#f8fafc`, выбранная `#eef2ff` с полосой
           `#4f46e5`. Скопированы, а не вынесены в общий файл: там это строка
           таблицы (`td`), здесь `div`, и общее правило пришлось бы писать под оба
           случая сразу — оно вышло бы длиннее двух простых.

           Показывает строка **только** лицо, имя и почту. Точка состояния, бейджи
           работы, пометка и кнопки убраны намеренно: список отвечает на вопрос
           «кого выбрать», а работа с выбранной идёт справа и на «Профилях». */
        /* Поля у тела панели сняты — строки идут от края до края, как на
           «Профилях» (`.prof-body`). Свои отступы держит сама строка: иначе
           подсветка и полоса выбранной обрывались бы, не доходя до края панели. */
        #profiles { padding: 0; }

        .profile {
            display: flex; align-items: center;
            padding: 6px 12px 6px 14px;
            border-bottom: 1px solid #f1f5f9; cursor: pointer;
        }
        .profile:last-child { border-bottom: none; }
        .profile:hover { background: #f8fafc; }
        /* Полоса слева, а не только фон: фон под курсором почти такой же, и без
           полосы выбранное теряется ровно тогда, когда мышь идёт вправо. */
        .profile.active { background: #eef2ff; box-shadow: inset 3px 0 0 #4f46e5; }

        /* ---------- Расписание входов и выходов ---------- */

        /* ⚠ **Своя ширина, а не «по колонке».** Блок приехал с «Профилей», где
           стоял в узкой колонке настроек и ширины не имел вовсе. В правой панели
           «Анкет» она втрое больше — ползунки растянулись во весь экран, время
           уехало от подписи, а лишние пиксели дали горизонтальную прокрутку.

           520 пикселей — по содержимому: «Смена 1», два времени и крестик в один
           ряд, ползунок под ними. Шире смысла нет, у́же ломается ряд. */
        .sched {
            max-width: 520px; padding: 4px 12px 12px;
            border-top: 1px solid #f1f5f9; margin-top: 14px;
        }

        /* Заголовок — как «Настройки анкеты» рядом: блоки одного уровня и
           выглядеть должны одинаково. `h4` тут смотрелся вдвое крупнее соседа. */
        .sched-title {
            padding: 8px 0 6px; font-size: 10px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em;
        }

        /* Пояснения и предупреждения под формой. */
        .sched-note {
            font-size: 11px; color: #94a3b8; line-height: 1.4;
        }
        .sched-foot {
            display: flex; align-items: center; gap: 9px; margin-top: 10px;
        }
        .sched-foot .sched-note { flex: 1 1 auto; min-width: 0; }

        /* «Сохранено» — на месте подсказки, а не отдельным сообщением. ⚠ Всплывающее
           уведомление на каждое движение ползунка было бы очередью из десяти
           одинаковых; здесь оно тихое и на своём месте. */
        .sched-note.saved { color: #166534; }

        /* Кнопка входа-выхода в подвале расписания. */
        .sched-door { flex: 0 0 auto; }

        .sched-list { display: flex; flex-direction: column; gap: 4px; }

        /* Строка расписания. Слева цветная планка — по ней тип читается раньше,
           чем слово: вход и выход чередуются, и глаз ищет ритм, а не текст. */
        .sched-row {
            display: flex; flex-direction: column; gap: 2px;
            padding: 5px 8px 6px 6px; border-radius: 6px;
            background: #f8fafc; border-left: 3px solid transparent;
        }
        .sched-head { display: flex; align-items: center; gap: 7px; }
        .sched-row { border-left-color: #818cf8; }

        /* Смена, налезающая на предыдущую. Красим её саму, а не только пишем под
           кнопкой: в расписании из шести смен пересечение без подсветки надо ещё
           найти. */
        .sched-row.clash { background: #fef2f2; border-left-color: #dc2626; }
        .sched-row.clash .sched-kind { color: #b91c1c; }

        .sched-kind { font-size: 11px; font-weight: 700; color: #64748b;
                      width: 62px; flex: 0 0 auto; }

        /* Время — подписью, а не полем ввода: задают его ползунком ниже. Шрифт
           моноширинный, столбик времён читают сверху вниз, и цифры должны стоять
           друг под другом. */
        .sched-time {
            margin-left: auto; font-family: ui-monospace, Menlo, monospace;
            font-size: 12px; color: #374151; white-space: nowrap;
        }
        /* Стрелка между входом и выходом — бледнее самих времён: читают времена,
           а она лишь показывает направление. */
        .sched-time .exact { color: #cbd5e1; }

        /* ---------- Двойной ползунок суток ---------- */

        /* Вся ширина — сутки, две ручки сужают её до интервала. Собран из двух
           нативных `input[type=range]`, наложенных друг на друга: у двойного
           ползунка нет своего элемента, а свой на указателях отнял бы клавиатуру
           и фокус — по стрелкам такой не подвинешь.

           Поверх ползунков не должно быть ничего, что ловит указатель, поэтому
           дорожка и заливка нарисованы под ними и `pointer-events` не берут. */
        .sched-range { position: relative; height: 18px; margin-top: 2px; }

        .sched-track, .sched-fill {
            position: absolute; top: 7px; height: 4px; border-radius: 2px;
            pointer-events: none;
        }
        .sched-track { left: 0; right: 0; background: #e2e8f0; }
        .sched-fill { background: #818cf8; }


        /* ⚠ `left: 0; right: 0` вместо `width: 100%`: у `input[type=range]` своя
           внутренняя ширина, и `100%` считался не от контейнера — ползунок вылезал
           за строку на 14 пикселей, а с ним и ручка уезжала за дорожку. Заметно
           стало в широкой панели «Анкет»; в узкой колонке «Профилей» те же 14
           пикселей терялись на глаз. */
        .sched-range input[type=range] {
            position: absolute; left: 0; right: 0; width: auto; box-sizing: border-box;
            height: 18px; margin: 0;
            -webkit-appearance: none; appearance: none;
            background: none; pointer-events: none;
        }
        /* Ловит указатель только сама ручка: иначе верхний ползунок накрыл бы
           нижний целиком, и вторую ручку было бы не взять. */
        .sched-range input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; pointer-events: auto; cursor: grab;
            width: 13px; height: 13px; border-radius: 50%;
            background: #fff; border: 2px solid #4f46e5;
        }
        .sched-range input[type=range]::-moz-range-thumb {
            pointer-events: auto; cursor: grab;
            width: 13px; height: 13px; border-radius: 50%;
            background: #fff; border: 2px solid #4f46e5;
        }
        .sched-range input[type=range]:focus-visible::-webkit-slider-thumb {
            box-shadow: 0 0 0 3px #c7d2fe;
        }
        /* Пересекающиеся смены — красным и на ручках: строка и лента говорят об
           одном, и глаз не должен искать, к какой из них относится сообщение. */
        .sched-row.clash .sched-range input[type=range]::-webkit-slider-thumb { border-color: #dc2626; }
        .sched-row.clash .sched-range input[type=range]::-moz-range-thumb { border-color: #dc2626; }
        .sched-row.clash .sched-fill { background: #fca5a5; }

        .sched-drop {
            margin-left: auto; border: none; background: none; cursor: pointer;
            color: #cbd5e1; font-size: 15px; line-height: 1; padding: 0 2px;
        }
        .sched-drop:hover { color: #b91c1c; }

        .sched-add { display: flex; gap: 6px; margin-top: 7px; }
        .sched-add-btn { font-size: 11px; padding: 3px 9px; }

        /* Лента суток — то единственное, ради чего этот блок выглядит не как
           список полей. Расписание отвечает на вопрос «когда анкета в сети», и
           ответ на него — полоса, а не строки: по ней сразу видно и дыры между
           сменами, и главную беду — вход, за которым не идёт выход. */
        .sched-day {
            position: relative; height: 16px; margin-top: 9px;
            border-radius: 4px; background: #f1f5f9; overflow: hidden;
        }
        /* Полоса смены. «Незакрытой» полосы больше не бывает: выход есть у каждой
           записи по устройству — смена и есть пара «вход-выход». */
        .sched-span { position: absolute; top: 0; bottom: 0; background: #a5b4fc; }
        .sched-span.clash { background: #fca5a5; }

        .sched-hours {
            display: flex; justify-content: space-between;
            font-size: 9px; color: #cbd5e1; margin-top: 2px;
        }

        /* Расписание не действует. ⚠ Приглушаем, но **не запираем**: править смены
           у выключенной анкеты законно — её включат, и они понадобятся. Запертая
           форма означала бы «нельзя», а нельзя тут только одно — ждать, что она
           войдёт. */
        .sched.idle .sched-list, .sched.idle .sched-day { opacity: .55; }
        .sched-idle {
            margin: 2px 0 7px; padding: 5px 8px; border-radius: 6px;
            background: #fff7ed; color: #9a3412; font-size: 11px; line-height: 1.35;
        }

        .sched-empty { font-size: 11px; color: #94a3b8; padding: 6px 0; }
        /* Полоса суток под сменами: та же ширина, что у списка. */
        .sched-day { max-width: 100%; }
        .sched-warn { color: #b91c1c; }

        /* Блоки настроек идут один под другим, и без границы «Учётка» и
           «Автоответ» читаются как одна длинная форма: у обеих поля ввода и
           кнопка «Сохранить», а сохраняют они разное. Разделяем линией и
           воздухом — заголовок блока при этом остаётся его единственной меткой. */
        .edit-body { display: flex; flex-direction: column; }
        .edit-body > * + * {
            margin-top: 16px; padding-top: 16px; border-top: 1px solid #eef2f7;
        }

        /* Заголовок с засечкой слева: он и так набран капителью, но в столбце из
           четырёх блоков глазу нужна точка, за которую цепляться при прокрутке. */
        .edit-body h4 {
            display: flex; align-items: center; gap: 6px;
        }
        .edit-body h4::before {
            content: ''; width: 3px; height: 11px; border-radius: 2px;
            background: #c7d2fe; flex: 0 0 auto;
        }

        /* ---------- Раскрытая карточка ---------- */

        .prof-form { display: flex; flex-direction: column; gap: 7px; }
        .prof-form h4 {
            margin: 0; font-size: 10px; font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .prof-line { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }

        .prof-card-note { font-size: 11px; color: #94a3b8; }
        .prof-card-note.bad { color: #b91c1c; }

        /* ── Настройки анкеты в правой колонке ───────────────────────────────
           Пришли на место списка собеседниц: тот живёт на «Профилях», в окне
           переписки, и держать его в двух местах значило расходиться в мелочах. */
        .prof-set { padding: 4px 0; }
        .prof-set-head {
            padding: 8px 12px; font-size: 10px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .prof-set-row {
            display: flex; align-items: flex-start; gap: 9px; padding: 10px 12px;
            border-top: 1px solid #f1f5f9; cursor: pointer;
        }
        .prof-set-row:hover { background: #f8fafc; }
        .prof-set-row input { margin-top: 2px; cursor: pointer; accent-color: #16a34a; }
        .prof-set-row b { display: block; font-size: 13px; color: #1f2937; font-weight: 600; }
        /* Пояснение под подписью, а не подсказкой: выключатель редкий и
           последствия у него широкие — их читают один раз и запоминают, а
           наводить мышь ради этого никто не станет. */
        .prof-set-row i {
            display: block; margin-top: 2px; font-style: normal; font-size: 11px;
            color: #94a3b8; line-height: 1.4;
        }
        /* Выключенная — приглушённой: состояние видно, не читая подписи. */
        .prof-set-row.off b { color: #b45309; }
        .prof-set-row.off input { accent-color: #b45309; }

        /* Полоса удаления. Отбита сверху и отступом: необратимое действие не
           должно попадаться под руку рядом с галочками, которые щёлкают походя. */
        .prof-set-danger {
            margin-top: 14px; padding: 12px; border-top: 1px solid #f1f5f9;
        }
        .prof-set-danger i {
            display: block; margin-top: 6px; font-style: normal; font-size: 11px;
            color: #94a3b8; line-height: 1.4;
        }
        .dating-btn.danger { border-color: #fecaca; color: #b91c1c; }
        .dating-btn.danger:hover:not(:disabled) { background: #fef2f2; border-color: #f87171; }

        /* Значок выключенной анкеты в списке слева. */
        .prof-off {
            margin-left: auto; flex: 0 0 auto; padding: 1px 5px; border-radius: 4px;
            background: #fef3c7; color: #b45309; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .03em;
        }

        /* Профиль с сайта и собеседницы (`.card*`, `.contact*`, `.msg*`, `.need`)
           переехали в `dating_page.css`: тот же чат показывает вкладка «Чат» на
           «Профилях», и две копии разошлись бы в мелочах — а мелочи здесь и есть
           смысл (мигающая метка «нужен ответ», свои реплики справа).

           Журнал (`.log-*`) переехал в `dating_page.css`: те же строки той же ручки
           показывают и «Профили». */

        .empty { padding: 14px; color: #9ca3af; font-size: 12px; text-align: center; }
    </style>
{% endblock %}

{% block content %}
<div class="dating-page">

    <div class="dating-head">
        <h1>🌐 Сайт</h1>
        <select id="siteSelect" title="Сайт, на котором заведены анкеты"></select>
        <button type="button" class="dating-btn primary" id="addBtn">+ девушка</button>
        <span class="dating-hint" id="hint"></span>
    </div>

    <div class="pane dating-profiles-pane">
        <div class="pane-head">
            Девушки <span id="profilesN"></span>
            <input type="search" id="profileFind" class="pane-find" placeholder="имя или ID"
                   spellcheck="false" autocomplete="off" title="Быстрый поиск по имени или номеру анкеты">
        </div>
        <div class="dating-form" id="form">
            <input type="text" id="login" placeholder="логин или почта" spellcheck="false" autocomplete="off">
            <input type="password" id="password" placeholder="пароль" autocomplete="new-password">
            <input type="text" id="note" placeholder="пометка (необязательно)">
            <div class="dating-form-row">
                <button type="button" class="dating-btn primary" id="saveBtn">Сохранить</button>
                <button type="button" class="dating-btn" id="cancelBtn">Отмена</button>
            </div>
        </div>
        <div class="pane-body" id="profiles"></div>
        <div class="pane-foot" id="profilesPager"></div>
    </div>

    <div class="split split-col" id="splitCol" title="Потяните, чтобы изменить ширину"></div>

    <div class="dating-right">
        <div class="pane">
            <div class="pane-head">Анкета<span id="profileWho"></span></div>
            <div class="pane-body" id="profile"></div>
        </div>

    </div>
</div>

<script type="module">
    import {getData, postData, putData, deleteData} from '{{ static_url('js/api.js') }}';
    import {showNotification} from '{{ static_url('js/notification.js') }}';
    // Значки и бейджи учётки — общие с «Профилями»: обе страницы рисуют строки
    // одной и той же ручки, и две копии разошлись бы в мелочах.
    // Из общих помощников странице остались только эти. Карточка списка теперь
    // показывает лицо, имя и почту — точке состояния, бейджам работы и значку
    // тревоги места в ней нет; журнала на странице нет вовсе, и `logRender` с
    // `logStamp` ей больше не нужны. Всё это осталось на «Профилях».
    import {esc, pagerRender} from '{{ static_url('js/dating_view.js') }}';
    // Загрузка селекта сайта — тоже общая: ключ выбора один на весь раздел.
    import {DATING_SITE_KEY, datingSiteFill} from '{{ static_url('js/dating_site.js') }}';

    // Под каким URI живёт панель. Локально пусто (корень домена), на проде —
    // `/dating`: домен один на два проекта, и делится он по пути. Прокси префикс
    // срезает, поэтому сервер видит обычные пути, а вот браузер обязан просить
    // именно с префиксом — иначе запрос уйдёт соседу.
    const BASE = '{{ base }}';

    const SIZE_KEY = 'dating_layout';
    const PROBE_MS = 15000;
    // Сколько анкет на странице. Столько влезает в колонку без прокрутки на
    // обычном экране — прокрутка вместе со страницами это две навигации сразу.
    const PAGE_SIZE = 8;

    const siteEl = document.getElementById('siteSelect');
    const profilesEl = document.getElementById('profiles');
    const profileEl = document.getElementById('profile');
    const formEl = document.getElementById('form');
    const findEl = document.getElementById('profileFind');
    const pagerEl = document.getElementById('profilesPager');
    const pageEl = document.querySelector('.dating-page');

    let profiles = [], currentId = 0, probeBusy = false;
    // Ответ карточки целиком: из него берут и настройки, и расписание.
    let cardData = null;
    // Черновик расписания по анкете: правки до сохранения. Ключ — id анкеты.
    const scheduleDraft = new Map();
    let profilesPage = 0;

    // Какие анкеты сейчас заняты долгим действием: id → {btn, label}.
    //
    // Состояние живёт здесь, а не в самой кнопке, потому что список
    // перерисовывается целиком — и своим таймером, и тикером долгого действия
    // (каждые 2 секунды: статус карточки меняется по ходу входа). Пометь мы
    // кнопку напрямую, первая же перерисовка вернула бы ей вид «Войти», хотя
    // вход идёт, — и человек жал бы её второй раз.

    async function sitesLoad() {
        try {
            await datingSiteFill(siteEl, BASE);
        } catch (e) {
            say('список сайтов не пришёл: ' + e.message, true);
            return;
        }
        profilesLoad();
    }

    const siteId = () => Number(siteEl.value || 0);

    async function profilesLoad() {
        if (!siteId()) {
            profilesEl.innerHTML = '<div class="empty">заведите сайт на /admin/browser</div>';
            return;
        }
        // Сайт, под который ушёл запрос, запоминаем отдельно от значения в селекте:
        // profilesLoad() зовёт и фоновый опрос (probe, каждые 15 секунд), и смена сайта
        // человеком — а пока первый запрос летит, человек успевает выбрать другой
        // сайт и выстрелить вторым. Если ответ по старому сайту придёт позже ответа
        // по новому, без сверки siteId() с тем, что было на старте, он перепишет
        // общий список `profiles` данными не того сайта, что выбран сейчас.
        const requestSite = siteId();
        try {
            profiles = (await getData(BASE + '/api/dating/profile?site_id=' + requestSite)).result || [];
        } catch (e) {
            if (siteId() !== requestSite) return;
            say('список не пришёл: ' + e.message, true);
            return;
        }
        if (siteId() !== requestSite) return;

        profilesRender();
    }

    // Пейджер один на два списка: анкеты режутся здесь же, собеседницы приходят
    // страницей с сервера — разная у них только выборка, а кнопки одни и те же.
    // Номера страниц наружу 0-based: у анкет по ним же считается срез списка.
    //
    // Страницы рисуются кнопками, а не «умным» диапазоном: анкет и собеседниц
    // сотни, а не тысячи, и десяток кнопок читается лучше многоточий.
    // Поиск фильтрует уже загруженный список, а не ходит на сервер: список
    // приходит целиком на сайт, и лишний запрос на каждую букву ничего не уточнит,
    // зато отзывчивость потеряет.
    function profilesMatch(row) {
        const q = (findEl.value || '').trim().toLowerCase();
        if (!q) return true;

        return String(row.name || '').toLowerCase().includes(q)
            || String(row.login || '').toLowerCase().includes(q)
            || String(row.note || '').toLowerCase().includes(q);
    }

    function profilesRender() {
        const found = profiles.filter(profilesMatch);

        // В шапке всегда общее число анкет, а при поиске — ещё и сколько нашлось.
        // «Сколько всего» не должно меняться от того, что набрали в поиске.
        document.getElementById('profilesN').textContent =
            found.length === profiles.length ? (profiles.length || '')
                                          : `${found.length} из ${profiles.length}`;

        // Страница могла уехать за конец списка — после поиска или удаления анкеты.
        const pages = Math.max(1, Math.ceil(found.length / PAGE_SIZE));
        if (profilesPage >= pages) profilesPage = pages - 1;

        const shown = found.slice(profilesPage * PAGE_SIZE, (profilesPage + 1) * PAGE_SIZE);
        pagerRender(pagerEl, pages, profilesPage, (page) => {
            profilesPage = page;
            profilesRender();
            profilesEl.scrollTop = 0;
        });

        profilesEl.innerHTML = '';
        if (!profiles.length) {
            profilesEl.innerHTML = '<div class="empty">девушек нет — добавьте первую</div>';
            return;
        }
        if (!found.length) {
            profilesEl.innerHTML = '<div class="empty">по запросу никого не нашлось</div>';
            return;
        }

        for (const row of shown) {
            const el = document.createElement('div');
            el.className = 'profile' + (row.id === currentId ? ' active' : '');
            // Лицо, имя, почта — и больше ничего. Теми же классами, что строка на
            // «Профилях»: одна учётка должна выглядеть одинаково на обеих
            // страницах.
            el.innerHTML = '<span class="prof-who">'
                + `<img class="profile-face" src="${esc(row.photo || '')}" alt="" referrerpolicy="no-referrer"`
                + ' onerror="this.style.visibility=\'hidden\'">'
                + '<span class="prof-who-text">'
                // Имя режется многоточием в узкой колонке — полное отдаём подсказкой.
                + `<span class="prof-name" title="${esc(row.name || row.login)}">${esc(row.name || row.login)}</span>`
                + `<span class="prof-login" title="${esc(row.login)}">${esc(row.login)}</span>`
                + '</span></span>'
                // ⚠ Выключенную анкету видно **в списке**, а не только в её
                // карточке: иначе, глядя на сотню строк, человек не понимает,
                // почему часть из них молчит, — и лезет искать поломку.
                + (row.enabled === false
                    ? '<span class="prof-off" title="Анкета выключена: воркер её не ведёт">'
                      + 'выкл</span>'
                    : '');

            el.addEventListener('click', () => profileSelect(row.id));
            profilesEl.appendChild(el);
        }

        if (!currentId && profiles.length) profileSelect(profiles[0].id);
    }

    // Выбор девушки меняет обе правые области: профиль и журнал раздельные по
    // учётке — общая лента по сотне анкет ничего не говорит.
    async function profileSelect(id) {
        currentId = id;
        // Карточку открыли — новые сообщения этой учётки перестают быть новыми.
        // Отметка молчаливая: не вышла, значит бейдж просто повисит лишний круг.
        try { await postData(`${BASE}/api/dating/profile/${id}/read`, {}); } catch (e) {}
        profilesLoad();
        await profileLoad();
    }

    // Собеседницы приходят страницей с сервера, а не целиком: их бывают сотни, а
    // на каждую показанную сервер ещё и читает последние реплики. Порядок тоже его:
    // сначала неотвеченные, дальше по свежести — считать это здесь значило бы
    // раскладывать пятьдесят строк, ничего не зная про остальные триста пятьдесят.
    async function profileLoad() {
        if (!currentId) return;
        // Анкету, для которой ушёл запрос, запоминаем отдельно от currentId: функцию
        // зовёт фоновый опрос каждые 15 секунд, и пока ответ летит, человек успевает
        // выбрать другую анкету — profileSelect() тут же переставит currentId и запустит
        // свой profileLoad(). Если ответ по старой анкете придёт позже ответа по новой,
        // без сверки currentId с requestId он перепишет разметку
        // профиля данными не той анкеты, что выбрана сейчас. Гонка сети, а не логики —
        // при обычном чтении кода и в автотестах по HTTP она не видна.
        const requestId = currentId;
        const profile = profiles.find(g => g.id === currentId) || {};
        document.getElementById('profileWho').textContent = profile.login || '';

        let data;
        try {
            data = (await getData(`${BASE}/api/dating/profile/${requestId}/card`))
                        .result || {};
        } catch (e) {
            if (currentId !== requestId) return;
            profileEl.innerHTML = `<div class="empty">профиль не пришёл: ${esc(e.message)}</div>`;
            return;
        }
        if (currentId !== requestId) return;

        cardData = data;

        // В шапке — сколько собеседников всего. Список их живёт на «Профилях», но
        // само число здесь к месту: по нему видно, работает ли анкета вообще.
        document.getElementById('profileWho').textContent =
            `${profile.login || ''}${data.contacts_total ? ` · собеседников: ${data.contacts_total}` : ''}`;

        const p = data.profile || {};
        const head = `<div class="card">
            <img src="${esc(p.photo || '')}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
            <div>
                <div class="card-name">${esc(p.name || data.login || '')}</div>
                <div class="card-meta">ID ${esc(String(p.id || data.login || ''))}
                    ${p.age ? ' · ' + p.age : ''}${p.city ? ' · ' + esc(p.city) : ''}</div>
                <div class="card-meta">${esc(p.about || 'описание профиля сайт не отдал')}</div>
            </div></div>`;

        // ⚠ **Собеседниц здесь больше нет.** Диалоги живут на «Профилях», в окне
        // переписки: тот же список в двух местах расходился в мелочах (порядок,
        // счётчики, значок «нужен ответ»), и человек не знал, какому верить. Здесь
        // осталось то, чего нет там, — **настройки самой анкеты**.
        const scroll = profileEl.scrollTop;
        profileEl.innerHTML = head + settingsBlock(data);
        profileEl.scrollTop = scroll;

        settingsBind();
    }

    // Смены, отсортированные по времени входа. Сортируем при каждой отрисовке:
    // время правят ползунком, и смена, заведённая последней, может оказаться
    // первой по времени.
    // ⚠ **Черновик заводится от сохранённого, а не пустым.**
    //
    // Правки живут в памяти, пока их не сохранили: ползунок двигают подряд, и
    // запрос на каждое движение был бы сотней запросов. Но начинать с пустого
    // нельзя — человек увидел бы «Пока пусто» у анкеты, у которой расписание есть.
    function scheduleRows(profileId) {
        if (!scheduleDraft.has(profileId)) {
            const saved = (cardData && cardData.schedule) || [];
            scheduleDraft.set(profileId, saved.map(item => ({...item})));
        }

        const rows = scheduleDraft.get(profileId) || [];

        return [...rows].sort((a, b) => (a.from || '').localeCompare(b.from || ''));
    }

    // Расписание годно, когда у каждой смены выход позже входа и смены не
    // налезают друг на друга.
    function scheduleCheck(rows) {
        if (!rows.length) return 'Расписания нет — анкета входит и выходит вручную';

        const empty = rows.find(row => !row.from || !row.to);
        if (empty) return 'У каждой смены должны быть вход и выход';

        // Выход строго позже входа. Равенство тоже не годится: смена нулевой
        // длины — это вход, за которым сразу выход, то есть ничего.
        const backwards = rows.find(row => row.to <= row.from);
        if (backwards) return `Смена ${backwards.from}–${backwards.to}: выход не позже входа`;

        // **Смены не перекрываются.** Анкета не может войти второй раз, не выйдя:
        // сайт держит одну сессию на учётку, и второй вход выбросил бы первую.
        // Проверяем по соседям в отсортированном списке — этого достаточно, чтобы
        // поймать любое пересечение.
        const overlap = scheduleOverlap(rows);
        if (overlap >= 0) {
            return `Смены ${rows[overlap - 1].from}–${rows[overlap - 1].to} и `
                 + `${rows[overlap].from}–${rows[overlap].to} налезают друг на друга`;
        }

        return '';
    }

    // Номер смены, которая начинается раньше, чем кончилась предыдущая.
    // `-1` — пересечений нет. Отдельной функцией: ответ нужен и словами под
    // кнопкой, и подсветкой самой строки.
    function scheduleOverlap(rows) {
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].from < rows[i - 1].to) return i;
        }

        return -1;
    }

    // Сутки в минутах — мера всей шкалы: ползунок ходит от 0 до 1440.
    const DAY_MINUTES = 24 * 60;

    // Шаг ползунка. Четверть часа, а не минута: на ширине колонки минутный шаг
    // даёт меньше пикселя на деление, и попасть в «10:00» мышью нельзя. Круглые
    // времена, которыми расписание и задают, кратны пятнадцати все до одного.
    const STEP_MINUTES = 15;

    const timeText = (minutes) => {
        const m = Math.max(0, Math.min(Number(minutes) || 0, DAY_MINUTES));
        return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:`
             + `${String(m % 60).padStart(2, '0')}`;
    };

    const timeMinutes = (text) => {
        const [h, m] = String(text || '0:0').split(':').map(Number);
        return (Number.isFinite(h) ? h : 0) * 60 + (Number.isFinite(m) ? m : 0);
    };

    // Подпись к смене: «10:00 → 15:00». Стрелка, а не тире: это не диапазон
    // значений, а вход и выход — у них есть направление.
    function timeLabel(item) {
        return `${esc(item.from)} <span class="exact">→</span> ${esc(item.to)}`;
    }

    // Ползунок смены: вся ширина — сутки, левая ручка вход, правая выход.
    // Заливка между ними и есть время, когда анкета в сети.
    function rangeInput(item) {
        const from = timeMinutes(item.from);
        const to = timeMinutes(item.to);
        const left = (Math.min(from, to) / DAY_MINUTES) * 100;
        const width = (Math.abs(to - from) / DAY_MINUTES) * 100;

        const slider = (edge, value) =>
            `<input type="range" min="0" max="${DAY_MINUTES}" step="${STEP_MINUTES}"`
            + ` value="${value}" data-edge="${edge}"`
            + ` aria-label="${edge === 'from' ? 'вход' : 'выход'}">`;

        return '<div class="sched-range">'
             + '<div class="sched-track"></div>'
             + `<div class="sched-fill" style="left:${left}%;width:${width}%"></div>`
             + slider('from', from) + slider('to', to)
             + '</div>';
    }

    // Лента суток: смены полосами на шкале от полуночи до полуночи.
    //
    // Ради неё блок и не выглядит списком полей. Расписание отвечает на вопрос
    // «когда анкета в сети», а строки на него не отвечают — это надо складывать в
    // уме. На ленте сразу видны и дыры между сменами, и налезающие друг на друга
    // смены: их полосы перекрываются.
    function scheduleDay(rows) {
        const percent = (time) => (timeMinutes(time) / DAY_MINUTES) * 100;

        const spans = rows.map((item, index) => {
            const left = percent(item.from);
            const width = Math.max(percent(item.to) - left, 0.6);

            return `<span class="sched-span${index === scheduleOverlap(rows) ? ' clash' : ''}"`
                 + ` style="left:${left}%;width:${width}%"></span>`;
        }).join('');

        return `<div class="sched-day">${spans}</div>`
             + '<div class="sched-hours"><span>00</span><span>06</span><span>12</span>'
             + '<span>18</span><span>24</span></div>';
    }

    // Правит черновик и перерисовывает настройки. Перерисовываем целиком, а не
    // одну строку: от правки времени меняется порядок смен и вся лента суток, и
    // подновлять их по кусочкам значило бы держать два способа рисовать одно.
    //
    // Только настройки, не список: расписание в таблице не показано, а лишняя
    // перерисовка под руками стоит мигания.
    // Единственная точка правки расписания — сюда и подключено автосохранение.
    // ⚠ Одна точка, а не вызов из каждого обработчика: правок четыре (добавить,
    // убрать, двинуть левую ручку, двинуть правую), и забытый вызов означал бы
    // «эта правка не сохраняется», причём молча.
    function scheduleEdit(profileId, change) {
        const rows = [...(scheduleDraft.get(profileId) || [])];
        change(rows);
        scheduleDraft.set(profileId, rows);
        profileLoad();
        scheduleSaveSoon(profileId);
    }

    function scheduleBind(card, row) {
        const form = card.querySelector('[data-form="schedule"]');
        if (!form) return;

        // Новая смена встаёт в **первый свободный промежуток**, а не в конец:
        // смены не перекрываются, и запись, севшая поверх соседки, была бы
        // негодной с первой секунды.
        form.querySelector('.sched-add-btn').addEventListener('click', () => {
            const room = scheduleRoom(scheduleRows(row.id));
            if (!room) return;

            scheduleEdit(row.id, rows => rows.push({from: timeText(room.from),
                                                    to: timeText(room.to)}));
        });

        // Строки читаем в том же порядке, в каком нарисовали (по времени входа), —
        // иначе `data-index` указывал бы не на ту смену.
        const shown = scheduleRows(row.id);
        form.querySelectorAll('.sched-row').forEach((line, index) => {
            const item = shown[index];

            line.querySelector('.sched-drop').addEventListener('click', () =>
                scheduleEdit(row.id, rows => rows.splice(rows.indexOf(item), 1)));

            // Ползунок шлёт `input` на каждое движение ручки. Перерисовывать по
            // нему всю колонку нельзя: новый узел не получит захвата указателя, и
            // ручка выскользнет из-под пальца на первом же шаге. Поэтому пока
            // тянут — правим черновик и подкрашиваем эту же строку на месте, а
            // перерисовку откладываем до `change`, то есть до отпускания.
            const sliders = [...line.querySelectorAll('input[type=range]')];
            const fill = line.querySelector('.sched-fill');
            const label = line.querySelector('.sched-time');

            const readEdges = () => {
                // Ручки не меняются местами: меньшая — вход, большая — выход.
                // Иначе, перетащив вход за выход, человек получил бы смену
                // наизнанку и отрицательную ширину заливки.
                const values = sliders.map(s => Number(s.value)).sort((a, b) => a - b);

                return {from: timeText(values[0]), to: timeText(values[1])};
            };

            sliders.forEach(slider => {
                slider.addEventListener('input', () => {
                    const edges = readEdges();
                    const draft = scheduleDraft.get(row.id) || [];
                    const found = draft[draft.indexOf(item)];
                    if (found) { found.from = edges.from; found.to = edges.to; }

                    const left = (timeMinutes(edges.from) / DAY_MINUTES) * 100;
                    const width = ((timeMinutes(edges.to) - timeMinutes(edges.from))
                                   / DAY_MINUTES) * 100;
                    fill.style.left = `${left}%`;
                    fill.style.width = `${width}%`;
                    label.innerHTML = timeLabel(edges);
                });

                // Отпустили — можно и пересортировать смены, и перерисовать ленту:
                // захватывать больше нечего.
                slider.addEventListener('change', () => scheduleEdit(row.id, rows => {
                    const found = rows[rows.indexOf(item)];
                    if (!found) return;
                    const edges = readEdges();
                    found.from = edges.from;
                    found.to = edges.to;
                }));
            });
        });

        // Форму не отправляют — Enter в ней не должен перезагружать страницу.
        form.addEventListener('submit', (e) => e.preventDefault());

        const door = form.querySelector('.sched-door');
        if (door) door.addEventListener('click', () => doorToggle(row));
    }

    // ── Автосохранение расписания ────────────────────────────────────────────
    //
    // ⚠ **Сохраняем не сразу, а через паузу.** Ползунок двигают подряд, и запрос
    // на каждое движение был бы сотней запросов за один перетаскивание. Ждём, пока
    // человек остановится, и шлём один раз.
    //
    // Пауза короткая: полсекунды. Дольше — и человек успевает уйти со страницы,
    // считая, что сохранено; короче — и «остановился» срабатывает посреди
    // движения.
    const SCHEDULE_SAVE_MS = 500;
    let scheduleTimer = 0;

    function scheduleSaveSoon(profileId) {
        clearTimeout(scheduleTimer);
        scheduleTimer = setTimeout(() => scheduleSave(profileId), SCHEDULE_SAVE_MS);
    }

    async function scheduleSave(profileId) {
        const rows = scheduleRows(profileId);

        // ⚠ Негодное не отправляем **и не жалуемся**: при автосохранении человек
        // ещё правит, и ругаться на промежуточное состояние («смены налезают»)
        // значило бы кричать на каждое движение ползунка. Причина и так написана
        // под формой, а сохранится расписание, когда станет годным.
        if (scheduleCheck(rows) && rows.length) return;

        const note = document.querySelector('.sched-note');
        try {
            await putData(`${BASE}/api/dating/profile/${profileId}/schedule`,
                          {schedule: rows});
            // Черновик снимаем: сохранённое теперь приходит с сервера, и держать
            // вторую копию значит однажды показать её вместо правды.
            scheduleDraft.delete(profileId);
            if (note) {
                note.textContent = 'сохранено';
                note.classList.add('saved');
            }
        } catch (err) {
            say('расписание не сохранилось: ' + err.message, true);
        }
    }

    function scheduleBlock(row) {
        // Пусто у выключенной — не то же, что «расписания нет»: смены на месте,
        // просто сейчас они ни на что не влияют.
        const idle = (cardData && cardData.schedule_idle) || '';
        const rows = scheduleRows(row.id);
        const why = scheduleCheck(rows);
        const overlap = scheduleOverlap(rows);

        const list = rows.length
            ? rows.map((item, index) =>
                `<div class="sched-row${index === overlap ? ' clash' : ''}"`
                + ` data-index="${index}">`
                + '<div class="sched-head">'
                + `<span class="sched-kind">Смена ${index + 1}</span>`
                + `<span class="sched-time">${timeLabel(item)}</span>`
                + '<button type="button" class="sched-drop" title="Убрать смену">×</button>'
                + '</div>'
                + rangeInput(item)
                + '</div>').join('')
            : '<div class="sched-empty">Пока пусто. Добавьте смену — '
              + 'анкета будет входить и выходить сама.</div>';

        // Кнопка одна: смена и есть единица расписания. Отдельных «вход» и
        // «выход» больше нет — порознь они и позволяли завести «вход, вход».
        // Гаснет, когда сутки заняты целиком и новую смену ставить некуда.
        const room = scheduleRoom(rows);

        return `<form class="sched${idle ? ' idle' : ''}" data-form="schedule">`
            + '<div class="sched-title">Расписание</div>'
            // ⚠ У выключенной анкеты расписание **не действует**, и сказать это
            // надо прямо: блок выглядит рабочим, человек правит смены и ждёт, что
            // анкета войдёт в семь утра, — а она не войдёт.
            //
            // Причину считает сервер (`schedule_idle`): правило одно, и повторять
            // его здесь значило бы два места, которые однажды разойдутся.
            + (idle
                ? `<div class="sched-idle">${esc(idle)}</div>`
                : '<div class="sched-note">Когда анкете быть в сети. '
                  + 'Пусто — ведём руками.</div>')
            + `<div class="sched-list">${list}</div>`
            + '<div class="sched-add">'
            + `<button type="button" class="dating-btn sched-add-btn"${room ? '' : ' disabled'}`
            + ` title="${room ? 'Добавить смену в свободное время'
                              : 'Свободного времени в сутках не осталось'}">`
            + '+ Смена</button>'
            + '</div>'
            + (rows.length ? scheduleDay(rows) : '')
            // ⚠ Кнопки «Сохранить» здесь нет: правки уходят сами, как только
            // отпущен ползунок. Расписание правят ползунком, и кнопка после
            // каждого движения означала бы «подвигал и забыл сохранить» —
            // молчащую анкету без единого признака, что что-то не так.
            //
            // На её месте — вход и выход: это то, ради чего на расписание и
            // смотрят («сейчас должна быть в сети — а она?»), и держать их в
            // другом блоке значило разводить вопрос и ответ по разным местам.
            + '<div class="sched-foot">'
            + doorButton(row)
            + `<span class="sched-note${why && rows.length ? ' sched-warn' : ''}">`
            + `${esc(why || 'Сохраняется само · левая ручка — вход, правая — выход, '
                          + 'шаг четверть часа')}</span>`
            + '</div>'
            + '</form>';
    }

    // Кнопка входа-выхода. ⚠ Подпись по состоянию: в сети — «Выйти», иначе
    // «Войти». Две кнопки рядом означали бы, что одна из них всегда бесполезна, а
    // человек всё равно читает обе, прежде чем нажать.
    function doorButton(row) {
        const online = row.status === 'online';
        const busyNow = doorBusy.has(row.id);

        if (busyNow) {
            return '<button type="button" class="dating-btn sched-door" disabled>'
                 + '<span class="dating-spin"></span>Жду…</button>';
        }

        // Войти нечем без пароля; выйти нечем без снятого входа.
        const можно = online ? row.has_state : row.has_password;

        return `<button type="button" class="dating-btn ${online ? '' : 'primary '}sched-door"`
             + `${можно ? '' : ' disabled'}`
             + ` title="${online ? 'Выйти на сайте и снять сокет'
                                 : (row.has_password
                                     ? 'Войти сценарием и повесить сокет — минуты живого браузера'
                                     : 'у учётки не задан пароль')}">`
             + `${online ? 'Выйти' : 'Войти'}</button>`;
    }

    // Куда встанет новая смена: первый промежуток, свободный от уже заведённых.
    // `null` — свободного места нет.
    //
    // Ищем сами, а не ставим «в конец»: смены не перекрываются, и запись, севшая
    // поверх соседки, была бы негодной с первой же секунды. Пусть человек двигает
    // готовую смену, а не чинит только что созданную.
    function scheduleRoom(rows) {
        const need = STEP_MINUTES * 2;   // смене нужна хотя бы получасовая ширина
        let cursor = 0;

        for (const item of rows) {
            const start = timeMinutes(item.from);
            if (start - cursor >= need) return {from: cursor, to: cursor + need * 2};
            cursor = Math.max(cursor, timeMinutes(item.to));
        }

        if (DAY_MINUTES - cursor >= need) {
            return {from: cursor, to: Math.min(cursor + need * 2, DAY_MINUTES)};
        }

        return null;
    }

    // Долгое действие: вход, отключение — минуты живого браузера.
    //
    // ⚠ Запираем **все** кнопки блока, а не одну нажатую: пока идёт вход, «Удалить»
    // и «Отключить» тоже нажимать нельзя — они про ту же учётку, и второе действие
    // поверх первого оставит сессию у соседа незакрытой.
    //
    // Журнала здесь нет (он на «Профилях»), поэтому ход действия не подтягиваем:
    // итог придёт уведомлением, а подробности человек смотрит там же, где журнал.
    async function longRun(row, run) {
        const btns = [...profileEl.querySelectorAll('.prof-form button')];
        btns.forEach(b => { b.disabled = true; });

        try {
            return await run();
        } finally {
            await profilesLoad();
            await profileLoad();
        }
    }

    // Настоящий вход: сценарий проходит форму в живом браузере, снимает состояние
    // и спрашивает сайт, признал ли он вход. Идёт минутами — сайт единственный,
    // кто знает ответ, и торопить его нечем.
    // Занятость кнопки входа-выхода. ⚠ Переменной, а не только `disabled`:
    // карточка перерисовывается своим кругом, и перерисовка вернула бы кнопке
    // обычный вид — её нажали бы второй раз, то есть погнали второй вход под той
    // же анкетой.
    const doorBusy = new Set();

    // Вход или выход — по состоянию анкеты.
    //
    // ⚠ **Сокет здесь не отдельное действие.** Вход сценарием заканчивается тем,
    // что браузер подсматривает адрес чат-сокета и кладёт его в анкету; держатель
    // подхватывает адрес в течение минуты и поднимает соединение сам. Выход
    // гасит адрес — держатель следующим кругом отпускает сокет.
    //
    // Поэтому «повесить сокет» и «удалить сокет» — не команды, а следствия входа и
    // выхода. Дёргать сокет отдельно значило бы получить соединение по мёртвой
    // сессии или живую сессию без соединения.
    async function doorToggle(row) {
        if (doorBusy.has(row.id)) return;

        doorBusy.add(row.id);
        await profileLoad();
        try {
            if (row.status === 'online') {
                await profileDisconnect(row);
            } else {
                await profileLogin(row);
            }
        } finally {
            doorBusy.delete(row.id);
            await profilesLoad();
            await profileLoad();
        }
    }

    async function profileLogin(row) {
        await longRun(row, async () => {
            try {
                const res = (await postData(`${BASE}/api/dating/profile/${row.id}/login`, {})).result || {};
                showNotification(res.status === 'error' ? `Вход не прошёл: ${res.error}`
                                                        : `Вход выполнен: ${res.scenario}`,
                                 res.status === 'error' ? 'error' : 'success');
            } catch (e) {
                showNotification('Войти не вышло: ' + e.message, 'error');
            }
        });
    }

    async function profileDisconnect(row) {
        if (!confirm(`Отключить «${row.name || row.login}»? Выйдем с сайта, закроем вкладки `
                   + 'и снимем анкету с автовхода. Переписка и журнал останутся.')) return;

        await longRun(row, async () => {
            try {
                const res = (await postData(`${BASE}/api/dating/profile/${row.id}/disconnect`, {})).result || {};
                showNotification(res.logout ? 'Отключено, выход на сайте выполнен'
                                            : 'Отключено; выход на сайте не подтверждён',
                                 res.logout ? 'success' : 'info');
            } catch (e) {
                showNotification('Отключить не вышло: ' + e.message, 'error');
            }
        });
    }

    // ── Настройки анкеты ─────────────────────────────────────────────────────
    //
    // Первый выключатель — сама анкета. ⚠ Не то же, что «ai-ответ» на «Профилях»:
    // тот про то, **кто** отвечает (агент или человек), а этот — **ведём ли** мы
    // анкету вовсе. Выключенную воркер не трогает ничем: ни автоответ, ни отправка.
    // Входящие при этом принимаются, и это сказано прямо — иначе выключатель
    // читается как «отключить от сайта».
    function settingsBlock(data) {
        const on = data.enabled !== false;
        // Строка списка: в ней логин, пароль, роль и пометка — то, что правят
        // формы ниже. В `data` их нет: карточка отдаёт анкету с сайта, а не учётку.
        const row = profiles.find(g => g.id === currentId) || {};

        return '<div class="prof-set">'
            + '<div class="prof-set-head">Настройки анкеты</div>'
            + `<label class="prof-set-row${on ? '' : ' off'}">`
            + `<input type="checkbox" id="enabledBox"${on ? ' checked' : ''}>`
            + '<span><b>Анкета включена</b>'
            + '<i>Выключенную анкету воркер не ведёт: не отвечает и ничего не '
            + 'отправляет. Входящие сообщения при этом принимаются.</i>'
            + '</span></label>'
            // ⚠ Расписание переехало сюда с «Профилей»: там оно стояло во вкладке
            // «Настройки» рядом с чтением переписки, хотя говорит о том же, о чём
            // выключатель, — как эту анкету ведут.
            + scheduleBlock(row)
            // Удаление — внизу и отдельной полосой: это единственное здесь
            // необратимое действие, и стоять рядом с галочками ему нельзя.
            + '<div class="prof-set-danger">'
            + '<button type="button" class="dating-btn danger" id="deleteBtn">'
            + 'Удалить анкету</button>'
            + '<i>Уходит вся переписка, собеседники и журнал: они привязаны к '
            + 'анкете. Учётка на сайте остаётся — удаляется только то, что о ней '
            + 'знает панель.</i>'
            + '</div>'
            + '</div>';
    }

    function settingsBind() {
        // Та же строка, что рисовала блок: кнопка входа-выхода читает из неё
        // состояние анкеты.
        const row = profiles.find(g => g.id === currentId) || {id: currentId};
        const box = document.getElementById('enabledBox');
        if (!box) return;

        box.addEventListener('change', async () => {
            const on = box.checked;
            // ⚠ Запираем на время запроса: круг перерисовки идёт каждые 15 секунд,
            // и второе нажатие успело бы уехать раньше, чем вернулся ответ на
            // первое — состояние в базе разошлось бы с галочкой.
            box.disabled = true;
            try {
                await putData(`${BASE}/api/dating/profile/${currentId}/enabled`,
                              {enabled: on});
                box.closest('.prof-set-row').classList.toggle('off', !on);
                say(on ? 'анкета включена' : 'анкета выключена');
                // Список слева рисует значок выключенной — обновляем и его.
                await profilesLoad();
                // ⚠ И карточку: рядом стоит расписание, а оно у выключенной не
                // действует. Без перечитывания оно осталось бы в прежнем виде —
                // человек выключил анкету, а расписание говорит, что работает.
                await profileLoad();
            } catch (e) {
                box.checked = !on;
                say('не переключилось: ' + e.message, true);
            } finally {
                box.disabled = false;
            }
        });

        document.getElementById('deleteBtn')
                .addEventListener('click', () => profileDelete());

        // Обработчики расписания: блок перерисовывается вместе с настройками,
        // поэтому вешаются каждый раз — узлы новые.
        scheduleBind(profileEl, row);
    }

    async function profileDelete() {
        const profile = profiles.find(g => g.id === currentId) || {};
        // ⚠ Спрашиваем, и в вопросе — **логин**, а не «эту анкету»: карточка
        // перерисовывается каждые 15 секунд, и человек, отвлёкшийся на секунду,
        // должен видеть, что именно удаляет.
        if (!confirm(`Удалить анкету «${profile.login || currentId}»?\n\n`
                     + 'Вместе с ней уйдёт вся переписка. Отменить нельзя.')) return;

        const btn = document.getElementById('deleteBtn');
        btn.disabled = true;
        btn.textContent = 'Удаляю…';
        try {
            await deleteData(`${BASE}/api/dating/profile/${currentId}`);
            say(`анкета «${profile.login || currentId}» удалена`);
            // Выбор сбрасываем: карточка удалённой анкеты показывала бы данные,
            // которых уже нет, а следующий круг опроса получил бы 404.
            currentId = 0;
            profileEl.innerHTML = '<div class="empty">выберите анкету слева</div>';
            document.getElementById('profileWho').textContent = '';
            await profilesLoad();
        } catch (e) {
            btn.disabled = false;
            btn.textContent = 'Удалить анкету';
            say('не удалилось: ' + e.message, true);
        }
    }

    async function profileSave() {
        const login = document.getElementById('login').value.trim();
        const password = document.getElementById('password').value;
        if (!siteId()) return say('сначала выберите сайт', true);
        if (!login || !password) return say('нужны логин и пароль', true);

        try {
            await postData(BASE + '/api/dating/profile', {site_id: siteId(), login, password,
                                                note: document.getElementById('note').value.trim()});
        } catch (e) {
            return say(e.message, true);
        }
        formEl.classList.remove('open');
        for (const id of ['login', 'password', 'note']) document.getElementById(id).value = '';
        say('');
        showNotification('Девушка добавлена', 'success');
        profilesLoad();
    }

    // Обновляем всё, что меняется само: список анкет, диалоги и журнал. Работу
    // ведут воркеры в фоне — сообщения приходят и ответы уходят без участия
    // страницы, и требовать перезагрузки, чтобы это увидеть, значит показывать
    // вчерашнюю картину.
    async function probe() {
        if (probeBusy || !siteId() || document.hidden) return;
        probeBusy = true;
        try {
            await postData(`${BASE}/api/dating/profile/probe?site_id=${siteId()}`, {});
            await profilesLoad();
            // Диалоги и журнал — вместе со списком: свежий ответ агента виден в
            // переписке, а не только в счётчике.
            await profileLoad();
        } catch (e) {
            // Сайт без настроенного опроса — обычное дело: молчим, чтобы не мигать
            // одной и той же ошибкой каждые 15 секунд.
        } finally {
            probeBusy = false;
        }
    }


    function say(text, bad = false) {
        const el = document.getElementById('hint');
        el.textContent = text || '';
        el.classList.toggle('bad', !!bad);
    }

    // textContent → innerHTML экранирует &, < и > (текстовый узел), но не кавычки:
    // по спецификации HTML кавычки экранируются только в атрибутном режиме
    // сериализации, а textContent в него не переключается. На странице esc()
    // подставляется в том числе внутрь `title="${esc(...)}"`, куда попадает текст
    // с чужого сайта знакомств (last_error) — необработанная кавычка в нём закрывает
    // атрибут и позволяет дописать следующий (например обработчик onmouseover).
    // Поэтому кавычки экранируем вручную, отдельным хелпером не заводим: один и тот
    // же esc() безопасен и в тексте, и в атрибуте.
    document.getElementById('addBtn').addEventListener('click', () => {
        formEl.classList.toggle('open');
        if (formEl.classList.contains('open')) document.getElementById('login').focus();
    });
    document.getElementById('saveBtn').addEventListener('click', profileSave);
    document.getElementById('cancelBtn').addEventListener('click', () => formEl.classList.remove('open'));
    // Перерисовываем на месте, без запроса: список уже в памяти.
    findEl.addEventListener('input', () => { profilesPage = 0; profilesRender(); });
    siteEl.addEventListener('change', () => {
        localStorage.setItem(DATING_SITE_KEY, siteEl.value);
        currentId = 0;
        profilesLoad();
    });

    // Разделители. Тянут не рамку, а переменную сетки — так двигается ровно один
    // размер, а остальное перекладывается само, без пересчёта в JS.
    function splitDrag(el, varName, min, max, fromEvent) {
        el.addEventListener('pointerdown', (ev) => {
            ev.preventDefault();
            el.setPointerCapture(ev.pointerId);
            el.classList.add('drag');

            const move = (e) => {
                const value = Math.min(max, Math.max(min, fromEvent(e)));
                pageEl.style.setProperty(varName, value + 'px');
            };
            const stop = () => {
                el.classList.remove('drag');
                el.removeEventListener('pointermove', move);
                el.removeEventListener('pointerup', stop);
                layoutSave();
            };
            el.addEventListener('pointermove', move);
            el.addEventListener('pointerup', stop);
        });
    }

    function layoutSave() {
        const style = pageEl.style;
        localStorage.setItem(SIZE_KEY, JSON.stringify({
            col: style.getPropertyValue('--col'),
        }));
    }

    function layoutRestore() {
        let saved;
        try { saved = JSON.parse(localStorage.getItem(SIZE_KEY) || '{}'); } catch (e) { return; }
        if (saved.col) pageEl.style.setProperty('--col', saved.col);
    }

    // Границы разумного: колонка уже 240 px нечитаема, шире 40% экрана бессмысленна.
    splitDrag(document.getElementById('splitCol'), '--col', 240, Math.round(innerWidth * 0.6),
              (e) => e.clientX - pageEl.getBoundingClientRect().left);

    layoutRestore();
    sitesLoad();
    setInterval(probe, PROBE_MS);
</script>
{% endblock %}
