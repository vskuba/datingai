{% extends "base.html" %}

{% block title %}Настройки сайтов | DatingAi{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ static_url('css/dating_page.css') }}">
    <style>
        /* Обойма, шапка и белая панель — общие с разделом (`dating_page.css`).
           Здесь только раскладка: шапка и под ней одна панель во всю высоту, как
           на «Журналах». Колонок нет — делить нечего. */
        .dating-page { grid-template-rows: auto minmax(0, 1fr); }

        /* Что за сайт настраиваем: имя и адрес приходят от соседа и правке здесь
           не подлежат — своей копии сайтов у нас нет. Показываем их прямо над
           настройками, чтобы не гадать, к чему они относятся. */
        .site-card {
            display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
            padding: 10px 14px; border-bottom: 1px solid #f1f5f9;
        }
        .site-card-name { font-weight: 600; color: #111827; font-size: 13px; }
        .site-card-url { color: #6b7280; font-size: 11px; }
        .site-card-note { margin-left: auto; color: #94a3b8; font-size: 11px; }

        /* Ключ — моноширинным: это имя из кода, и в нём различают `_` от `-` и
           единицу от строчной «l». То же решение, что на «Настройки → Значения». */
        .set-key {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 12px; color: #0f172a; word-break: break-all;
        }
        .set-value {
            width: 100%; padding: 5px 9px; font-size: 12px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
            min-width: 400px;
        }
        .set-value:focus { outline: none; border-color: #6366f1; }
        .set-value:disabled { opacity: .6; }
        /* Числовое поле уже строки: в нём два-три знака, а растянутое на всю
           ширину оно обещает длинный ввод, которого не будет. Стрелки браузера
           остаются — ими подбирают долю, не набирая.

           ⚠ `min-width` перебиваем явно: у `.set-value` он 400 пикселей, и один
           `max-width` проиграл бы ему — поле осталось бы широким. */
        .set-number { min-width: 0; max-width: 120px; }
        /* Несохранённая правка видна: без этого набранное и сохранённое выглядят
           одинаково, и человек уходит со страницы в уверенности, что сохранил. */
        .set-value.dirty { border-color: #f59e0b; background: #fffbeb; }

        /* Промежуток «от … до …» — два поля одной строкой.

           ⚠ Подпись у каждого своя и стоит слева от поля: без неё два одинаковых
           числовых поля подряд не различить, а заголовок строки один на оба. */
        .set-pair { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .set-pair-half { display: flex; align-items: center; gap: 6px; }
        .set-pair-label { font-size: 12px; color: #64748b; }

        .set-drop {
            border: 0; background: none; cursor: pointer; color: #cbd5e1;
            font-size: 15px; line-height: 1; padding: 0 4px;
        }
        .set-drop:hover { color: #dc2626; }

        /* Форма заведения прячется, пока не нажали «Добавить»: в обычный день
           настройку не заводят, а место над списком она занимает. */
        .set-add {
            display: none; gap: 10px; align-items: flex-end; flex-wrap: wrap;
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 12px 14px; margin: 12px;
        }
        .set-add.on { display: flex; }
        .set-add label { font-size: 11px; color: #64748b; display: block; margin-bottom: 3px; }
        .set-add input {
            padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }
        .set-add .set-add-key { width: 220px; }
        .set-add .set-add-value { width: 320px; }

        /* ── Две колонки настроек ────────────────────────────────────────────
           ⚠ **`columns`, а не grid.** Групп пять, и высота у них разная: grid из
           двух ячеек оставил бы под короткой группой дыру в полколонки. `columns`
           раскладывает поток и балансирует высоту сам.

           `break-inside: avoid` обязателен: без него браузер рвёт блок между
           колонками — заголовок группы остаётся внизу левой, а её настройки
           уезжают в правую. */
        /* ⚠ **Полоса вкладок переносится сама** (`flex-wrap`), и это не
           предусмотрительность впрок: групп уже семь, и на узком экране они не
           помещаются в строку. Горизонтальная прокрутка у заголовков — худший из
           способов их показать: половина вкладок оказывается за краем, и понять,
           что там что-то есть, неоткуда.

           `justify-self: stretch` — против `start` у общей `.page-tabs`: та
           рассчитана на три-четыре вкладки и обнимает их, а здесь коробка должна
           занимать ширину, чтобы переносу было куда переносить. */
        .set-tabs {
            flex-wrap: wrap;
            justify-self: stretch;
            margin: 4px 0 12px;
        }

        .set-panes { padding: 4px 0 10px; }

        .set-box { margin-bottom: 14px; }

        /* Закрытая вкладка. ⚠ Прячем, а не удаляем: перерисовка теряла бы
           раскрытый пароль и позицию курсора в поле, которое правят. */
        .set-box.off { display: none; }

        .set-box-head {
            padding: 8px 14px 5px; font-size: 10px; font-weight: 700; color: #397ad6;
            text-transform: uppercase; letter-spacing: .04em;
            border-bottom: 1px solid #e5e7eb;
        }

        /* Подраздел внутри вкладки — та же шапка, но с воздухом сверху: она идёт
           следом за таблицей, у которой последняя строка без рамки, и без
           отступа читалась бы ещё одной строкой настроек.

           ⚠ Цвет тот же, что у шапки вкладки, и это решение владельца панели:
           подраздел отличает **место** (он под таблицей, с отступом), а не
           оттенок. Пробовали серый — старшинство он показывал, но читался как
           «неактивный». Правишь — правь и здесь, иначе комментарий соврёт. */
        .set-box-head.sub { margin-top: 18px; }

        /* ⚠ Одна колонка на узком экране: две по 300 пикселей — это не две
           колонки, а два обрубка, где имя настройки не помещается в строку. */
        @media (max-width: 1100px) {
            .set-panes { columns: 1; }
        }

        .set-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .set-table td { padding: 6px 14px; border-bottom: 1px solid #f1f5f9; }
        .set-table tr:last-child td { border-bottom: none; }

        .set-table td:first-child {
            width: 50%;
        }

        /* Заголовок группы настроек. Мельче шапки таблицы и без верхней рамки у
           первого: иначе две полосы подряд читаются как две таблицы. */
        .set-group td {
            padding: 14px 14px 5px; border-bottom: 1px solid #e5e7eb;
            font-size: 10px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em;
            background-color: #f0f0f0;
        }
        .set-group:first-child td { padding-top: 9px; }
        .set-col-key { width: 34%; }

        /* Известная настройка: человеческое имя сверху, ключ под ним мелким. Ключ
           нужен — по нему её читает код и о ней говорят в документации, — но
           первым читают название. */
        .set-title { display: block; font-size: 12px; color: #111827; font-weight: 600; }
        .set-key-small {
            display: block; font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 10px; color: #94a3b8;
        }
        .set-note { display: block; font-size: 10px; color: #94a3b8; margin-top: 2px; }
        /* Ширину задаём: `common.css` даёт всем `select` `width: 100%`, и набор
           значений растянулся бы на всю колонку. */
        .set-select { width: auto; min-width: 160px; padding: 5px 8px; }

        /* ── Вкладка «Прокси»: пул выходов ───────────────────────────────────
           Стоит над настройками группы: выбирать «анкет на IP», не видя самих
           адресов и их занятости, нечем.

           Оформление отдельное от таблицы настроек намеренно: это не настройка,
           а состояние — карточка со своим фоном, рамкой и шапкой. Смешавшись со
           строками настроек, пул читался бы как ещё одно поле. */
        .pxy-pool {
            margin: 0 0 18px; border: 1px solid #e8eaf0; border-radius: 12px;
            background: #fff; overflow: hidden;
        }

        /* Главный выключатель группы. Стоит над пулом и над настройками, потому
           что отвечает не «как», а «пользуемся ли вообще»: снят — за ним нет
           ничего, и показывать пул с настройками значило бы предлагать крутить
           то, что не работает.

           Выключенное состояние приглушённое, включённое — с зелёной рамкой:
           человек заходит сюда редко, и первый вопрос у него именно про это. */
        .pxy-on {
            display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap;
            margin: 0 0 18px; padding: 14px 16px; border-radius: 12px;
            border: 1px solid #e8eaf0; background: #f8fafc;
        }
        .pxy-on.on { border-color: #bbf7d0; background: #f0fdf4; }
        .pxy-on-sw {
            display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
            font-size: 13px; font-weight: 600; color: #1e293b; white-space: nowrap;
        }
        .pxy-on-sw input { width: 17px; height: 17px; cursor: pointer; }
        .pxy-on-note {
            flex: 1 1 260px; font-size: 12px; line-height: 1.5; color: #64748b;
        }
        .pxy-on-note b { color: #334155; font-weight: 600; }
        .pxy-pool-head {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            font-size: 12px; color: #64748b; padding: 12px 16px;
            background: linear-gradient(180deg, #fbfcfe 0%, #f6f8fb 100%);
            border-bottom: 1px solid #eef1f6;
        }
        .pxy-pool-head b { color: #1e293b; font-weight: 600; }
        /* Галочка и кнопка — прижаты вправо; между ними воздух, чтобы галочка
           не читалась как подпись к кнопке. */
        .pxy-pool-head .pxy-cc-row { flex: 1 1 auto; }
        .pxy-pool-head .pxy-auto { margin-left: auto; }
        .pxy-auto {
            display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
            font-size: 12px; color: #64748b; white-space: nowrap;
        }
        .pxy-auto input { width: 15px; height: 15px; cursor: pointer; }
        .pxy-pool-note { font-size: 12px; color: #94a3b8; padding: 18px 16px; }
        .pxy-pool-note.bad { color: #b45309; }

        .pxy-pool-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .pxy-pool-table th {
            text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 600;
            color: #a3adbd; text-transform: uppercase; letter-spacing: .05em;
            border-bottom: 1px solid #eef1f6; white-space: nowrap; background: #fcfdfe;
        }
        /* ⚠ Всё в одну строку: выходов бывает два десятка, и вторая линия под
           именем удваивала высоту таблицы ради адреса, на который смотрят
           изредка. Он теперь своей колонкой. */
        .pxy-pool-table td {
            padding: 3px 12px; border-bottom: 1px solid #f4f6f9;
            white-space: nowrap; vertical-align: middle;
        }
        .pxy-pool-table tr:last-child td { border-bottom: 0; }
        .pxy-pool-table tbody tr:hover td { background: #fafbfd; }

        /* ⚠ Мёртвый выход бледный и внизу списка: он в реестре есть, но раздача
           его не возьмёт. Причина — на месте пинга: иначе «бледный» читается как
           «выключен человеком», а это другая беда. */
        .pxy-pool-table tr.dead td { opacity: .46; }

        .pxy-pool-name { font-weight: 600; color: #1e293b; }
        .pxy-pool-where {
            font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #9aa5b5;
        }
        .pxy-pool-ip {
            font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #0f172a;
        }
        .pxy-c-cc { width: 72px; }
        .pxy-dim { color: #cbd5e1; }
        /* Чипсы стран — слева в шапке пула: они решают, из чего берём каналы, и
           стоят там же, где кнопка проверки, — в полосе управления, а не над
           таблицей отдельной строкой. */
        .pxy-cc-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .pxy-chip {
            border: 1px solid #e6e9f0; background: #fcfdfe; color: #7c8798;
            border-radius: 8px; padding: 4px 11px; font-size: 12px; cursor: pointer;
            font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
            transition: background .12s, border-color .12s, color .12s;
        }
        .pxy-chip i {
            font-style: normal; font-size: 10px; font-weight: 600; color: #b8c0cd;
        }
        .pxy-chip:hover { border-color: #cdd6ea; background: #fff; color: #5b6474; }
        /* ⚠ **Включённый чипс — светлый, а не залитый.** Их бывает пять-шесть в
           ряд, и сплошная заливка превращала полосу в пестрядь, которая спорит с
           таблицей под ней за внимание. Держит состояние рамка и тон текста:
           этого хватает, чтобы «включено» читалось с одного взгляда, а строки
           пула оставались главными на вкладке. */
        .pxy-chip.on {
            background: #eef1fb; border-color: #c3ccef; color: #4a53a8; font-weight: 600;
        }
        .pxy-chip.on i { color: #8f9ad4; }
        .pxy-chip.on:hover { background: #e7ebf9; border-color: #b3bfe9; }
        /* Наш адрес живёт в заголовке панели: заголовок слева, адрес прижат
           вправо — они про разное и слипаться не должны. */
        .set-box-own {
            float: right; font-size: 11px; font-weight: 400; color: #94a3b8;
            text-transform: none; letter-spacing: 0;
        }
        .pxy-ip-own {
            font-family: ui-monospace, Menlo, monospace; color: #475569; font-weight: 600;
        }
        /* «наш» у выхода — предупреждение, а не пометка: такой канал не скрывает
           ничего, и все анкеты за ним окажутся на одном адресе. */
        .pxy-warn {
            font-size: 10px; font-weight: 700; color: #b45309; background: #fffbeb;
            border: 1px solid #fde68a; border-radius: 4px; padding: 1px 5px;
            white-space: nowrap;
        }
        /* Код страны — плашкой: две буквы в потоке текста теряются, а по ним
           сверяют канал с легендой анкеты. */
        .pxy-cc {
            font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700;
            color: #475569; background: #eef1f6; border-radius: 4px; padding: 2px 6px;
            letter-spacing: .04em;
        }
        /* Пинг — не просто число: по нему выбирают канал, и «15 секунд» должно
           отличаться от «200 мс» с одного взгляда. Цвет считается плавно
           (`pingColor`), поэтому здесь только вес и отказ. */
        .pxy-pool-ping { color: #64748b; font-weight: 600; }
        .pxy-pool-ping .bad { color: #b91c1c; font-weight: 400; white-space: normal; }
        .pxy-c-seats { width: 86px; text-align: right; color: #475569; }
        .pxy-c-seats.full { color: #b45309; font-weight: 600; } сайт ходит, не сверяясь
           с галочками по одной. */
        .pxy-pool-table tr.on td { background: #f5f7ff; }

        /* Секрет с глазом: поле и кнопка в строку. `flex` у обоймы, а не отступ у
           кнопки — поле тянется, кнопка держит свой размер. */
        .set-secret { display: flex; align-items: center; gap: 6px; }
        .set-secret .set-value { flex: 1 1 auto; min-width: 0; }
        /* Глаз серый, пока на него не наведут: он не действие страницы, а
           возможность посмотреть — и отвлекать от значений не должен. */
        .set-eye {
            flex: 0 0 auto; border: none; background: none; cursor: pointer;
            color: #94a3b8; font-size: 14px; line-height: 1; padding: 2px 4px;
        }
        .set-eye:hover { color: #4338ca; }
        .set-eye:disabled { opacity: .4; cursor: default; }
        .set-col-act { width: 44px; text-align: center; }

        .site-body { padding: 0; }
        .site-empty { padding: 20px 14px; color: #9ca3af; font-size: 12px; text-align: center; }
    </style>
{% endblock %}

{% block content %}
<div class="dating-page">

    <div class="dating-head">
        <h1>🌐 Настройки сайтов</h1>
        <select id="siteSelect" title="Сайт, который настраиваем"></select>
        <span class="dating-hint" id="hint"></span>
        {% if user.is_admin %}
        <button type="button" class="dating-btn" id="addBtn" style="margin-left:auto">Добавить</button>
        {% endif %}
    </div>

    <div class="pane">
        <div class="pane-head">Настройки сайта</div>
        <div class="pane-body site-body" id="body">
            <div class="site-empty">Загружаю…</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, postData, putData} from '{{ static_url('js/api.js') }}';
    import {showNotification} from '{{ static_url('js/notification.js') }}';
    import {esc} from '{{ static_url('js/dating/view.js') }}';
    import {DATING_SITE_KEY, datingSiteFill} from '{{ static_url('js/dating/site.js') }}';

    const BASE = '{{ base }}';
    // Правку прячем от того, кто её не сохранит: ручка всё равно ответит 403, но
    // форма, которая всегда отказывает, читается как поломка панели.
    const CAN_EDIT = {{ 'true' if user.is_admin else 'false' }};

    const siteEl = document.getElementById('siteSelect');
    const hintEl = document.getElementById('hint');
    const bodyEl = document.getElementById('body');

    // Сайты соседа вместе с нашими настройками: список ведёт он, значения — мы.
    let sites = [];

    // Реестр известных настроек — тех, у которых есть заданный набор значений.
    // Приходит с сервера, а не вписан здесь: набор — условие кода, читающего
    // настройку, и вторая его копия на странице разошлась бы с первой.
    // ⚠ `subs` — подразделы внутри вкладки: вкладка «Инвайты и чат» собрала
    // настройки трёх занятий, и плоская таблица из четырнадцати строк заставляет
    // читать все, чтобы найти одну. Подписи и порядок — с сервера, как у групп.
    let known = [], groups = [], subs = [];

    // Открытая вкладка настроек. ⚠ Запоминается на весь раздел, а не на сайт:
    // человек ходит между сайтами, сверяя **одну и ту же** настройку, и сброс на
    // первую вкладку при каждом переключении заставлял бы искать её заново.
    const SET_TAB_KEY = 'dating.site.settab';
    let setTab = localStorage.getItem(SET_TAB_KEY) || '';

    function siteId() {
        return Number(siteEl.value) || 0;
    }

    function current() {
        return sites.find(s => s.id === siteId()) || null;
    }

    async function load() {
        try {
            const answer = (await getData(`${BASE}/api/dating/site`)).result;
            sites = answer.sites || [];
            known = answer.known || [];
            groups = answer.groups || [];
            subs = answer.subs || [];
        } catch (e) {
            bodyEl.innerHTML = `<div class="site-empty">Сайты не пришли: ${esc(e.message)}</div>`;
            return;
        }

        paint();
    }

    function paint() {
        const site = current();
        if (!site) {
            bodyEl.innerHTML = '<div class="site-empty">Выберите сайт</div>';
            return;
        }

        // Известные настройки показываем **всегда**, даже незаведённые: иначе
        // выставить их в первый раз можно было бы только зная ключ наизусть.
        const knownKeys = known.map(spec => spec.key);
        const custom = Object.keys(site.settings || {})
            .filter(key => !knownKeys.includes(key)).sort();

        bodyEl.innerHTML = '<div class="site-card">'
            + `<span class="site-card-name">${esc(site.name)}</span>`
            + `<span class="site-card-url">${esc(site.url)}</span>`
            // Говорим прямо, откуда имя и адрес: иначе непонятно, почему их нельзя
            // поправить здесь же.
            + '<span class="site-card-note">имя и адрес — из RhapsodyAi</span>'
            + '</div>'
            + (CAN_EDIT ? addForm() : '')
            // ⚠ **Группы — вкладки, а не колонки.** Прежде все блоки лежали на
            // странице разом, в две колонки: пока групп было три, это читалось,
            // а с семью страница превратилась в простыню, по которой ищут глазами.
            // Вкладка отвечает на вопрос «где это настраивается» одним щелчком.
            //
            // Полоса переносится на вторую строку сама (`flex-wrap`): групп будет
            // больше, и горизонтальная прокрутка у заголовков — худший из
            // способов их показать.
            + tabsRow(site, custom)
            + '<div class="set-panes">'
            + groupBoxes(site)
            + customBox(site, custom)
            + '</div>';

        bind();

        // ⚠ **Пул грузится, только если его вкладка открыта.** Он ходит к соседу,
        // а `paint()` зовётся на каждое сохранение любой настройки и на каждую
        // смену сайта — то есть чужой сервис опрашивался бы там, где о прокси
        // никто не спрашивал.
        //
        // Своим запросом, а не вместе со страницей: настройки не должны ждать
        // чужой ответ, чтобы показаться.
        if (setTab === 'proxy') poolLoad();
    }

    // Полоса вкладок: по вкладке на непустую группу плюс «Свои настройки».
    //
    // ⚠ **Пустые группы не показываем.** Вкладка, за которой ничего нет, —
    // обещание, которое некому исполнить; а список групп общий на все сайты, и у
    // конкретного часть из них может быть незаполненной.
    //
    // ⚠ Счётчик в подписи не рисуем: настроек в группе три-восемь, и число рядом
    // с названием отвечает на вопрос, которого никто не задаёт.
    function tabsRow(site, custom) {
        const rows = tabRows(site, custom);
        if (!rows.length) return '';

        // Открытая вкладка переживает перерисовку, но не переживает исчезновения
        // своей группы: сменили сайт — и группы может не стать.
        if (!rows.some(one => one.key === setTab)) setTab = rows[0].key;

        return '<div class="page-tabs set-tabs">'
            + rows.map(one =>
                '<button type="button" class="page-tab'
                + `${one.key === setTab ? ' on' : ''}" data-set-tab="${esc(one.key)}">`
                + `${esc(one.title)}</button>`).join('')
            + '</div>';
    }

    // Какие вкладки вообще будут. ⚠ Считается **один раз** и тем же порядком, что
    // и панели ниже: разойдись они, щелчок по вкладке открывал бы соседнюю.
    function tabRows(site, custom) {
        const rows = [];

        groups.forEach(group => {
            // Скрытые строкой настройки тоже считаются: у «Прокси» вкладка нужна
            // и ради пула, даже если бы все её настройки правились не полями.
            if (known.some(spec => spec.group === group.key)) {
                rows.push({key: group.key, title: group.title});
            }
        });

        const shown = new Set(groups.map(group => group.key));
        if (known.some(spec => !shown.has(spec.group))) {
            rows.push({key: 'rest', title: 'Прочее'});
        }

        // «Свои настройки» — последними: они не из реестра, и мешать их к
        // известным значило бы прятать среди них то, что завели руками.
        if (custom.length || CAN_EDIT) {
            rows.push({key: 'custom', title: 'Свои настройки'});
        }

        return rows;
    }

    // Показывает открытую панель. ⚠ Классом, а не перерисовкой: перерисовка
    // теряла бы раскрытый пароль и позицию курсора в поле, которое правят.
    function setTabPaint() {
        bodyEl.querySelectorAll('.page-tab[data-set-tab]').forEach(btn =>
            btn.classList.toggle('on', btn.dataset.setTab === setTab));

        bodyEl.querySelectorAll('[data-set-pane]').forEach(pane =>
            pane.classList.toggle('off', pane.dataset.setPane !== setTab));
    }

    // Подпись настройки: **жирное** выделение — жирным, а не звёздочками.
    //
    // ⚠ Поймано снимком страницы: в подписях висели «⚠ Ответы приходят **этим же
    // путём**» — то есть разметка, которую никто не разбирал. Тексты в реестре
    // пишут так же, как всю документацию проекта, и требовать от автора помнить,
    // что здесь markdown не работает, — верный способ получить его снова.
    //
    // ⚠ **Экранируем сперва, размечаем потом.** Иначе `<b>` из чужой строки уехал
    // бы в разметку как тег: подписи приходят из кода, но правило «сначала
    // экранируй» не должно зависеть от того, откуда пришла строка.
    function noteHtml(text) {
        return esc(text).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    }

    function addForm() {
        return '<div class="set-add" id="addForm">'
            + '<div><label for="addKey">Ключ</label>'
            + '<input type="text" id="addKey" class="set-add-key" placeholder="answer_delay_sec"'
            + ' autocomplete="off" maxlength="50"></div>'
            + '<div><label for="addValue">Значение</label>'
            + '<input type="text" id="addValue" class="set-add-value" placeholder="30"'
            + ' autocomplete="off"></div>'
            + '<button type="button" class="dating-btn primary" id="addSave">Завести</button>'
            + '<button type="button" class="dating-btn" id="addCancel">Отмена</button>'
            + '</div>';
    }

    // Известная настройка: набором значений, а не полем ввода. Значение вне набора
    // код всё равно не примет (`site_seconds`), и предлагать его набором —
    // единственный способ не расходиться с ним.
    //
    // ⚠ Незаведённая настройка показывает **умолчание кода**, а не пустоту: она
    // действует, и показать «не задано» значило бы соврать про поведение.
    // Известные настройки — группами. ⚠ **Порядок и подписи групп приходят с
    // сервера** (`groups`): страница не должна знать, какие группы бывают, иначе
    // новая группа в реестре требовала бы правки в двух местах.
    //
    // Заголовок рисуется только у непустой группы: пустая шапка читается как
    // «настройки не загрузились».
    function groupBoxes(site) {
        // Группы, которых нет в списке с сервера (старый ответ, опечатка в
        // реестре), не теряем — показываем в конце без заголовка. Потерять
        // настройку хуже, чем показать её не в том месте.
        const shown = new Set();

        let html = groups.map(group => {
            // ⚠ Строки нет у двух родов настроек, и поводы у них разные:
            //
            // `kind: 'hidden'` — правится не полем, а чем-то на **этой же**
            // вкладке (отбор выходов — галочками в пуле);
            // `hidden: true` — правится на **другой странице** и здесь не
            // показывается вовсе (`template_per_day` живёт у расписания
            // шаблонов). Два поля на одно значение — это два места, где его
            // правят, и вечный вопрос, какое главное.
            //
            // ⚠ В `shown` обе всё равно попадают, иначе уехали бы в «Прочее».
            // ⚠ Третий род без своей строки — **ведомая половина промежутка**
            // (`paired`): её поле стоит рядом с ведущей, в её же строке.
            const noRow = (spec) => spec.kind === 'hidden' || spec.hidden
                                    || spec.paired;
            const rows = known.filter(spec => spec.group === group.key
                                              && !noRow(spec));
            known.filter(spec => spec.group === group.key && noRow(spec))
                 .forEach(spec => shown.add(spec.key));
            rows.forEach(spec => shown.add(spec.key));

            return (rows.length || group.key === 'proxy')
                ? groupBox(group.key, group.title, site, rows) : '';
        }).join('');

        // Группы, которых нет в списке с сервера (старый ответ, опечатка в
        // реестре), не теряем — своим блоком в конце. Потерять настройку хуже,
        // чем показать её не в том месте.
        const rest = known.filter(spec => !shown.has(spec.key));
        if (rest.length) html += groupBox('rest', 'Прочее', site, rest);

        return html;
    }

    // Панель группы: своя таблица под своей вкладкой.
    //
    // ⚠ **Заголовок внутри панели остался**, хотя его же несёт вкладка. Он не
    // лишний: вкладка отвечает «куда я нажал», заголовок — «что я сейчас читаю»,
    // и при семи вкладках в две строки первое теряется из виду быстрее, чем
    // кажется.
    //
    // ⚠ **Панели рисуются все разом, а прячутся классом.** Перерисовывать группу
    // на каждый щелчок значило бы терять раскрытый пароль и позицию курсора в
    // поле, которое человек только что правил.
    function groupBox(key, title, site, rows) {
        // ⚠ **За снятым выключателем не рисуем ничего**, кроме него самого. Пул
        // ходит к соседу, а настройки под ним — «сколько анкет на IP», «из каких
        // стран», — отвечают на вопросы, которых при выключенных прокси не
        // возникает. Показывать их значило бы предлагать крутить неработающее.
        const on = key !== 'proxy' || proxyOn();

        return `<div class="set-box${key === setTab ? '' : ' off'}"`
            + ` data-set-pane="${esc(key)}">`
            + `<div class="set-box-head">${esc(title)}`
            // ⚠ Наш собственный адрес — в заголовке панели, а не в шапке пула.
            // Он не про пул: это то, чем ходит сама машина, и сравнивать с ним
            // выходы человек будет, скользя глазом сверху вниз. Место пустует до
            // загрузки — адрес приходит вместе со списком (`directText`).
            + (key === 'proxy' && on ? '<span class="set-box-own" id="poolOwn"></span>' : '')
            + '</div>'
            // Выключатель — самым верхом группы: он старше всего, что под ним.
            + (key === 'proxy' ? proxyOnBox() : '')
            // ⚠ Пул выходов — **над** настройками этой группы, а не под ними.
            // Настройки без него слепые: «анкет на IP» не выбрать, не видя,
            // сколько этих адресов есть и сколько уже занято.
            + (key === 'proxy' && on ? '<div id="proxyPool" class="pxy-pool"></div>' : '')
            + (on ? subBoxes(site, key, rows) : '')
            + '</div>';
    }

    // Настройки вкладки: общая таблица, а под ней подразделы своими шапками.
    //
    // ⚠ **Подразделы идут порядком сервера** (`subs`), а не порядком реестра: их
    // подписи и место — его знание, как и у вкладок.
    //
    // ⚠ **Настройка с неизвестным подразделом не теряется**: опечатка в `sub`
    // или старый ответ сервера кладут её в общую таблицу вкладки. Показать не на
    // том месте — беда меньшая, чем не показать вовсе; то же правило, что у
    // групп («Прочее»).
    //
    // ⚠ Пустой подраздел шапки не получает: она читалась бы как «настройки не
    // загрузились» — тот же довод, что у пустой вкладки.
    function subBoxes(site, key, rows) {
        const mine = subs.filter(one => one.group === key);
        const keys = new Set(mine.map(one => one.key));
        const head = rows.filter(spec => !keys.has(spec.sub || ''));

        return (head.length ? setTable(site, head) : '')
            + mine.map(one => {
                const inside = rows.filter(spec => (spec.sub || '') === one.key);

                return inside.length
                    ? `<div class="set-box-head sub">${esc(one.title)}</div>`
                      + setTable(site, inside)
                    : '';
            }).join('');
    }

    function setTable(site, rows) {
        return '<table class="set-table"><tbody>'
            + rows.map(spec => knownRow(site, spec)).join('')
            + '</tbody></table>';
    }

    // ── Главный выключатель выходов ──────────────────────────────────────────
    //
    // ⚠ **Он про весь механизм, а не про эту страницу.** Снят — прокси не
    // используются нигде: ни при входе, ни в чате, ни в присутствии, ни кругом
    // проверки. Анкеты ходят общим адресом сервера, как ходили до появления
    // прокси в проекте. По умолчанию снят: каналы покупают не в первый день.
    //
    // ⚠ **Снятие снимает выходы с анкет сайта** — на сервере, вместе с
    // сохранением (`proxy_forget_site`). Иначе адрес остался бы в кэше
    // анкеты, а удары присутствия читают его прямо из колонки.
    const PROXY_ON_KEY = 'proxy_enabled';

    function proxyOn() {
        const site = current() || {};
        const spec = known.find(one => one.key === PROXY_ON_KEY) || {};
        const value = (site.settings || {})[PROXY_ON_KEY];

        return String(value === undefined ? (spec.default || '0') : value) === '1';
    }

    function proxyOnBox() {
        const on = proxyOn();
        const note = on
            ? 'Анкетам раздаются выходы из реестра соседа: каждая ходит своим '
              + 'адресом — вход, чат, письма и присутствие через один и тот же. '
              + '<b>Выключение снимет выходы со всех анкет сайта</b>, и они '
              + 'вернутся на общий адрес сервера.'
            : 'Сейчас все анкеты сайта ходят <b>общим адресом сервера</b>: прокси '
              + 'не используются нигде — ни при входе, ни в чате, ни в '
              + 'присутствии. Включать стоит, когда каналы заведены и проверены '
              + 'у соседа, на вкладке «Proxy».';

        return `<div class="pxy-on${on ? ' on' : ''}">`
            + (CAN_EDIT
                ? '<label class="pxy-on-sw">'
                  + `<input type="checkbox" id="proxyOnBox"${on ? ' checked' : ''}>`
                  + ' Использовать выходы (прокси)</label>'
                : `<span class="pxy-on-sw">Выходы ${on ? 'используются' : 'выключены'}</span>`)
            + `<div class="pxy-on-note">${note}</div>`
            + '</div>';
    }

    async function proxyOnSave() {
        const on = document.getElementById('proxyOnBox').checked;
        if (!on && !confirm('Выключить выходы у сайта?\n\nВыходы будут сняты со '
                            + 'всех его анкет, и они начнут ходить общим адресом '
                            + 'сервера. Сайт считает учётки по адресу.')) {
            document.getElementById('proxyOnBox').checked = true;
            return;
        }

        // `save` перерисовывает страницу целиком и сам грузит пул, если вкладка
        // открыта, — второй раз звать `poolLoad` не нужно.
        await save({[PROXY_ON_KEY]: on ? '1' : '0'});
    }

    // ── Пул выходов ──────────────────────────────────────────────────────────
    //
    // ⚠ **Порядок задаёт сервер.** Живые сверху, мёртвые вниз — тем же правилом,
    // по которому выходы раздаются анкетам (`proxy_pool`). Сортируй
    // страница сама, человек видел бы «первым пойдёт этот», а шёл бы другой.
    let _pool = [];
    let _poolSeats = 1;
    // Страны реестра и то, какие из них отмечены. Пустой отбор значит «все».
    let _countries = [];
    let _picked = new Set();
    // Наш собственный внешний адрес — без прокси. Нужен для сравнения: выход,
    // выходящий им же, ничего не скрывает.
    let _direct = {};

    async function poolLoad() {
        // ⚠ Выключено — панели пула на странице нет вовсе, и спрашивать реестр
        // незачем. Ручка ответит тем же (`enabled: false`), но запрос по сети
        // ради заведомо пустого ответа — цена без покупки.
        if (!proxyOn()) return;

        const box = document.getElementById('proxyPool');
        if (!box) return;

        box.innerHTML = '<div class="pxy-pool-note">Спрашиваю реестр…</div>';

        let data;
        try {
            data = await getData(`${BASE}/api/dating/proxy?site_id=${siteId()}`);
        } catch (e) {
            box.innerHTML = `<div class="pxy-pool-note bad">${esc(e.message)}</div>`;
            return;
        }

        // Сервер сказал «выключено», а страница думала иначе: настройку сменили
        // в другой вкладке. Перерисовываемся по правде сервера, а не по своей.
        if (data.enabled === false) {
            const site = current();
            if (site) site.settings = {...(site.settings || {}), [PROXY_ON_KEY]: '0'};
            paint();
            return;
        }

        _pool = data.result || [];
        _direct = data.direct || {};
        _countries = data.countries || [];
        _picked = new Set(data.picked || []);
        _poolSeats = data.seats || 1;
        poolRender(_poolSeats);
        directText();
    }

    function poolRender(seats) {
        const box = document.getElementById('proxyPool');
        if (!box) return;

        const live = _pool.filter(one => one.live);
        const ips = new Set(live.map(one => one.check_ip));
        if (!_pool.length) {
            box.innerHTML = '<div class="pxy-pool-note bad">Реестр пуст. Выходы заводят '
                + 'в RhapsodyAi: страница браузера, вкладка «Proxy».</div>';
            return;
        }

        // ⚠ **В шапке — только то, чем управляют.** Слева отбор стран, справа
        // проверка; счёт живых и адресов отсюда убран намеренно: числа эти уже
        // есть в чипсах (у каждой страны свой счёт живых) и в самой таблице, а
        // третьим местом они лишь спорили за внимание с тем, что нажимают.
        box.innerHTML = '<div class="pxy-pool-head">'
            + countryChips()
            // ⚠ Автопроверка стоит рядом с кнопкой, а не строкой в настройках
            // ниже: обе про одно — проверку выходов, — и разносить их по разным
            // концам вкладки значило бы искать вторую, найдя первую.
            + autoBox()
            + (CAN_EDIT ? '<button type="button" class="site-btn" id="poolCheck">Проверить сейчас</button>' : '')
            + '</div>'
            + '<table class="pxy-pool-table">'
            + '<thead><tr>'
            + '<th>Выход</th><th>Адрес</th><th>Внешний IP</th>'
            + '<th class="pxy-c-cc" title="Откуда выходит канал: код страны ISO-3166">Страна</th>'
            + '<th>Пинг</th>'
            + '<th class="pxy-c-seats">Анкеты</th>'
            + '</tr></thead><tbody>'
            + _pool.map(one => poolRow(one, seats)).join('')
            + '</tbody></table>';

        const check = document.getElementById('poolCheck');
        if (check) check.addEventListener('click', poolCheck);

        const auto = document.getElementById('poolAuto');
        if (auto) auto.addEventListener('change', autoSave);

        if (CAN_EDIT) {
            box.querySelectorAll('.pxy-chip').forEach(chip => {
                chip.addEventListener('click', () => chipToggle(chip.dataset.cc));
            });
        }

    }

    // Чипсы стран: из каких каналов сайт берёт выходы.
    //
    // ⚠ **Фильтруют не показ, а работу.** Выключенная страна остаётся в таблице
    // бледной — канал ведь жив, — но анкетам не достаётся. Прячь мы такие
    // строки, человек искал бы их в реестре, гадая, куда делись.
    //
    // ⚠ Ничего не отмечено — берём из **любых** стран. Обратное умолчание
    // оставило бы новый сайт без выходов молча.
    function countryChips() {
        if (!_countries.length) return '';

        const all = !_picked.size;

        return '<div class="pxy-cc-row">'
            + `<button type="button" class="pxy-chip${all ? ' on' : ''}" data-cc="">`
            + 'любая страна</button>'
            + _countries.map(one =>
                `<button type="button" class="pxy-chip${_picked.has(one.code) ? ' on' : ''}"`
                + ` data-cc="${esc(one.code)}"`
                + ` title="каналов ${one.total}, из них живых ${one.live}">`
                + `${esc(one.code)} <i>${one.live}</i></button>`).join('')
            + '</div>';
    }

    // ⚠ **Сохраняем спустя паузу, а не на каждый щелчок.** Сохранение
    // перечитывает сайт и перерисовывает пул; отмечая три страны подряд, человек
    // получал бы одну — второй щелчок приходился бы по узлу, который вот-вот
    // заменят. На галочках выходов эта беда уже случалась, проверено живьём.
    const CHIP_DELAY_MS = 600;
    let _chipTimer = null;

    function chipToggle(code) {
        // «Любая страна» — не пункт списка, а его сброс: отмечать её вместе с
        // конкретной бессмысленно, и щелчок по ней просто снимает отбор.
        if (!code) {
            _picked.clear();
        } else if (_picked.has(code)) {
            _picked.delete(code);
        } else {
            _picked.add(code);
        }

        // Рисуем сразу: чипс без отклика читается как непрошедший щелчок.
        chipPaint();

        clearTimeout(_chipTimer);
        _chipTimer = setTimeout(async () => {
            await save({proxy_countries: [..._picked].join(',')});
            // Отбор меняет, какие каналы годны, — пул перечитываем: выключенная
            // страна должна побледнеть, а счёт живых в шапке сойтись.
            await poolLoad();
        }, CHIP_DELAY_MS);
    }

    // Перерисовываем **только чипсы**, а не таблицу: сменившийся под пальцем
    // узел съедает следующий щелчок (та же беда, что была с галочками).
    function chipPaint() {
        const row = document.querySelector('.pxy-cc-row');
        if (!row) return;

        row.querySelectorAll('.pxy-chip').forEach(chip => {
            const code = chip.dataset.cc;
            chip.classList.toggle('on', code ? _picked.has(code) : !_picked.size);
        });
    }

    // Наш собственный адрес — в шапке, рядом со счётом выходов.
    //
    // ⚠ **Он здесь не для справки, а для сравнения.** Выход, у которого
    // увиденный IP совпал с нашим, ничего не скрывает: запрос идёт мимо него
    // либо он прозрачный. Для сайта это худший случай — все «разные» анкеты
    // окажутся на одном адресе, и узнаем мы об этом из блокировок.
    function directText() {
        const box = document.getElementById('poolOwn');
        if (!box) return;

        if (!_direct.ip) {
            box.innerHTML = '';
            return;
        }

        const same = _pool.filter(one => one.is_direct).length;

        box.innerHTML = `наш адрес <span class="pxy-ip-own">${esc(_direct.ip)}</span>`
            + (same ? ` <span class="pxy-warn">${same} выход(а) идут им же — они `
                      + 'ничего не скрывают</span>' : '');
    }

    // Автопроверка: та же настройка сайта (`proxy_ping_every`), но галочкой и в
    // шапке пула. Значение остаётся секундами — круг читает его как срок.
    //
    // ⚠ **Она не про эту вкладку, а про воркер.** У соседа похожая галочка
    // работает, пока открыта страница; здесь — постоянно, круглые сутки, и
    // закрытый браузер ей не помеха. Подпись поэтому без слова «пока».
    function autoBox() {
        if (!CAN_EDIT) return '';

        const on = autoOn();

        return '<label class="pxy-auto" title="Круг воркера будет проверять все выходы '
            + 'раз в пять минут. Работает и с закрытой панелью.">'
            + `<input type="checkbox" id="poolAuto"${on ? ' checked' : ''}>`
            + ' проверять каждые 5 минут</label>';
    }

    // Включена ли автопроверка. Умолчание берём из реестра, а не из литерала:
    // два места разошлись бы, и страница показывала бы не то, что делает круг.
    function autoOn() {
        const site = current() || {};
        const spec = known.find(one => one.key === PING_KEY) || {};
        const value = (site.settings || {})[PING_KEY];

        return String(value === undefined ? spec.default : value) !== '0';
    }

    async function autoSave() {
        const on = document.getElementById('poolAuto').checked;
        // `300` и `0` — значения из реестра: настройка хранится сроком в
        // секундах, потому что круг читает её как срок (`proxy_round.py`).
        await save({[PING_KEY]: on ? '300' : '0'});
    }

    const PING_KEY = 'proxy_ping_every';

    // Строка пула — **в одну линию**: адрес подключения своей колонкой, а не
    // второй строкой под именем. Выходов бывает два десятка, и строка в две
    // линии удваивает высоту таблицы ради того, на что смотрят изредка.
    function poolRow(one, seats) {
        // Мёртвая строка серая целиком: она в списке есть, но работать ею нельзя,
        // и раздача её не возьмёт. Причина — на месте пинга: иначе «серый»
        // читается как «выключен человеком», а это разные беды.
        // ⚠ Три разных «нет», и человек должен различать их с одного взгляда:
        // выключен человеком, не отвечает сам, жив но страна не отмечена.
        // Последнее чинится щелчком по чипсу, первые два — нет.
        const why = !one.is_enabled ? 'выключен в реестре'
                  : (!one.check_ok ? (one.check_error || 'не отвечает')
                     : (!one.check_ip ? 'не проверен'
                        : (one.country_off ? 'страна не отмечена' : '')));

        return `<tr class="${one.live ? '' : 'dead'}">`
            + `<td class="pxy-pool-name">${esc(one.name)}</td>`
            + `<td class="pxy-pool-where">${esc(one.scheme)}://${esc(one.host)}:${one.port}</td>`
            + `<td class="pxy-pool-ip">${esc(one.check_ip || '—')}`
            // ⚠ Совпал с нашим — выход не скрывает ничего. Метка рядом с самим
            // адресом: там на него и смотрят.
            + (one.is_direct
                ? ' <span class="pxy-warn" title="Тот же адрес, с которого ходит '
                  + 'сервер: этот выход ничего не скрывает — запрос идёт мимо него '
                  + 'либо он прозрачный">наш</span>' : '')
            + '</td>'
            // ⚠ Страна — **откуда канал выходит на самом деле**, а не что
            // написано в его имени: заведённый как «UA 193.93.54.238» отвечал
            // `TR`. Сайт сверяет геолокацию входа с легендой анкеты.
            + `<td class="pxy-c-cc">`
            + (one.check_country ? `<span class="pxy-cc">${esc(one.check_country)}</span>`
                                 : '<span class="pxy-dim">—</span>') + '</td>'
            + `<td class="pxy-pool-ping">`
            + (one.live ? pingText(one.check_ms) : `<span class="bad">${esc(why)}</span>`)
            + '</td>'
            + `<td class="pxy-c-seats${one.full ? ' full' : ''}">`
            + (one.live ? `${one.taken} / ${seats}` : '') + '</td>'
            + '</tr>';
    }

    // Цвет пинга: плавно от зелёного к красному.
    //
    // ⚠ **Шкала логарифмическая, а не линейная.** Пинги живых каналов лежат от
    // 200 мс до 18 секунд; по прямой шкале всё медленнее секунды слилось бы в
    // один красный, и разница между 2 и 15 секундами пропала бы — а она и есть
    // та, по которой канал выбирают.
    //
    // Границы грубые намеренно: точнее их не знает никто, а цвет здесь подсказка
    // «что брать», а не приговор.
    const PING_FAST_MS = 150;
    const PING_SLOW_MS = 15000;

    function pingColor(ms) {
        const span = Math.log(PING_SLOW_MS / PING_FAST_MS);
        const at = Math.log(Math.max(PING_FAST_MS, Math.min(PING_SLOW_MS, ms)) / PING_FAST_MS);

        // 130° — зелёный, 0° — красный. Светлота 38%, иначе жёлтая середина
        // теряется на белом фоне.
        return `hsl(${Math.round(130 * (1 - at / span))}, 72%, 38%)`;
    }

    function pingText(ms) {
        if (!ms) return '';

        return `<span style="color:${pingColor(ms)}">${ms} мс</span>`;
    }

    async function poolCheck() {
        const button = document.getElementById('poolCheck');
        button.disabled = true;
        button.textContent = 'Проверяю…';

        try {
            const got = (await postData(`${BASE}/api/dating/proxy/check`, {})).result;
            showNotification(`Проверено ${got.checked}, годных ${got.ok}`,
                             got.ok === got.checked ? 'success' : 'error');
        } catch (e) {
            showNotification('Проверка не прошла: ' + e.message, 'error');
        }

        await poolLoad();
    }

    // Свои настройки — отдельным блоком, последним: они не из реестра, и мешать
    // их к известным значило бы прятать среди них то, что завели руками.
    function customBox(site, custom) {
        const off = setTab === 'custom' ? '' : ' off';

        if (!custom.length) {
            return CAN_EDIT
                ? `<div class="set-box${off}" data-set-pane="custom">`
                  + '<div class="set-box-head">Свои настройки</div>'
                  + '<div class="site-empty">Своих настроек у этого сайта нет — '
                  + 'заведите, если нужны</div></div>'
                : '';
        }

        return `<div class="set-box${off}" data-set-pane="custom">`
            + '<div class="set-box-head">Свои настройки</div>'
            + '<table class="set-table"><tbody>'
            + custom.map(key => row(site, key)).join('')
            + '</tbody></table>'
            + '</div>';
    }

    function knownRow(site, spec) {
        const value = (site.settings || {})[spec.key];
        const chosen = value === undefined ? spec.default : value;
        const saved = value !== undefined;

        return `<tr data-key="${esc(spec.key)}" data-known="1"`
            + `${spec.options.length ? '' : ' data-free="1"'}>`
            + '<td>'
            + `<span class="set-title">${esc(spec.title)}</span>`
            + `<span class="set-key-small">${esc(spec.key)}</span>`
            + (spec.note ? `<span class="set-note">${noteHtml(spec.note)}</span>` : '')
            + '</td>'
            + '<td>'
            + (spec.pair ? pairInputs(site, spec)
                : (spec.options.length ? knownSelect(spec, chosen)
                                       : knownInput(spec, chosen)))
            + (saved || !spec.options.length
                ? '' : '<span class="set-note">умолчание — пока не сохраняли</span>')
            + '</td>'
            + (CAN_EDIT ? '<td class="set-col-act"></td>' : '')
            + '</tr>';
    }

    // Промежуток «от … до …»: два поля в одной ячейке, под одним заголовком.
    //
    // ⚠ Границы — **один вопрос, заданный двумя числами**, и порознь они
    // бессмысленны: «до» без «от» не значит ничего. Двумя строками таблицы они
    // читались бы как две независимые настройки, а стоять рядом им мешала бы
    // сортировка реестра.
    //
    // ⚠ **Ведомой может не оказаться** — старый ответ сервера, опечатка в
    // `pair`. Тогда рисуем ведущую обычным полем: потерять настройку хуже, чем
    // показать её без пары. Тот же довод, что у «Прочего» и неизвестных
    // подразделов.
    function pairInputs(site, spec) {
        const mate = known.find(one => one.key === spec.pair);
        if (!mate) return pairHalf(site, spec);

        return '<span class="set-pair">'
            + pairHalf(site, spec) + pairHalf(site, mate)
            + '</span>';
    }

    // Половина промежутка: своя подпись и своё поле со своим ключом.
    function pairHalf(site, spec) {
        const value = (site.settings || {})[spec.key];
        const chosen = value === undefined ? spec.default : value;

        return '<span class="set-pair-half">'
            + (spec.label ? `<span class="set-pair-label">${esc(spec.label)}</span>` : '')
            + knownInput(spec, chosen)
            + '</span>';
    }

    function knownSelect(spec, chosen) {
        return `<select class="set-value set-select"${CAN_EDIT ? '' : ' disabled'}>`
            + spec.options.map(opt =>
                `<option value="${esc(opt.value)}"`
                + `${String(opt.value) === String(chosen) ? ' selected' : ''}>`
                + `${esc(opt.title)}</option>`).join('')
            + '</select>';
    }

    // Известная настройка без набора значений — обычное поле: адрес, пароль.
    //
    // ⚠ **Секрет приходит точками и точками же уходит обратно.** Настоящего
    // значения страница не знает (`site_.py`), а сохранение понимает точки
    // как «оставить прежний». Поэтому поле не пустое: пустое читалось бы как
    // «пароль не задан», и его вписали бы второй раз, гадая, почему не работало.
    // ⚠ Пустое поле говорит словами, что настройки у **этого** сайта нет.
    //
    // Строки известных настроек стоят у каждого сайта — это реестр, один на все.
    // Пустое поле без подписи читалось бы как «здесь то же, что у соседнего», и
    // так и прочли: страницу Goldenbride приняли за копию страницы Ladadate.
    function knownInput(spec, chosen) {
        // ⚠ Числовая настройка — своё поле с границами: браузер сам не пустит
        // «-5» и «101», а стрелки и колесо мыши делают подбор доли делом одного
        // движения. Сервер их всё равно проверяет (`_number_check`): запрос
        // приходит и мимо формы.
        const число = spec.kind === 'number';
        const границы = число
            ? (spec.min === null || spec.min === undefined ? '' : ` min="${spec.min}"`)
              + (spec.max === null || spec.max === undefined ? '' : ` max="${spec.max}"`)
              + ' step="1" inputmode="numeric"'
            : '';

        // ⚠ Ключ стоит **у поля**, а не только у строки: в строке промежутка
        // полей два, и ключ строки назвал бы оба одним — «до» сохранялось бы
        // поверх «от».
        const field = `<input type="${число ? 'number' : (spec.secret ? 'password' : 'text')}"`
            + ` class="set-value${число ? ' set-number' : ''}"${границы}`
            + ` data-key="${esc(spec.key)}"`
            + ` autocomplete="off"${CAN_EDIT ? '' : ' disabled'}`
            + ` placeholder="${esc(spec.default || 'не задано у этого сайта')}"`
            + ` value="${esc(chosen)}">`;

        // ⚠ Глаз только у заведённого секрета: показывать нечего, пока значения
        // нет, а кнопка, которая всегда отвечает «нет такой настройки», читается
        // как поломка.
        if (!spec.secret || !chosen) return field;

        return '<span class="set-secret">' + field
            + '<button type="button" class="set-eye" title="Показать значение">👁</button>'
            + '</span>';
    }

    function row(site, key) {
        return `<tr data-key="${esc(key)}">`
            + `<td class="set-key">${esc(key)}</td>`
            + '<td>'
            + `<input type="text" class="set-value" autocomplete="off"${CAN_EDIT ? '' : ' disabled'}`
            + ` value="${esc(site.settings[key])}"></td>`
            + (CAN_EDIT
                ? '<td class="set-col-act">'
                  + '<button type="button" class="set-drop" title="Убрать настройку">✕</button></td>'
                : '')
            + '</tr>';
    }

    function bind() {
        // ⚠ Вкладки вешаем **до** проверки прав: читать настройки вправе всякий
        // вошедший, и запертые вкладки у неадмина означали бы страницу, на которой
        // видна только первая группа из семи.
        //
        // Слушатель на полосе, а не на кнопках: полоса переживает перерисовку
        // панелей, а кнопки — нет. Тот же приём, что на «Профилях».
        const tabs = bodyEl.querySelector('.set-tabs');
        if (tabs) {
            tabs.addEventListener('click', (e) => {
                const btn = e.target.closest('.page-tab');
                if (!btn || btn.dataset.setTab === setTab) return;

                setTab = btn.dataset.setTab;
                localStorage.setItem(SET_TAB_KEY, setTab);
                setTabPaint();

                // Пул грузится при первом заходе на свою вкладку: до этого его
                // панель нарисована пустой, и там нечего показывать.
                if (setTab === 'proxy' && !_pool.length) poolLoad();
            });
        }

        if (!CAN_EDIT) return;

        const proxySwitch = document.getElementById('proxyOnBox');
        if (proxySwitch) proxySwitch.addEventListener('change', proxyOnSave);

        // Набор значений сохраняется сразу по выбору: отдельная кнопка «применить»
        // у селекта из трёх вариантов — лишний шаг, а несохранённый выбор в нём не
        // отличить от сохранённого.
        bodyEl.querySelectorAll('tr[data-known] .set-select').forEach(select => {
            const key = select.closest('tr').dataset.key;
            select.addEventListener('change', () => save({[key]: select.value}));
        });

        // Поля ввода — и у незнакомых ключей, и у известных без набора значений:
        // правятся они одинаково, и второй набор обработчиков разошёлся бы с первым.
        // ⚠ **Глаз спрашивает значение у сервера, а не берёт из разметки.** В
        // поле лежит маска (`••••••••`), и «показать» её значило бы показать
        // точки. Ручка отдельная и закрыта админом: так обращение к паролю видно в
        // журнале запросов как отдельное событие, а не растворяется в обычном
        // показе страницы (`api.md`, §3.5).
        //
        // Раскрытое поле обратно не прячем: человек нажал «показать» — значит
        // смотрит. Прятать по второму нажатию — лишнее состояние там, где хватает
        // перезагрузки страницы.
        bodyEl.querySelectorAll('.set-eye').forEach(eye => {
            const tr = eye.closest('tr');
            const input = tr.querySelector('.set-value');

            eye.addEventListener('click', async () => {
                eye.disabled = true;
                try {
                    const r = await getData(`${BASE}/api/dating/site/${siteId()}`
                                            + `/reveal/${encodeURIComponent(tr.dataset.key)}`);
                    input.type = 'text';
                    input.value = r.result.value || '';
                    // Значение в поле — уже настоящее, и сохранение поймёт его как
                    // новое: маска больше не придёт, а значит и «оставить прежний»
                    // не сработает. Это верно — показанное и есть прежнее.
                    input.dataset.saved = input.value;
                    eye.remove();
                } catch (e) {
                    showNotification('Не показать: ' + e.message, 'error');
                    eye.disabled = false;
                }
            });
        });

        // ⚠ Перебираем **поля**, а не строки: в строке промежутка их два, и
        // обработчик на строку взял бы первое, а правку второго потерял бы
        // молча. Ключ при этом берётся у поля (`data-key`) и только для
        // незнакомых ключей — у строки: там поле одно и ключа не несёт.
        bodyEl.querySelectorAll('tr[data-key]:not([data-known]) .set-value,'
                                + ' tr[data-free] .set-value').forEach(input => {
            const tr = input.closest('tr');
            const key = input.dataset.key || tr.dataset.key;
            input.dataset.saved = input.value;

            input.addEventListener('input', () => {
                input.classList.toggle('dirty', input.value !== input.dataset.saved);
            });
            // Enter и уход из поля — одно действие; Escape возвращает прежнее.
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') {
                    input.value = input.dataset.saved;
                    input.classList.remove('dirty');
                    input.blur();
                }
            });
            input.addEventListener('change', () => save({[key]: input.value}, input));
        });

        // Кнопки «убрать» у известной настройки нет: её не заводили руками, и
        // убирать нечего — пустое значение и так означает «нет настройки».
        //
        // ⚠ Своим циклом, а не внутри полей: перебор идёт по полям, и у строки с
        // двумя полями обработчик повесился бы дважды.
        bodyEl.querySelectorAll('.set-drop').forEach(dropBtn => {
            const key = dropBtn.closest('tr').dataset.key;
            dropBtn.addEventListener('click', () => drop(key));
        });

        const form = document.getElementById('addForm');
        document.getElementById('addSave').addEventListener('click', async () => {
            const key = document.getElementById('addKey').value.trim();
            const value = document.getElementById('addValue').value;
            if (!key) return showNotification('Ключ не может быть пустым', 'error');
            // Пустое значение на сервере означает «не хранить», и завести им
            // настройку нельзя: строка не появилась бы, а человек решил бы, что
            // появилась. То же правило, что на «Настройки → Значения».
            if (!value) return showNotification('Значение не может быть пустым', 'error');

            if (await save({[key]: value})) form.classList.remove('on');
        });
        document.getElementById('addCancel').addEventListener('click', () => {
            form.classList.remove('on');
        });
    }

    // ⚠ Ручка переписывает набор **целиком**, поэтому шлём весь, подменив в нём
    // изменённое. Отправь мы одну пару — остальные настройки сайта пропали бы.
    async function save(patch, input) {
        const site = current();
        if (!site) return false;

        const settings = {...site.settings, ...patch};
        // Пустое значение сервер выбрасывает; убираем его и у себя, чтобы
        // показанное совпадало с сохранённым без второго запроса.
        for (const [key, value] of Object.entries(settings)) {
            if (value === '') delete settings[key];
        }

        if (input) input.disabled = true;
        try {
            site.settings = (await putData(`${BASE}/api/dating/site/${site.id}`,
                                           {settings})).result.settings || {};
        } catch (e) {
            if (input) {
                input.value = input.dataset.saved;
                input.classList.remove('dirty');
            }
            showNotification('Не сохранилось: ' + e.message, 'error');
            return false;
        } finally {
            if (input) input.disabled = false;
        }

        showNotification('Настройки сайта сохранены', 'success');
        paint();

        return true;
    }

    async function drop(key) {
        if (!confirm(`Убрать настройку «${key}»? Начнёт действовать умолчание кода.`)) return;

        await save({[key]: ''});
    }

    if (CAN_EDIT) {
        document.getElementById('addBtn').addEventListener('click', () => {
            const form = document.getElementById('addForm');
            if (!form) return;
            form.classList.add('on');
            document.getElementById('addKey').focus();
        });
    }

    siteEl.addEventListener('change', () => {
        localStorage.setItem(DATING_SITE_KEY, siteEl.value);
        paint();
    });

    (async () => {
        try {
            await datingSiteFill(siteEl, BASE);
        } catch (e) {
            siteEl.innerHTML = '<option value="">сайты не пришли</option>';
            showNotification('Список сайтов не пришёл: ' + e.message, 'error');
        }
        hintEl.textContent = CAN_EDIT ? 'настройки сайта на нашей стороне'
                                      : 'настройки сайта — правит администратор';
        await load();
    })();
</script>
{% endblock %}
