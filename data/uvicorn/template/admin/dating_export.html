{% extends "base.html" %}

{% block title %}Профили | DatingAi{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ base }}/static/css/dating_page.css">
    <style>
        /* Обойма, шапка и панель — общие с «Чатами» (`dating_page.css`). Здесь
           только раскладка этой страницы: шапка и под ней одна панель во всю
           оставшуюся высоту. Колонок и разделителей нет — делить нечего. */
        .dating-page { grid-template-rows: auto minmax(0, 1fr); }

        /* Таблица прокручивается вбок сама, а не растягивает страницу: колонки
           приходят из сценария, сколько их — заранее неизвестно, а
           горизонтальная прокрутка всего окна ломает шапку панели. Тело панели
           при этом отвечает за прокрутку вниз, поэтому поля у него сняты —
           иначе шапка таблицы уезжала бы от края. */
        .exp-body { padding: 0; overflow: auto; }

        .exp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .exp-table th {
            position: sticky; top: 0; z-index: 1;
            padding: 7px 12px; text-align: left; white-space: nowrap;
            background: #f8fafc; border-bottom: 1px solid #e5e7eb;
            font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .exp-table td { padding: 6px 12px; border-bottom: 1px solid #f1f5f9; color: #374151; }
        .exp-table tr:last-child td { border-bottom: none; }
        .exp-table tr:hover td { background: #f8fafc; }

        .exp-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .exp-no { color: #9ca3af; text-align: right; width: 1%; white-space: nowrap; }

        .exp-empty { padding: 24px 12px; text-align: center; color: #9ca3af; font-size: 13px; }
    </style>
{% endblock %}

{% block content %}
<div class="dating-page">

    <div class="dating-head">
        <h1>🌐 Сайт</h1>
        <select id="siteSelect" title="Сайт, с которого выгружаем профили"></select>
        <button type="button" class="dating-btn primary" id="loadBtn">Загрузить профили</button>
        <span class="dating-hint" id="hint">сценарий гоняется в браузере RhapsodyAi</span>
    </div>

    <div class="pane">
        <div class="pane-head">Профили <span id="profilesN"></span></div>
        <div class="pane-body exp-body" id="table"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, postData} from '{{ base }}/static/js/api.js';
    import {showNotification} from '{{ base }}/static/js/notification.js';

    const BASE = '{{ base }}';

    // Ключ тот же, что на странице «Чаты», — намеренно. Человек ходит между
    // двумя страницами раздела, и разный выбор сайта там и тут читается как
    // «я же выбрал ladadate», а выгрузка идёт не с того сайта.
    const SITE_KEY = 'dating_site';

    const siteEl = document.getElementById('siteSelect');
    const loadBtn = document.getElementById('loadBtn');
    const tableEl = document.getElementById('table');
    const hintEl = document.getElementById('hint');
    const countEl = document.getElementById('profilesN');

    function esc(value) {
        const el = document.createElement('div');
        el.textContent = value == null ? '' : value;
        return el.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const siteId = () => Number(siteEl.value || 0);

    async function sitesLoad() {
        let sites;
        try {
            sites = (await getData(BASE + '/api/site')).result || [];
        } catch (e) {
            siteEl.innerHTML = '<option value="">сайты не пришли</option>';
            showNotification('Список сайтов не пришёл: ' + e.message, 'error');
            return;
        }

        const saved = localStorage.getItem(SITE_KEY);
        siteEl.innerHTML = sites.length
            ? sites.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')
            : '<option value="">сайтов нет</option>';
        if (saved && sites.some(r => String(r.id) === saved)) siteEl.value = saved;
    }

    function empty(text) {
        tableEl.innerHTML = `<div class="exp-empty">${esc(text)}</div>`;
        countEl.textContent = '';
    }

    function tablePaint(columns, profiles) {
        if (!profiles.length) {
            empty('Сценарий отработал, но профилей не вернул.');
            return;
        }

        // Номер строки — не украшение: колонки приходят из сценария, имена у них
        // чужие, и «сколько всего» иначе считать глазами.
        const head = '<th class="exp-no">#</th>' + columns.map(c => `<th>${esc(c)}</th>`).join('');
        const rows = profiles.map((row, index) =>
            `<tr><td class="exp-no">${index + 1}</td>` +
            columns.map(c => `<td class="exp-cell" title="${esc(row[c])}">${esc(row[c])}</td>`).join('') +
            '</tr>').join('');

        tableEl.innerHTML = `<table class="exp-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
        // Счётчик — в шапке панели, как число анкет на «Чатах»: подсказка рядом с
        // кнопкой рассказывает, что делает кнопка, а не что получилось.
        countEl.textContent = profiles.length;
    }

    async function profilesLoad() {
        if (!siteId()) {
            showNotification('Сначала выберите сайт', 'error');
            return;
        }

        // Кнопка гасится на время прогона: сценарий идёт десятки секунд, и второе
        // нажатие завело бы у соседа вторую вкладку браузера на ту же работу.
        const label = loadBtn.textContent;
        loadBtn.disabled = true;
        loadBtn.textContent = 'Гружу…';
        empty('Гоняю сценарий в браузере RhapsodyAi — это занимает десятки секунд.');
        hintEl.textContent = 'жду ответа сценария…';

        let result;
        try {
            result = (await postData(`${BASE}/api/dating/export/profile?site_id=${siteId()}`, {})).result || {};
        } catch (e) {
            empty('Профили не пришли.');
            showNotification('Профили не пришли: ' + e.message, 'error');
            return;
        } finally {
            loadBtn.disabled = false;
            loadBtn.textContent = label;
            hintEl.textContent = 'сценарий гоняется в браузере RhapsodyAi';
        }

        // Упавший сценарий приходит с кодом 200 — это ответ «вот что вышло», а не
        // сбой панели (так же отвечает и сам RhapsodyAi). Показываем текстом и
        // номером шага: по ним видно, что сайт поменял вёрстку.
        if (result.status !== 'ok') {
            empty(`Сценарий встал на шаге ${result.step_no || 0}: ${result.error || 'без объяснения'}`);
            showNotification(`Сценарий «${result.scenario || ''}» не отработал`, 'error');
            return;
        }

        tablePaint(result.columns || [], result.profiles || []);
    }

    siteEl.addEventListener('change', () => localStorage.setItem(SITE_KEY, siteEl.value));
    loadBtn.addEventListener('click', profilesLoad);

    empty('Выберите сайт и нажмите «Загрузить профили».');
    sitesLoad();
</script>
{% endblock %}
