{% extends "base.html" %}

{% block title %}Профили | DatingAi{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ base }}/static/css/dating_page.css">
    <style>
        /* Обойма, шапка, панель, журнал и значки учётки — общие с «Анкетами»
           (`dating_page.css`). Здесь только раскладка этой страницы: шапка во всю
           ширину, под ней три колонки — список, настройки выбранной анкеты, её
           журнал.

           Порядок колонок повторяет порядок работы: нашёл анкету в списке →
           правишь её посередине → смотришь, что вышло, в журнале справа. Настройки
           стоят между списком и журналом не для симметрии: правка и её последствия
           должны быть рядом, иначе после каждого нажатия глаз ходит через весь
           экран.

           Ширины: список тянется, настройки 340px (столько нужно строке
           расписания — метка, два времени и удаление), журнал 20%. Отдать
           настройкам больше значит отнять у списка, ради которого на страницу и
           приходят. Разделителей нет — тянуть тут нечего. */
        .dating-page {
            grid-template-columns: minmax(0, 1fr) 340px 20%;
            grid-template-rows: auto minmax(0, 1fr);
        }
        .dating-head { grid-column: 1 / -1; }
        .prof-pane { grid-column: 1; grid-row: 2; }
        .edit-pane { grid-column: 2; grid-row: 2; }
        .log-pane { grid-column: 3; grid-row: 2; }

        /* Настройки прокручиваются: блоков четыре, и на невысоком экране они не
           влезают. Список рядом при этом остаётся без прокрутки — у него своё
           правило (пейджер вместо неё), и смешивать их нельзя. */
        .edit-body { display: flex; flex-direction: column; gap: 16px; padding: 12px; }
        .edit-pane .pane-body { overflow-y: auto; }
        .edit-empty { padding: 20px 12px; color: #9ca3af; font-size: 12px; text-align: center; }

        /* Колонка узкая, а логин длинный: без многоточия имя анкеты растолкало бы
           заголовок панели и уехало за её край. */
        .log-pane .pane-head { min-width: 0; }
        .log-pane .pane-head, .edit-pane .pane-head { min-width: 0; }
        #logWho, #editWho { min-width: 0; color: #94a3b8;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Вертикальной прокрутки нет намеренно: сколько строк влезло — столько на
           странице, остальные за пейджером. Прокрутка вместе с пейджером это две
           навигации сразу, и обе неполные.

           Вбок прокрутка остаётся: узкое окно сжимает колонки, и лучше отъехать
           вбок, чем читать имя по одной букве. Поля сняты, чтобы таблица шла от
           края до края. */
        .prof-body { padding: 0; overflow-x: auto; overflow-y: hidden; }

        .prof-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        /* Липкой шапке взяться неоткуда: вертикальной прокрутки у тела нет. */
        .prof-table th {
            padding: 7px 12px; text-align: left; white-space: nowrap;
            background: #f8fafc; border-bottom: 1px solid #e5e7eb;
            font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .prof-table td { padding: 6px 12px; border-bottom: 1px solid #f1f5f9; color: #374151; }
        .prof-table tr:last-child td { border-bottom: none; }
        .prof-table tbody tr.prof-row { cursor: pointer; }
        .prof-table tbody tr.prof-row:hover td { background: #f8fafc; }


        /* Столбец состояния — самый узкий и первый: сначала смотрят, всё ли в
           порядке, и только потом читают, у кого именно. */
        .prof-state { width: 1%; white-space: nowrap; }
        .prof-state > * + * { margin-left: 5px; }

        /* Выбранная строка. Полоса слева, а не только фон: фон у строки под
           курсором почти такой же, и без полосы выбранное теряется ровно в тот
           момент, когда мышь идёт к настройкам. */
        .prof-table tbody tr.prof-row.open td { background: #eef2ff; }
        .prof-table tbody tr.prof-row.open td:first-child {
            box-shadow: inset 3px 0 0 #4f46e5;
        }

        /* Кто это: лицо, имя, под ним логин. Ширину не задаём — колонка забирает
           остаток строки, и режется многоточием именно она, а не бейджи и время. */
        .prof-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .prof-who-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .prof-name { font-weight: 600; color: #111827; font-size: 13px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prof-login { color: #6b7280; font-size: 11px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .prof-work { white-space: nowrap; }
        .prof-work > * + * { margin-left: 5px; }

        .prof-when { color: #6b7280; white-space: nowrap; }
        .prof-note { color: #6b7280; max-width: 280px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prof-note.bad { color: #b91c1c; }

        /* Ответ «нет» пишем прочерком, а не пустотой: пустая ячейка читается как
           «не успело загрузиться». */
        .prof-no { color: #cbd5e1; }
        .prof-yes { color: #15803d; font-weight: 700; }

        .prof-act { width: 1%; white-space: nowrap; text-align: right; }

        .prof-empty { padding: 24px 12px; text-align: center; color: #9ca3af; font-size: 13px; }

        /* ---------- Раскрытая карточка ---------- */

        .prof-form { display: flex; flex-direction: column; gap: 7px; }
        .prof-form h4 {
            margin: 0; font-size: 10px; font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .prof-line { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }

        .prof-field { display: flex; flex-direction: column; gap: 2px; }
        .prof-field > span { font-size: 10px; color: #94a3b8; }
        .prof-field input, .prof-field select {
            padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px;
            font-family: inherit; font-size: 12px; color: #374151; background: #fff;
        }
        .prof-field input:focus, .prof-field select:focus { outline: none; border-color: #c7d2fe; }

        /* Галка читается вместе с подписью, поэтому подпись и есть кнопка. */
        .prof-check { display: flex; align-items: center; gap: 5px; font-size: 12px;
                      color: #374151; cursor: pointer; user-select: none; }

        .prof-card-note { font-size: 11px; color: #94a3b8; }
        .prof-card-note.bad { color: #b91c1c; }

        /* Состояние импорта рядом с кнопкой. Словом, а не только цветом кнопки:
           погашенная кнопка говорит «нельзя», но не говорит почему, а причина у
           неё бывает разная — сайт без сценария или недоступный сосед. */
        .import-state { font-size: 11px; font-weight: 600; white-space: nowrap; }
        .import-state.on { color: #166534; }
        .import-state.off { color: #94a3b8; }

        /* Счёт строк в подвале таблицы: слева, кнопки страниц по центру. Он же
           держит подвал непустым там, где страница одна. */
        .prof-pane .pane-foot { justify-content: flex-start; }
        .prof-count { font-size: 11px; color: #94a3b8; margin-right: auto; }

        /* ---------- Расписание входов и выходов ---------- */

        /* Ширину задаёт колонка настроек — своей у блока нет. Она подобрана как
           раз под строку расписания: метка, два времени и удаление в один ряд. */

        .sched-list { display: flex; flex-direction: column; gap: 4px; }

        /* Строка расписания. Слева цветная планка — по ней тип читается раньше,
           чем слово: вход и выход чередуются, и глаз ищет ритм, а не текст. */
        .sched-row {
            display: flex; align-items: center; gap: 7px;
            padding: 4px 7px 4px 5px; border-radius: 6px;
            background: #f8fafc; border-left: 3px solid transparent;
        }
        .sched-row.in  { border-left-color: #16a34a; }
        .sched-row.out { border-left-color: #d97706; }

        .sched-kind { font-size: 11px; font-weight: 700; width: 44px; flex: 0 0 auto; }
        .sched-row.in  .sched-kind { color: #166534; }
        .sched-row.out .sched-kind { color: #92400e; }

        /* Своё поле времени вместо `input[type=time]`: нативное показывает часы в
           формате языка браузера, то есть «01:00 PM» на английском Chrome, и
           `lang` страницы этого не меняет. Здесь всегда 24 часа.

           Ширина под «чч:мм» и моноширинный шрифт: столбик времён читается
           сверху вниз, и цифры должны стоять друг под другом. */
        .sched-time {
            width: 58px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 5px;
            font-family: ui-monospace, Menlo, monospace; font-size: 12px;
            color: #374151; background: #fff; text-align: center;
        }
        .sched-time:focus { outline: none; border-color: #c7d2fe; }
        .sched-time::placeholder { font-family: inherit; color: #cbd5e1; }

        .sched-dash { color: #cbd5e1; font-size: 11px; }

        .sched-drop {
            margin-left: auto; border: none; background: none; cursor: pointer;
            color: #cbd5e1; font-size: 15px; line-height: 1; padding: 0 2px;
        }
        .sched-drop:hover { color: #b91c1c; }

        .sched-add { display: flex; gap: 6px; margin-top: 7px; }
        .sched-add .dating-btn { font-size: 11px; padding: 3px 9px; }

        /* Лента суток — то единственное, ради чего этот блок выглядит не как
           список полей. Расписание отвечает на вопрос «когда анкета в сети», и
           ответ на него — полоса, а не строки: по ней сразу видно и дыры между
           сменами, и главную беду — вход, за которым не идёт выход. */
        .sched-day {
            position: relative; height: 16px; margin-top: 9px;
            border-radius: 4px; background: #f1f5f9; overflow: hidden;
        }
        .sched-span { position: absolute; top: 0; bottom: 0; background: #a5b4fc; }
        /* Незакрытая смена: полоса уходит вправо штриховкой и не кончается —
           ровно то, что произойдёт с анкетой, если выход не поставить. */
        .sched-span.open {
            background: repeating-linear-gradient(115deg, #fecaca 0 5px, #fee2e2 5px 10px);
        }
        /* Размытость интервала: у времени «между 10 и 11» края не резкие, и полоса
           это показывает — иначе интервал ничем не отличался бы от точного часа. */
        .sched-span.fuzzy-start { border-left: 2px dotted #6366f1; }
        .sched-span.fuzzy-end { border-right: 2px dotted #6366f1; }

        .sched-hours {
            display: flex; justify-content: space-between;
            font-size: 9px; color: #cbd5e1; margin-top: 2px;
        }

        .sched-empty { font-size: 11px; color: #94a3b8; padding: 6px 0; }
        .sched-warn { color: #b91c1c; }
    </style>
{% endblock %}

{% block content %}
<div class="dating-page">

    <div class="dating-head">
        <h1>🌐 Сайт</h1>
        <select id="siteSelect" title="Сайт, на котором заведены анкеты"></select>
        <button type="button" class="dating-btn" id="importBtn" disabled>Импортировать профили</button>
        <span class="import-state" id="importState"></span>
        <span class="dating-hint" id="hint"></span>
    </div>

    <div class="pane prof-pane">
        <div class="pane-head">
            Профили <span id="profilesN"></span>
            <input type="search" id="profileFind" class="pane-find" placeholder="имя или почта"
                   spellcheck="false" autocomplete="off"
                   title="Ищет и по имени, и по почте — одним полем, любой кусок строки">
        </div>
        <div class="pane-body prof-body" id="table"></div>
        <div class="pane-foot" id="profilesPager"></div>
    </div>

    <div class="pane edit-pane">
        <div class="pane-head">Настройки <span id="editWho"></span></div>
        <div class="pane-body" id="edit"></div>
    </div>

    <div class="pane log-pane">
        <div class="pane-head">Журнал <span id="logWho"></span></div>
        <div class="pane-body" id="log"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, postData, putData, deleteData} from '{{ base }}/static/js/api.js';
    import {showNotification} from '{{ base }}/static/js/notification.js';
    import {esc, statusDot, warnBadge, workPills, seenText, pagerRender, logRender}
        from '{{ base }}/static/js/dating_view.js';
    // Загрузка селекта общая на весь раздел: ключ выбора у страниц один, и
    // разъехавшиеся копии писали бы в него разное.
    import {DATING_SITE_KEY, datingSiteFill} from '{{ base }}/static/js/dating_site.js';

    const BASE = '{{ base }}';

    // Список освежается сам: статус, непрочитанные и время входа меняет не эта
    // страница, а опрос присутствия на сервере. Реже минуты — и таблица врёт
    // молча; чаще — незачем, опрос всё равно ходит раз в 15 секунд.
    const RELOAD_MS = 30000;

    // Журнал ходит чаще списка: в него пишут пинг, вход и отключение — то, что
    // человек только что нажал и чей результат ждёт. Строка на одну анкету стоит
    // одного запроса, и десять секунд здесь дешевле, чем ожидание вслепую.
    const LOG_MS = 10000;

    // Сколько строк на странице — считается от высоты панели, а не задано числом.
    // Смысл пейджера в том, чтобы прокрутки не было вовсе: с ней теряется место, а
    // вернуться к строке, которую только что смотрел, нечем. Постоянное число не
    // годится — на ноутбуке оно даёт прокрутку, на большом экране пустоту внизу.
    //
    // Это первая прикидка, до того как измерена настоящая высота строки.
    const PAGE_SIZE_GUESS = 15;

    const siteEl = document.getElementById('siteSelect');
    const importBtn = document.getElementById('importBtn');
    const importStateEl = document.getElementById('importState');
    const tableEl = document.getElementById('table');
    const hintEl = document.getElementById('hint');
    const countEl = document.getElementById('profilesN');
    const findEl = document.getElementById('profileFind');
    const pagerEl = document.getElementById('profilesPager');
    const logEl = document.getElementById('log');
    const logWhoEl = document.getElementById('logWho');
    const editEl = document.getElementById('edit');
    const editWhoEl = document.getElementById('editWho');

    let profiles = [];
    let page = 0;
    let perPage = PAGE_SIZE_GUESS;
    // Какая анкета раскрыта. Она же выбранная: журнал справа показывает её, и
    // двух выбранных «где я сейчас» не бывает. Ноль — не раскрыта ни одна.
    let openId = 0;
    // Кого сейчас держит долгое действие: вход идёт минутами, и перерисовка не
    // должна ни затирать «Вхожу…», ни подсовывать кнопку под руку второй раз.
    const busy = new Set();
    // Ход последнего импорта — строками, как их вернул сервер. Держим здесь, а не
    // в разметке: панель журнала перерисовывается своим кругом, и ход импорта
    // должен её пережить.
    let importLog = [];
    let importBusy = false;

    // Расписание раскрытой анкеты, пока его набирают. Живёт здесь, а не в
    // разметке: карточка перерисовывается при каждой правке списка, и набранное
    // обязано это пережить. Ключ — id анкеты, значение — массив записей
    // `{kind: 'in'|'out', from: '10:00', to: '11:00'}`; `to` пустое значит
    // «точно в это время», непустое — «в любой момент между».
    //
    // ⚠ Сервера у расписания пока нет: ручка и таблица появятся отдельным шагом.
    // Здесь только вид и правила ввода, поэтому набранное живёт до перезагрузки
    // страницы — и об этом прямо сказано под блоком, чтобы никто не решил, будто
    // расписание уже работает.
    const scheduleDraft = new Map();

    const siteId = () => Number(siteEl.value || 0);
    const openRow = () => profiles.find(row => row.id === openId) || null;

    function empty(text) {
        tableEl.innerHTML = `<div class="prof-empty">${esc(text)}</div>`;
        countEl.textContent = '';
    }

    async function sitesLoad() {
        try {
            await datingSiteFill(siteEl, BASE);
        } catch (e) {
            siteEl.innerHTML = '<option value="">сайты не пришли</option>';
            showNotification('Список сайтов не пришёл: ' + e.message, 'error');
            return;
        }

        importReadyLoad();
        profilesLoad();
    }

    async function profilesLoad() {
        if (!siteId()) {
            empty('Сайтов нет — заведите закладку в RhapsodyAi.');
            return;
        }

        // Запрошенный сайт запоминаем: ответ приходит не мгновенно, а человек за
        // это время может переключить селект. Без сверки поздний ответ старого
        // сайта затирал бы список нового.
        const requestSite = siteId();
        try {
            profiles = (await getData(`${BASE}/api/dating/profile?site_id=${requestSite}`)).result || [];
        } catch (e) {
            if (siteId() !== requestSite) return;
            empty('Список не пришёл.');
            showNotification('Список профилей не пришёл: ' + e.message, 'error');
            return;
        }

        if (siteId() !== requestSite) return;

        // Раскрытой анкеты могло не стать: её удалили здесь же или она ушла вместе
        // со сменой сайта. Держать открытой строку, которой в списке нет, нельзя —
        // журнал справа показывал бы чужое.
        if (openId && !openRow()) openSet(0);

        tablePaint();
    }

    function shownRows() {
        const needle = findEl.value.trim().toLowerCase();
        if (!needle) return profiles;

        // Одним полем по трём приметам: имя, почта (она же логин) и номер анкеты
        // на сайте. Человек не обязан помнить, что из этого где лежит, — он ищет
        // «ту самую Diana» или «ту, что с bigmir», и оба пути должны работать.
        return profiles.filter(row => [row.name, row.login, row.site_uid]
            .map(part => String(part || '')).join(' ')
            .toLowerCase().includes(needle));
    }

    function actCell(row) {
        // Кнопка одна и всегда одна и та же — в отличие от «Анкет», где их три и
        // они меняются по состоянию учётки. Здесь смотрят на список целиком, и
        // столбец, в котором у каждой строки своя кнопка, читается как сыпь.
        // Остальные действия уехали внутрь карточки: они над одной анкетой, и
        // место им там, где на неё и смотрят.
        if (busy.has(row.id)) {
            return '<button type="button" class="dating-btn busy" disabled>'
                 + '<span class="dating-spin"></span>Жду…</button>';
        }

        // Пинг идёт по сохранённым cookie: нет входа — нечем и стучаться.
        return `<button type="button" class="dating-btn ping-btn"${row.has_state ? '' : ' disabled'}`
             + ` title="${row.has_state ? 'Спросить сайт, жив ли вход — по HTTP, без браузера'
                                        : 'входа ещё не было: нечем стучаться'}">Пинг</button>`;
    }

    // Сколько строк влезает в панель. Меряем по уже нарисованной таблице: высота
    // строки зависит от шрифта и аватара, и зашитое число разъехалось бы с
    // разметкой при первой же правке стилей.
    //
    // Меряем строку списка (`.prof-row`): в таблице других строк и не бывает —
    // настройки выбранной анкеты стоят в соседней колонке, а не внутри списка.
    function rowsFit() {
        const probe = tableEl.querySelector('tbody tr.prof-row');
        const head = tableEl.querySelector('thead');
        if (!probe) return perPage;

        const rowH = probe.getBoundingClientRect().height;
        if (rowH < 1) return perPage;

        const free = tableEl.clientHeight - (head ? head.getBoundingClientRect().height : 0);

        return Math.max(1, Math.floor(free / rowH));
    }

    // `tries` — сколько ещё раз можно перерисовать, подгоняя число строк.
    //
    // Заходов нужно больше одного, и вот почему. Первый рисует прикидкой, когда
    // подвала с пейджером ещё нет, и меряет тело панели во всю высоту. Как только
    // пейджер появляется, тело сжимается на его высоту — и последняя строка
    // уезжает под него. Второй заход меряет уже с пейджером и снимает лишнюю
    // строку; третий обычно только подтверждает, что сошлось.
    //
    // Счётчик, а не «можно/нельзя»: без потолка подгонка могла бы качаться
    // туда-сюда, если строка и пейджер совпадут по высоте неудачно.
    function tablePaint(tries = 3) {
        const found = shownRows();
        countEl.textContent = found.length === profiles.length
            ? profiles.length : `${found.length} из ${profiles.length}`;

        if (!profiles.length) {
            empty('На этом сайте учёток пока нет. Заводят их на странице «Анкеты».');
            pagerRender(pagerEl, 0, 0, () => {});
            return;
        }
        if (!found.length) {
            tableEl.innerHTML = '<div class="prof-empty">Ничего не нашлось.</div>';
            pagerRender(pagerEl, 0, 0, () => {});
            return;
        }

        // Номер страницы правим здесь, а не при вводе в поиск: страниц могло
        // стать меньше — и седьмая, на которой человек стоял, показала бы пустоту
        // вместо найденного.
        const pages = Math.ceil(found.length / perPage);
        if (page > pages - 1) page = pages - 1;
        if (page < 0) page = 0;

        const rows = found.slice(page * perPage, (page + 1) * perPage);

        const body = rows.map(row => {
            const open = row.id === openId;

            return `<tr class="prof-row${open ? ' open' : ''}" data-id="${row.id}">`
                + `<td class="prof-state">${statusDot(row)}${warnBadge(row)}</td>`
                + '<td><span class="prof-who">'
                + `<img class="profile-face" src="${esc(row.photo || '')}" alt="" referrerpolicy="no-referrer"`
                + ' onerror="this.style.visibility=\'hidden\'">'
                + '<span class="prof-who-text">'
                // Имя режется многоточием — полное отдаём подсказкой.
                + `<span class="prof-name" title="${esc(row.name || row.login)}">${esc(row.name || row.login)}</span>`
                + `<span class="prof-login" title="${esc(row.login)}">${esc(row.login)}</span>`
                + '</span></span></td>'
                + `<td class="prof-work">${workPills(row) || '<span class="prof-no">—</span>'}</td>`
                + `<td>${row.auto_answer ? '<span class="prof-yes" title="отвечает агентом сам">✓</span>'
                                         : '<span class="prof-no" title="отвечают вручную">—</span>'}</td>`
                + `<td>${row.keep_online ? '<span class="prof-yes" title="автовход держит анкету в сети">✓</span>'
                                         : '<span class="prof-no" title="в сети не держим">—</span>'}</td>`
                + `<td class="prof-when" title="${esc(row.last_seen_at || 'входа ещё не было')}">`
                + `${esc(seenText(row.last_seen_at) || '—')}</td>`
                + noteCell(row)
                + `<td class="prof-act">${actCell(row)}</td>`
                + '</tr>';
        }).join('');

        tableEl.innerHTML =
            '<table class="prof-table"><thead><tr>'
            + '<th></th><th>Анкета</th><th>Работа</th><th>Автоответ</th><th>В сети</th>'
            + '<th>Вход</th><th>Пометка</th><th></th>'
            + '</tr></thead><tbody>' + body + '</tbody></table>';

        // Пейджер рисуем до замера: он занимает высоту, и мерить тело панели без
        // него значит насчитать на строку больше, чем влезет.
        pagerRender(pagerEl, pages, page, (pick) => {
            page = pick;
            tablePaint(0);
        });

        // Подвал **виден всегда**, даже когда страница одна. Общий `pagerRender`
        // при одной странице прячет его целиком — на «Анкетах» это верно, там под
        // списком идёт ещё и форма. Здесь под таблицей пусто, и пропавший подвал
        // читается как «пагинации нет вообще»: человек не понимает, показали ему
        // всё или только начало. Поэтому слева от кнопок — счёт строк, и он
        // отвечает на этот вопрос прямо.
        pagerEl.classList.add('open');
        const counted = document.createElement('span');
        counted.className = 'prof-count';
        counted.textContent = pages > 1
            ? `${found.length} анкет · страница ${page + 1} из ${pages}`
            : `${found.length} ${found.length === profiles.length ? '' : `из ${profiles.length} `}`
              + 'анкет — всё на одной странице';
        pagerEl.prepend(counted);

        // Число строк подгоняем всегда. Раньше подгонка отключалась у раскрытой
        // анкеты — карточка стояла прямо в таблице и была выше любой строки;
        // теперь настройки живут в своей колонке, и мешать замеру нечему.
        const fit = rowsFit();
        if (tries > 0 && fit !== perPage) {
            perPage = fit;
            tablePaint(tries - 1);
            return;
        }

        bindActions();
    }

    // В колонке пометки важнее ошибка: пометку человек писал сам и помнит, а
    // причина отказа — то, ради чего он в таблицу и смотрит.
    function noteCell(row) {
        const bad = row.status === 'error' && row.last_error;
        const text = bad ? row.last_error : (row.note || '');

        return `<td class="prof-note${bad ? ' bad' : ''}" title="${esc(text)}">${esc(text)}</td>`;
    }

    // ── Раскрытая карточка ───────────────────────────────────────────────────

    // Настройки выбранной анкеты — содержимое средней колонки. Формы две, потому
    // что и ручки две: учётка правится целиком (`PUT /{id}`), автоответ — отдельно
    // (`PUT /{id}/auto`), и он включается сразу, разбирая накопившееся. Слить их
    // в одну кнопку «Сохранить» значило бы запускать разбор писем при правке
    // пометки.
    function editForms(row) {
        const state = row.has_state
            ? `вход снят ${esc(seenText(row.last_seen_at) || 'когда-то')}`
            : 'входа ещё не было';

        return '<div class="edit-body">'

            + '<form class="prof-form" data-form="save">'
            + '<h4>Учётка</h4>'
            + '<div class="prof-line">'
            + field('Логин', `<input name="login" value="${esc(row.login)}" required`
                           + ' maxlength="190" spellcheck="false" autocomplete="off" size="26">')
            + field('Пароль', '<input name="password" type="password" placeholder="не менять"'
                            + ' maxlength="255" autocomplete="new-password" size="14">')
            + field('Роль', '<select name="role">'
                          + `<option value="lady"${row.role !== 'man' ? ' selected' : ''}>женская</option>`
                          + `<option value="man"${row.role === 'man' ? ' selected' : ''}>мужская</option>`
                          + '</select>')
            + field('Пометка', `<input name="note" value="${esc(row.note || '')}"`
                             + ' maxlength="255" size="24">')
            + '<button type="submit" class="dating-btn primary">Сохранить</button>'
            + '</div>'
            // Пустой пароль — «не трогать», а не «стереть»: форма его не
            // показывает, и по пустому полю не отличить одно от другого.
            + '<span class="prof-card-note">Пароль пустым — прежний остаётся.'
            + (row.has_password ? '' : ' Сейчас пароль не задан: войти под анкетой нечем.')
            + '</span>'
            + '</form>'

            + '<form class="prof-form" data-form="auto">'
            + '<h4>Автоответ</h4>'
            + '<div class="prof-line">'
            + '<label class="prof-check"><input type="checkbox" name="auto_answer"'
            + `${row.auto_answer ? ' checked' : ''}>отвечает сама</label>`
            + field('Кому отвечать', `<input name="auto_answer_only"`
                                   + ` value="${esc(row.auto_answer_only || '')}"`
                                   + ' maxlength="500" spellcheck="false" autocomplete="off"'
                                   + ' placeholder="всем" size="22">')
            + '<button type="submit" class="dating-btn primary">Сохранить</button>'
            + '</div>'
            // Каждый ответ стоит дважды — прогон LLM и платное сообщение на сайте,
            // — поэтому «всем» у анкеты с сотнями диалогов это рассылка.
            + '<span class="prof-card-note">Номера собеседниц через запятую;'
            + ' пусто — отвечать всем.</span>'
            + '</form>'

            + scheduleBlock(row)

            + '<div class="prof-form">'
            + '<h4>Действия</h4>'
            + '<div class="prof-line">'
            + `<button type="button" class="dating-btn login-btn"${row.has_password ? '' : ' disabled'}`
            + ` title="${row.has_password ? 'Сценарий входа в живом браузере — идёт минутами'
                                          : 'у учётки не задан пароль'}">Войти</button>`
            + `<button type="button" class="dating-btn off-btn"${row.has_state ? '' : ' disabled'}`
            + ' title="Выход на сайте, закрытие вкладок, снятие с автовхода">Отключить</button>'
            + '<button type="button" class="dating-btn danger del-btn"'
            + ' title="Удалить учётку вместе с перепиской и журналом">Удалить</button>'
            + '</div>'
            + `<span class="prof-card-note${row.status === 'error' ? ' bad' : ''}">`
            + `${esc(row.last_error || state)}</span>`
            + '</div>'

            + '</div>';
    }

    // Рисует колонку настроек. Отдельно от списка и **не по его таймеру**: список
    // освежается сам, а форма под руками перерисовываться не должна — набранное в
    // полях исчезло бы вместе с местом курсора.
    function editPaint() {
        const row = openRow();
        editWhoEl.textContent = row ? (row.name || row.login) : '';

        if (!row) {
            editEl.innerHTML = '<div class="edit-empty">Выберите анкету в списке — '
                             + 'здесь будут её настройки.</div>';
            return;
        }

        editEl.innerHTML = editForms(row);
        editBind(row);
    }

    function editBind(row) {
        editEl.querySelector('[data-form="save"]').addEventListener('submit', (e) => {
            e.preventDefault();
            profileSave(row, e.target);
        });
        editEl.querySelector('[data-form="auto"]').addEventListener('submit', (e) => {
            e.preventDefault();
            profileAuto(row, e.target);
        });
        scheduleBind(editEl, row);
        editEl.querySelector('.login-btn').addEventListener('click', () => profileLogin(row));
        editEl.querySelector('.off-btn').addEventListener('click', () => profileDisconnect(row));
        editEl.querySelector('.del-btn').addEventListener('click', () => profileDelete(row));
    }

    function field(label, control) {
        return `<label class="prof-field"><span>${esc(label)}</span>${control}</label>`;
    }

    // ── Расписание: вход и выход по времени суток ────────────────────────────

    // Записи анкеты, отсортированные по времени. Сортируем **при каждой отрисовке**,
    // а не при добавлении: время правят прямо в строке, и запись, заведённая
    // последней, может оказаться первой по времени. Порядок в списке — это и есть
    // порядок событий суток, иначе читать его невозможно.
    function scheduleRows(profileId) {
        const rows = scheduleDraft.get(profileId) || [];

        return [...rows].sort((a, b) => (a.from || '').localeCompare(b.from || ''));
    }

    // Расписание считается годным, когда в нём есть хотя бы один вход и хотя бы
    // один выход, и у всех записей проставлено время.
    //
    // **Выход обязателен, и это главное правило блока.** Анкета, которая вошла и
    // не вышла, остаётся в сети до тех пор, пока кто-нибудь не заметит: сайт её не
    // выкинет, а мы будем держать сокет и платить за присутствие. Поэтому сохранить
    // расписание без выхода нельзя вовсе — не предупреждением, а погашенной кнопкой.
    function scheduleCheck(rows) {
        if (!rows.length) return 'Расписания нет — анкета входит и выходит вручную';
        if (rows.some(row => !row.from)) return 'У каждой записи должно быть время';
        if (!rows.some(row => row.kind === 'in')) return 'Нужен хотя бы один вход';
        if (!rows.some(row => row.kind === 'out')) return 'Нужен выход: без него анкета останется в сети';

        const broken = rows.find(row => row.to && row.to <= row.from);
        if (broken) return `Интервал ${broken.from}–${broken.to}: конец раньше начала`;

        return '';
    }

    // Лента суток: полосы «анкета в сети» от входа до следующего выхода.
    //
    // Рисуем её потому, что расписание отвечает на вопрос «когда анкета работает»,
    // а список строк на него не отвечает — по нему это надо складывать в уме.
    // Заодно видна главная беда: вход, за которым не идёт выход, уходит вправо
    // штриховкой и не кончается.
    function scheduleDay(rows) {
        const minutes = (time) => {
            const [h, m] = String(time || '0:0').split(':').map(Number);
            return (h * 60 + m) / 14.4;  // сутки → проценты ширины
        };

        let html = '', open = null;
        for (const row of rows) {
            if (row.kind === 'in' && !open) { open = row; continue; }
            if (row.kind === 'out' && open) {
                const from = minutes(open.from), to = minutes(row.to || row.from);
                html += `<span class="sched-span${open.to ? ' fuzzy-start' : ''}`
                      + `${row.to ? ' fuzzy-end' : ''}" style="left:${from}%;`
                      + `width:${Math.max(to - from, 0.6)}%"></span>`;
                open = null;
            }
        }
        if (open) {
            const from = minutes(open.from);
            html += `<span class="sched-span open" style="left:${from}%;width:${100 - from}%"></span>`;
        }

        return `<div class="sched-day">${html}</div>`
             + '<div class="sched-hours"><span>00</span><span>06</span><span>12</span>'
             + '<span>18</span><span>24</span></div>';
    }

    // Правит черновик и перерисовывает карточку. Перерисовываем целиком, а не
    // одну строку: от правки времени меняется порядок списка и вся лента суток,
    // и подновлять их по кусочкам значило бы держать два способа рисовать одно.
    function scheduleEdit(profileId, change) {
        const rows = [...(scheduleDraft.get(profileId) || [])];
        change(rows);
        scheduleDraft.set(profileId, rows);
        // Перерисовываем **только настройки**: расписание в списке не показано, а
        // лишняя перерисовка таблицы под руками ничего не даёт и стоит мигания.
        editPaint();
    }

    function scheduleBind(card, row) {
        const form = card.querySelector('[data-form="schedule"]');
        if (!form) return;

        form.querySelector('.sched-add-in').addEventListener('click', () =>
            scheduleEdit(row.id, rows => rows.push({kind: 'in', from: '10:00', to: ''})));
        form.querySelector('.sched-add-out').addEventListener('click', () =>
            scheduleEdit(row.id, rows => rows.push({kind: 'out', from: '18:00', to: ''})));

        // Строки читаем в том же порядке, в каком их нарисовали (по времени), —
        // иначе `data-index` указывал бы не на ту запись.
        const shown = scheduleRows(row.id);
        form.querySelectorAll('.sched-row').forEach((line, index) => {
            const item = shown[index];

            line.querySelector('.sched-drop').addEventListener('click', () =>
                scheduleEdit(row.id, rows => rows.splice(rows.indexOf(item), 1)));

            // `change`, а не `input`: поле шлёт `input` на каждую цифру, и
            // перерисовка посреди набора отобрала бы фокус на втором знаке часа.
            // `change` приходит по уходу из поля — там и разбираем набранное.
            line.querySelectorAll('.sched-time').forEach(input => {
                input.addEventListener('change', () => scheduleEdit(row.id, rows => {
                    const found = rows[rows.indexOf(item)];
                    if (found) found[input.dataset.field] = timeParse(input.value);
                }));
            });
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Сервера у расписания пока нет — говорим об этом прямо, а не делаем
            // вид, что сохранили. Тихое «Сохранено» тут было бы обманом: человек
            // ушёл бы с уверенностью, что анкета теперь входит сама.
            showNotification('Расписание пока не сохраняется — ручка появится позже',
                             'info');
        });
    }

    // Поле времени — своё, а не `input[type=time]`. Нативное показывает время в
    // формате **языка браузера**: на английском Chrome это «01:00 PM» с
    // выпадающим AM/PM, и язык страницы (`lang="ru"`) на это не влияет. Расписание
    // читают сменами по всем суткам, и половина времён с пометкой «после полудня» —
    // лишний шаг мысли на каждой строке.
    //
    // Взамен — обычное текстовое поле, где четыре цифры превращаются в «12:00»
    // сами. Печатать так даже быстрее, чем через пикер: «1200» и готово.
    function timeInput(field, value, placeholder, title) {
        return `<input type="text" class="sched-time" data-field="${field}"`
             + ` value="${esc(value || '')}" placeholder="${esc(placeholder)}"`
             + ' inputmode="numeric" maxlength="5" spellcheck="false" autocomplete="off"'
             + (title ? ` title="${esc(title)}"` : '') + '>';
    }

    // Набранное — в «ЧЧ:ММ» или пусто. Пусто у второго поля законно («точно в
    // срок»), а у первого его поймает `scheduleCheck` и не даст сохранить.
    //
    // Понимаем и «1200», и «12:00», и «9:5»: человек печатает цифрами, а
    // двоеточие ставит не всегда. Всё, что не разбирается в осмысленное время,
    // становится пустотой — молча оставить «25:99» значило бы сохранить расписание,
    // которое никогда не сработает.
    function timeParse(text) {
        const raw = String(text || '').trim();
        if (!raw) return '';

        let hours, minutes;
        if (raw.includes(':')) {
            // Двоеточие человек поставил сам — оно и делит часы с минутами.
            // Разбирать такое по цифрам нельзя: «9:5» дало бы «95» и отлетело как
            // несуществующий час, хотя набрано было 09:05.
            [hours, minutes] = raw.split(':', 2);
        } else {
            const digits = raw.replace(/\D/g, '').slice(0, 4);
            if (!digits) return '';
            // Без двоеточия минуты — две последние цифры: «1200» → 12:00,
            // «930» → 9:30. Одна-две цифры — это часы: «9» → 09:00.
            hours = digits.length <= 2 ? digits : digits.slice(0, digits.length - 2);
            minutes = digits.length <= 2 ? '0' : digits.slice(-2);
        }

        const h = Number(hours), m = Number(minutes || 0);
        if (!/^\d+$/.test(String(hours).trim())) return '';
        if (minutes !== '' && !/^\d+$/.test(String(minutes).trim())) return '';
        if (!Number.isFinite(h) || !Number.isFinite(m) || h > 23 || m > 59) return '';

        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function scheduleBlock(row) {
        const rows = scheduleRows(row.id);
        const why = scheduleCheck(rows);

        const list = rows.length
            ? rows.map((item, index) =>
                `<div class="sched-row ${item.kind}" data-index="${index}">`
                + `<span class="sched-kind">${item.kind === 'in' ? 'Вход' : 'Выход'}</span>`
                + timeInput('from', item.from, 'чч:мм')
                + '<span class="sched-dash">—</span>'
                // Второе время необязательно: пусто — «точно в это время»,
                // заполнено — «в любой момент между». Подсказка в поле говорит это
                // прямо, иначе пустое поле читается как незаполненное.
                + timeInput('to', item.to, 'точно',
                            'не раньше первого времени; пусто — точно в срок')
                + '<button type="button" class="sched-drop" title="Убрать">×</button>'
                + '</div>').join('')
            : '<div class="sched-empty">Пока пусто. Добавьте вход и выход — '
              + 'анкета будет входить и выходить сама.</div>';

        return '<form class="prof-form sched" data-form="schedule">'
            + '<h4>Расписание</h4>'
            + `<div class="sched-list">${list}</div>`
            + '<div class="sched-add">'
            + '<button type="button" class="dating-btn sched-add-in">+ Вход</button>'
            + '<button type="button" class="dating-btn sched-add-out">+ Выход</button>'
            + '</div>'
            + (rows.length ? scheduleDay(rows) : '')
            + '<div class="prof-line" style="margin-top:8px">'
            + `<button type="submit" class="dating-btn primary"${why ? ' disabled' : ''}>`
            + 'Сохранить</button>'
            + `<span class="prof-card-note${why && rows.length ? ' sched-warn' : ''}">`
            + `${esc(why || 'Ежедневно, по времени сервера')}</span>`
            + '</div>'
            + '<span class="prof-card-note">Второе время — «в любой момент между»;'
            + ' пусто — точно в срок. Сохранение появится позже.</span>'
            + '</form>';
    }

    // Раскрывает анкету или закрывает всё. Она же выбранная — журнал справа
    // показывает её, поэтому смена раскрытой сразу тянет за собой журнал.
    function openSet(id) {
        openId = Number(id || 0);
        editPaint();
        logPaint();
        logLoad();
    }

    // ── Журнал выбранной анкеты ──────────────────────────────────────────────

    // Подпись и подсказка в пустой панели — отдельно от загрузки: они меняются
    // мгновенно по нажатию, а строки придут ответом сервера.
    function logPaint() {
        const row = openRow();
        logWhoEl.textContent = row ? (row.name || row.login) : (importLog.length ? 'импорт' : '');
        if (row) return;

        // Пока анкета не раскрыта, панель показывает ход последнего импорта: это
        // единственная работа страницы, у которой нет своей анкеты, а показать её
        // человеку надо — он только что нажал кнопку и ждёт, чем кончилось.
        logRender(logEl, importLog, 'выберите анкету — покажем её журнал');
    }

    // ── Импорт анкет с сайта ─────────────────────────────────────────────────

    // Кнопка активна только там, где импорт настроен. Признак спрашиваем у
    // сервера, а не выводим из списка сайтов: настройка живёт у соседа
    // (сценарий сайта), и страница про неё знать не может.
    async function importReadyLoad() {
        importBtn.disabled = true;
        importStateEl.className = 'import-state off';
        importStateEl.textContent = '';
        if (!siteId()) return;

        let state;
        try {
            state = (await getData(`${BASE}/api/dating/import/ready?site_id=${siteId()}`)).result || {};
        } catch (e) {
            importStateEl.textContent = 'Неактивный';
            importStateEl.title = 'состояние импорта не спросилось: ' + e.message;
            return;
        }

        importBtn.disabled = !state.ready || importBusy;
        importStateEl.className = 'import-state ' + (state.ready ? 'on' : 'off');
        importStateEl.textContent = state.ready ? 'Активный' : 'Неактивный';
        importStateEl.title = state.ready
            ? `импорт настроен: сценарий «${state.scenario}» у сайта в RhapsodyAi`
            : (state.why || '');
    }

    // Импорт идёт минутами: список читается одним прогоном, а карточка каждой
    // анкеты — своим. Поэтому кнопка занята всё это время, а ход показывается в
    // панели журнала — там же, где человек и так читает, что происходит.
    async function profileImport() {
        if (importBusy || !siteId()) return;

        importBusy = true;
        importBtn.disabled = true;
        importBtn.innerHTML = '<span class="dating-spin"></span>Импортирую…';
        importLog = [{level: 'info', created_at: '', text: 'Импорт пошёл: вход в панель сайта…'}];
        openSet(0);

        try {
            const res = (await postData(
                `${BASE}/api/dating/import/profile?site_id=${siteId()}`, {})).result || {};

            importLog = (res.log || []).map(text => ({level: 'info', created_at: '', text}));

            if (res.status === 'error') {
                importLog = [{level: 'fail', created_at: '', text: res.error}];
                showNotification('Импорт не прошёл: ' + res.error, 'error');
            } else {
                showNotification(`Импорт: заведено ${res.created}, обновлено ${res.updated}, `
                               + `без изменений ${res.same}`,
                                 res.created || res.updated ? 'success' : 'info');
            }
        } catch (e) {
            importLog = [{level: 'fail', created_at: '', text: 'Импорт не прошёл: ' + e.message}];
            showNotification('Импорт не прошёл: ' + e.message, 'error');
        } finally {
            importBusy = false;
            importBtn.innerHTML = 'Импортировать профили';
            await importReadyLoad();
            await profilesLoad();
            logPaint();
        }
    }

    async function logLoad() {
        if (!openId) return;

        // Та же гонка, что и у списка, и тот же приём: журнал ходит своим кругом,
        // и ответ по уже закрытой анкете может прийти позже ответа по вновь
        // раскрытой — без сверки он перепишет журнал не той анкеты.
        const requestId = openId;
        let rows;
        try {
            rows = (await getData(`${BASE}/api/dating/profile/${requestId}/log`)).result || [];
        } catch (e) {
            if (openId !== requestId) return;
            logRender(logEl, [], 'журнал не пришёл: ' + e.message);
            return;
        }
        if (openId !== requestId) return;

        logRender(logEl, rows, 'записей нет — нажмите «Пинг»');
    }

    // ── Действия ─────────────────────────────────────────────────────────────

    function bindActions() {
        // Нажатие по строке **выбирает** анкету: подсвечивает её и наполняет две
        // соседние колонки — настройки и журнал. Повторное нажатие снимает выбор.
        // Кнопка в строке из этого исключена: она и так делает своё дело.
        tableEl.querySelectorAll('tr.prof-row').forEach(tr => {
            tr.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                const id = Number(tr.dataset.id);
                openSet(id === openId ? 0 : id);
                tablePaint(0);
            });
        });

        tableEl.querySelectorAll('.ping-btn').forEach(btn => {
            const row = rowOf(btn);
            if (row) btn.addEventListener('click', () => profilePing(row));
        });
    }

    function rowOf(el) {
        return profiles.find(r => r.id === Number(el.closest('tr').dataset.id)) || null;
    }

    // Долгое действие: помечаем анкету занятой, чтобы перерисовка не вернула
    // кнопке прежний вид и её не нажали второй раз. Журнал тикает всё это время —
    // ход входа виден строками, а не одной крутилкой.
    async function longRun(row, run) {
        busy.add(row.id);
        tablePaint(0);
        const ticker = setInterval(logLoad, 3000);

        try {
            return await run();
        } finally {
            clearInterval(ticker);
            busy.delete(row.id);
            await profilesLoad();
            await logLoad();
        }
    }

    // «Пинг» — дешёвый опрос по сохранённым cookie, без браузера: секунды вместо
    // минут. Он отвечает на вопрос «жив ли вход», но не чинит его: не признал
    // сайт — дальше «Войти».
    async function profilePing(row) {
        await longRun(row, async () => {
            try {
                const res = (await postData(`${BASE}/api/dating/profile/${row.id}/ping`, {})).result || {};
                showNotification(res.status === 'online' ? `В сети, ${res.ms} мс`
                                                         : `Не в сети: ${res.error || res.status}`,
                                 res.status === 'online' ? 'success' : 'error');
            } catch (e) {
                showNotification('Пинг не прошёл: ' + e.message, 'error');
            }
        });
    }

    async function profileSave(row, form) {
        const data = new FormData(form);
        try {
            await putData(`${BASE}/api/dating/profile/${row.id}`, {
                site_id: row.site_id,
                login: String(data.get('login') || '').trim(),
                password: String(data.get('password') || ''),
                note: String(data.get('note') || '').trim(),
                role: String(data.get('role') || 'lady'),
            });
            showNotification('Учётка сохранена', 'success');
        } catch (e) {
            showNotification('Не сохранилось: ' + e.message, 'error');
            return;
        }

        await profilesLoad();
    }

    async function profileAuto(row, form) {
        const data = new FormData(form);
        try {
            await putData(`${BASE}/api/dating/profile/${row.id}/auto`, {
                auto_answer: data.get('auto_answer') !== null,
                auto_answer_only: String(data.get('auto_answer_only') || '').trim(),
            });
            showNotification('Автоответ сохранён', 'success');
        } catch (e) {
            showNotification('Не сохранилось: ' + e.message, 'error');
            return;
        }

        await profilesLoad();
        await logLoad();
    }

    // Настоящий вход: сценарий проходит форму в живом браузере, снимает состояние
    // и спрашивает сайт, признал ли он вход. Идёт минутами — сайт единственный,
    // кто знает ответ, и торопить его нечем.
    async function profileLogin(row) {
        await longRun(row, async () => {
            try {
                const res = (await postData(`${BASE}/api/dating/profile/${row.id}/login`, {})).result || {};
                showNotification(res.status === 'error' ? `Вход не прошёл: ${res.error}`
                                                        : `Вход выполнен: ${res.scenario}`,
                                 res.status === 'error' ? 'error' : 'success');
            } catch (e) {
                showNotification('Войти не вышло: ' + e.message, 'error');
            }
        });
    }

    async function profileDisconnect(row) {
        if (!confirm(`Отключить «${row.name || row.login}»? Выйдем с сайта, закроем вкладки `
                   + 'и снимем анкету с автовхода. Переписка и журнал останутся.')) return;

        await longRun(row, async () => {
            try {
                const res = (await postData(`${BASE}/api/dating/profile/${row.id}/disconnect`, {})).result || {};
                showNotification(res.logout ? 'Отключено, выход на сайте выполнен'
                                            : 'Отключено; выход на сайте не подтверждён',
                                 res.logout ? 'success' : 'info');
            } catch (e) {
                showNotification('Отключить не вышло: ' + e.message, 'error');
            }
        });
    }

    async function profileDelete(row) {
        if (!confirm(`Удалить «${row.name || row.login}»? Вместе с учёткой уйдут её `
                   + 'переписка, собеседницы и журнал. Отменить будет нечем.')) return;

        try {
            await deleteData(`${BASE}/api/dating/profile/${row.id}`);
            showNotification('Учётка удалена', 'success');
        } catch (e) {
            showNotification('Удалить не вышло: ' + e.message, 'error');
            return;
        }

        // Закрываем до перезагрузки: строки больше нет, и раскрытой ей быть негде.
        openSet(0);
        await profilesLoad();
    }

    // ── Обвязка страницы ─────────────────────────────────────────────────────

    siteEl.addEventListener('change', () => {
        localStorage.setItem(DATING_SITE_KEY, siteEl.value);
        // Страницу сбрасываем: седьмая страница чужих учёток ничего не значит.
        // Раскрытую — тоже: её анкета осталась на прежнем сайте.
        page = 0;
        openSet(0);
        // Ход прошлого импорта относится к прежнему сайту — уносим вместе с ним.
        importLog = [];
        empty('Гружу…');
        importReadyLoad();
        profilesLoad();
    });
    importBtn.addEventListener('click', profileImport);
    // Поиск режет уже пришедший список, а не ходит на сервер: список приходит
    // целиком, и запрос на каждую букву ничего не уточнит. Каждая буква
    // возвращает на первую страницу — найденное показывают с начала.
    findEl.addEventListener('input', () => {
        page = 0;
        tablePaint();
    });

    // Окно изменили — в панель влезает другое число строк. Пересчёт с задержкой:
    // тянут рамку окна непрерывно, и перерисовывать таблицу на каждый пиксель
    // незачем.
    let resizeTimer = 0;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (profiles.length) tablePaint(); }, 150);
    });

    // Список освежается своим кругом **и при выбранной анкете тоже**. Раньше круг
    // при ней замирал: формы стояли прямо в таблице, и перерисовка стирала бы
    // набранное вместе с местом курсора. Теперь формы в своей колонке, таблица их
    // не касается — и список может показывать правду всё время.
    //
    // Долгое действие круг по-прежнему пережидает: перерисовка посреди входа
    // вернула бы кнопке прежний вид, и её нажали бы второй раз.
    setInterval(() => {
        if (busy.size || document.hidden) return;
        profilesLoad();
    }, RELOAD_MS);

    setInterval(() => {
        if (busy.size || !openId || document.hidden) return;
        logLoad();
    }, LOG_MS);

    hintEl.textContent = 'состояние обновляется само';
    empty('Гружу…');
    editPaint();
    logPaint();
    sitesLoad();
</script>
{% endblock %}
