{% extends "base.html" %}

{% block title %}Профили | DatingAi{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ base }}/static/css/dating_page.css">
    <style>
        /* Обойма, шапка, панель, журнал, чат и значки учётки — общие с «Анкетами»
           (`dating_page.css`). Здесь только раскладка этой страницы: шапка во всю
           ширину, под ней две колонки — список анкет и работа с выбранной.

           Правая колонка одна на четыре занятия (чат, письма, ивенты, настройки),
           и делит их вкладками, а не колонками: колонок под них не хватило бы ни
           на одном экране, а нужны они по одной за раз — человек либо читает
           переписку, либо правит настройки.

           Ширина правой — 62%: в ней живёт переписка, и она же самая длинная по
           содержимому. Разделителей нет — в отличие от «Анкет», где колонки
           тянут: тянуть тут нечего, ширины подобраны. */
        .dating-page {
            /* Ширину списка и высоту журнала человек ставит под себя один раз —
               переменными, а не числами: их двигают разделители, и они же
               запоминаются (`localStorage`). Начальные значения — та же раскладка,
               что была до появления разделителей. */
            --col: 38%;
            --log: 200px;
            /* Ширина колонок собеседников. По 150 пикселей — под столбик «лицо,
               имя, возраст»; тянутся разделителями, как и всё остальное на этой
               странице. */
            --fav: 150px;
            --online: 150px;
            /* Высота переписки в первой колонке. Треть — столько, чтобы читались
               последние реплики; список диалогов над ней важнее, из него выбирают. */
            --talk: 180px;
            grid-template-columns: var(--col) 6px minmax(0, 1fr);
            grid-template-rows: auto minmax(0, 1fr);
        }
        .dating-head { grid-column: 1 / -1; }
        .prof-pane { grid-column: 1; grid-row: 2; }
        .work-pane { grid-column: 3; grid-row: 2; }

        /* Разделители. Видны **всегда**, а не только под курсором: невидимую
           полосу не тянут — про неё не знают. На «Анкетах» она прозрачная, и это
           работало, пока разделитель был один и стоял между явно разными панелями;
           здесь их четыре, и половина — внутри одной панели, где границы и так
           нет.
    
           Заметность соразмерна: тонкая линия в покое, цвет под курсором и при
           перетаскивании. Спорить с содержимым за внимание ей всё-таки не нужно. */
        .split { border-radius: 3px; background: #eef2f7; transition: background .12s ease; }
        .split:hover, .split.drag { background: #a5b4fc; }
        .split-col { grid-column: 2; grid-row: 2; cursor: col-resize; }
        .split-row { cursor: row-resize; height: 6px; flex: 0 0 auto; margin: 3px 0; }

        /* Точки-захват: три штриха посередине полосы. Без них тонкая линия
           читается как рамка, а не как то, что можно взять и потянуть. */
        .split-row::after, .split-people::after {
            content: ''; display: block; border-radius: 2px; background: #cbd5e1;
        }
        .split-row::after { width: 26px; height: 2px; margin: 2px auto; }
        .split-people::after { width: 2px; height: 26px; margin: auto; }
        .split-people { display: flex; }

        /* ---------- Вкладки правой колонки ---------- */

        /* Вкладки живут в шапке панели, а не отдельной строкой над ней: шапка и
           так пустует, а лишняя строка съела бы высоту у переписки. */
        .work-tabs { display: flex; gap: 2px; margin-right: auto; }
        .work-tab {
            padding: 3px 10px; border: none; border-radius: 6px; background: none;
            font-family: inherit; font-size: 12px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
        }
        .work-tab:hover { color: #4338ca; }
        .work-tab.on { background: #eef2ff; color: #4338ca; }

        /* Кого сейчас правим — в той же строке, справа: вкладки меняются, анкета
           нет, и подпись не должна прыгать вместе с ними. */
        #workWho { min-width: 0; color: #94a3b8; font-weight: 400;
                   text-transform: none; letter-spacing: normal;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Вкладка без содержимого. Отдельным классом, а не пустой панелью: пустая
           белая карточка читается как «не загрузилось». */
        .work-soon { padding: 24px 12px; text-align: center; color: #9ca3af; font-size: 13px; }

        /* Содержимое вкладки прокручивается: у настроек четыре блока, у чата
           сотни диалогов, и на невысоком экране не влезает ни то, ни другое.
           Список слева при этом остаётся без прокрутки — у него своё правило
           (пейджер вместо неё), и смешивать их нельзя. */
        .work-pane .pane-body { overflow-y: auto; }
        .edit-empty { padding: 20px 12px; color: #9ca3af; font-size: 12px; text-align: center; }

        /* Блоки настроек идут один под другим, и без границы «Учётка» и
           «Автоответ» читаются как одна длинная форма: у обеих поля ввода и
           кнопка «Сохранить», а сохраняют они разное. Разделяем линией и
           воздухом — заголовок блока при этом остаётся его единственной меткой. */
        .edit-body { display: flex; flex-direction: column; }
        .edit-body > * + * {
            margin-top: 16px; padding-top: 16px; border-top: 1px solid #eef2f7;
        }

        /* Заголовок с засечкой слева: он и так набран капителью, но в столбце из
           четырёх блоков глазу нужна точка, за которую цепляться при прокрутке. */
        .edit-body h4 {
            display: flex; align-items: center; gap: 6px;
        }
        .edit-body h4::before {
            content: ''; width: 3px; height: 11px; border-radius: 2px;
            background: #c7d2fe; flex: 0 0 auto;
        }

        /* Журнал под чатом, а не отдельной колонкой: он про то же, что и
           переписка, — что происходило с анкетой.

           Высоту тянут разделителем: сколько её нужно, зависит от работы. Разбирая
           неудачный вход, читают десяток строк журнала и переписка не нужна вовсе;
           отвечая собеседницам — наоборот. Поэтому вкладка «Чат» — своя маленькая
           сетка на две части, а не один прокручиваемый столбец. */
        .chat-wrap {
            display: flex; flex-direction: column; height: 100%; min-height: 0;
        }
        .chat-main { flex: 1 1 auto; min-height: 0; display: flex; }
        .chat-log { height: var(--log); min-height: 0; display: flex; flex-direction: column; }
        .chat-log-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .chat-log-head {
            font-size: 11px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em;
            margin-bottom: 4px; flex: 0 0 auto;
        }

        /* Тело панели во вкладке «Чат» не прокручивается само: прокрутка внутри,
           у двух частей по отдельности. Иначе тянуть разделитель было бы нечего —
           обе части ехали бы одной лентой. */
        .work-pane .pane-body.chat { overflow: hidden; padding-bottom: 0; }

        /* ---------- Колонки собеседников с сайта ---------- */

        /* Переписка и две колонки в ряд: избранные и кто в сети. По 150 пикселей
           каждая — ширина под столбик «фото, имя, возраст», не больше. Списки
           читают глазами сверху вниз, а работают всё равно в переписке слева. */
        .chat-cols { display: flex; gap: 8px; min-height: 0; flex: 1 1 auto; }

        /* Первая колонка — два ряда: список диалогов и переписка с выбранным.
           Раньше переписка раскрывалась внутри строки списка, и собеседник,
           выбранный в колонке «Все онлайн», показать её не мог вовсе. Теперь
           разговор один на все три колонки, а где его выбрали — неважно. */
        .chat-talk { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
        /* Шапка ряда диалогов: подпись, счёт и кнопка загрузки. Кнопка здесь, а
           не в шапке панели: она про этот ряд, и на других вкладках ей делать
           нечего. */
        .chat-dialogs-head {
            display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
            font-size: 10px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em; padding-bottom: 4px;
        }
        .chat-dialogs-count { color: #4338ca; }
        .chat-dialogs-btn {
            margin-left: auto; font-size: 11px; padding: 2px 8px;
            text-transform: none; letter-spacing: normal; font-weight: 400;
        }

        .chat-dialogs { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

        /* Значок «с ним есть переписка» в колонках собеседников. Иконкой, а не
           словом: в колонке 150 пикселей слово заняло бы строку целиком, а
           отличить «говорили» от «не говорили» надо одним взглядом по столбцу. */
        /* Прижат к правому краю: место у левого занято точкой «в сети», и без
           `auto` значок липнул бы к имени переменной длины — столбца из них не
           получилось бы. */
        .person-talk {
            flex: 0 0 auto; margin-left: auto;
            font-size: 10px; line-height: 1; opacity: .85;
        }
        .chat-msgs {
            height: var(--talk); min-height: 0; display: flex; flex-direction: column;
        }

        .talk-head {
            display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
            font-size: 11px; font-weight: 700; color: #334155; padding-bottom: 4px;
        }
        .talk-id { color: #cbd5e1; font-weight: 400; font-size: 10px; }
        .talk-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .talk-empty {
            flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
            color: #cbd5e1; font-size: 11px; text-align: center; padding: 8px;
        }

        /* Ширина у каждой колонки своя переменная: избранных бывает трое, а в
           сети двадцать, и подгонять их приходится по отдельности. Границы слева
           нет — её роль взял разделитель, который стоит на том же месте. */
        .people-col { min-width: 0; display: flex; flex-direction: column; }
        .people-col[data-kind=favorite] { flex: 0 0 var(--fav); }
        .people-col[data-kind=online] { flex: 0 0 var(--online); }

        /* Разделитель колонок собеседников: тот же вид и то же поведение, что у
           остальных на странице, только уже — между узкими колонками широкая
           полоса съела бы половину содержимого. */
        .split-people { flex: 0 0 5px; cursor: col-resize; }
        .people-head {
            display: flex; align-items: center; gap: 4px; flex: 0 0 auto;
            font-size: 10px; font-weight: 700; color: #94a3b8;
            text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
        }
        /* Кнопка обновления — иконкой: в колонке 150 пикселей слово «обновить»
           отняло бы место у заголовка. Заходят за ней редко: список освежается
           сам, пока человек смотрит на анкету. */
        .people-reload {
            margin-left: auto; border: none; background: none; cursor: pointer;
            color: #cbd5e1; font-size: 12px; line-height: 1; padding: 0 2px;
        }
        .people-reload:hover { color: #4338ca; }
        .people-reload:disabled { opacity: .4; cursor: default; }

        /* Счёт в заголовке: сколько человек в списке. Без него «Favorite» не
           говорит, семнадцать их или ни одного, пока не вглядишься в столбик. */
        .people-count { color: #4338ca; font-weight: 700; }

        /* Когда список снят. Отдельной строкой под заголовком, а не рядом со
           счётом: в 150 пикселях «FAVORITE 18 ⟳ 12:15» не помещается, и время
           выдавило бы кнопку обновления за край.

           Мелко и бледно намеренно — это сноска к списку, а не его часть; но
           поднимается до красного, когда список устарел: тогда это уже не сноска,
           а предупреждение. */
        .people-when {
            flex: 0 0 auto; font-size: 9px; color: #cbd5e1; margin-bottom: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .people-when .bad { color: #dc2626; }

        .people-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

        /* Строка человека: лицо, под ним имя с возрастом. Не в одну строку —
           в 150 пикселях имя и возраст рядом с фото читались бы по одной букве. */
        .person {
            display: flex; align-items: center; gap: 6px;
            padding: 3px 2px; border-bottom: 1px solid #f8fafc;
        }
        .person-face {
            position: relative; flex: 0 0 auto; width: 26px; height: 26px;
            border-radius: 6px; background: #e2e8f0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: #64748b; font-size: 11px; font-weight: 700;
        }
        /* Место под лицо занято всегда: фотографию сайт отдаёт лениво, и у части
           карточек её нет вовсе. Под картинкой лежит буква имени — она и видна. */
        .person-face img { position: absolute; inset: 0; width: 100%; height: 100%;
                           border-radius: 6px; object-fit: cover; }

        .person-text { min-width: 0; display: flex; flex-direction: column; }
        .person-name { font-size: 11px; color: #334155;
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .person-meta { font-size: 10px; color: #94a3b8; }

        /* Точка «в сети» у человека — та же, что у анкеты в списке, и по той же
           причине: одно состояние должно выглядеть одинаково на всей странице.

           Стоит она первой в строке, до лица: так точки выстраиваются в ровный
           столбец у левого края и читаются сверху вниз одним движением глаза.
           Справа их край плясал бы вслед за длиной имени. */
        .person-dot {
            flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
            background: #cbd5e1;
        }
        .person-dot.online { background: #22c55e; }

        /* Выбранный собеседник. Тот же вид, что у выбранной строки диалога: выбор
           один на все три колонки, и выглядеть он должен одинаково, где бы его ни
           сделали. */
        .person { cursor: pointer; }
        .person:hover { background: #f8fafc; }
        .person.open { background: #eef2ff; }
        .person.open .person-name { color: #3730a3; font-weight: 600; }

        .people-empty { padding: 8px 2px; font-size: 10px; color: #cbd5e1; text-align: center; }
        .people-empty.bad { color: #b91c1c; }

        /* Вертикальной прокрутки нет намеренно: сколько строк влезло — столько на
           странице, остальные за пейджером. Прокрутка вместе с пейджером это две
           навигации сразу, и обе неполные.

           Вбок прокрутка остаётся: узкое окно сжимает колонки, и лучше отъехать
           вбок, чем читать имя по одной букве. Поля сняты, чтобы таблица шла от
           края до края. */
        .prof-body { padding: 0; overflow-x: auto; overflow-y: hidden; }

        .prof-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        /* Липкой шапке взяться неоткуда: вертикальной прокрутки у тела нет. */
        .prof-table th {
            padding: 7px 12px; text-align: left; white-space: nowrap;
            background: #f8fafc; border-bottom: 1px solid #e5e7eb;
            font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .prof-table td { padding: 6px 12px; border-bottom: 1px solid #f1f5f9; color: #374151; }
        .prof-table tr:last-child td { border-bottom: none; }
        .prof-table tbody tr.prof-row { cursor: pointer; }
        .prof-table tbody tr.prof-row:hover td { background: #f8fafc; }


        /* Первая колонка — сразу содержательная: пустой под подсветку больше нет.
           Отступ слева обязателен: полоса выбранной строки идёт по краю ячейки, и
           без него фотография прижималась бы к ней вплотную.

           Селектор с `.prof-table`, а не просто `.prof-first`: базовое правило
           ячейки (`.prof-table td`) весит больше одного класса, и короткий
           селектор проиграл бы ему — пришлось бы ставить `!important`, то есть
           расписаться в том, что специфичность посчитана неверно. */
        .prof-table .prof-first { padding-left: 14px; }

        /* Выбранная строка. Полоса слева, а не только фон: фон у строки под
           курсором почти такой же, и без полосы выбранное теряется ровно в тот
           момент, когда мышь идёт к настройкам. */
        .prof-table tbody tr.prof-row.open td { background: #eef2ff; }
        .prof-table tbody tr.prof-row.open td:first-child {
            box-shadow: inset 3px 0 0 #4f46e5;
        }

        /* Имя и тревога в одной строке: значок относится к анкете, и место ему
           рядом с её именем, а не в своей колонке. `min-width: 0` — чтобы
           многоточие резало имя, а не выдавливало значок за край. */
        .prof-name-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
        .prof-name-row .prof-name { min-width: 0; }

        /* Кто это: лицо, имя, под ним логин. Ширину не задаём — колонка забирает
           остаток строки, и режется многоточием именно она, а не бейджи и время. */
        .prof-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .prof-who-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .prof-name { font-weight: 600; color: #111827; font-size: 13px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prof-login { color: #6b7280; font-size: 11px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Колонка «В сети»: в ней одна точка, и ширины ей нужно ровно под неё.
           По центру — столбик точек читают сверху вниз, и разнобой по краю мешал
           бы искать красные. */
        .prof-online { width: 1%; text-align: center; }
        .prof-online .dot { display: inline-block; }
        /* Ответ «нет» пишем прочерком, а не пустотой: пустая ячейка читается как
           «не успело загрузиться». */
        .prof-no { color: #cbd5e1; }
        .prof-yes { color: #15803d; font-weight: 700; }

        /* Колонка «ai-ответ»: ширина по содержимому, подпись не переносится.
           Курсор-указатель на всей метке — нажимают и по слову, а не только по
           квадратику. */
        .prof-ai { width: 1%; white-space: nowrap; }
        .prof-ai .prof-check { font-size: 11px; color: #94a3b8; }
        .prof-ai input { cursor: pointer; }

        /* Включённый — зелёный, и **вся метка целиком**, а не только квадратик:
           в столбце из пятнадцати строк цвет подписи виден одним взглядом, а
           галочка размером в девять пикселей — нет. Выключенная метка серая, и
           разница между строками читается как разница состояний.

           `accent-color` вместо своей отрисовки: браузер сам красит галочку и
           сохраняет ей родное поведение — фокус, клавиатуру, `prefers-*`. Своя
           отрисовка потребовала бы `appearance: none` и восстановления всего
           этого руками. */
        .prof-ai input { accent-color: #16a34a; }
        .prof-ai .prof-check:has(input:checked) { color: #166534; font-weight: 600; }

        /* Запасной путь для браузеров без `:has()` — там метка останется серой, но
           галочка всё равно зелёная, и состояние не теряется. */
        @supports not selector(:has(*)) {
            .prof-ai .prof-check { color: #64748b; }
        }

        .prof-act { width: 1%; white-space: nowrap; text-align: right; }

        .prof-empty { padding: 24px 12px; text-align: center; color: #9ca3af; font-size: 13px; }

        /* ---------- Раскрытая карточка ---------- */

        .prof-form { display: flex; flex-direction: column; gap: 7px; }
        .prof-form h4 {
            margin: 0; font-size: 10px; font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .prof-line { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }

        .prof-field { display: flex; flex-direction: column; gap: 2px; }
        .prof-field > span { font-size: 10px; color: #94a3b8; }
        .prof-field input, .prof-field select {
            padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px;
            font-family: inherit; font-size: 12px; color: #374151; background: #fff;
        }
        .prof-field input:focus, .prof-field select:focus { outline: none; border-color: #c7d2fe; }

        /* Галка читается вместе с подписью, поэтому подпись и есть кнопка. */
        .prof-check { display: flex; align-items: center; gap: 5px; font-size: 12px;
                      color: #374151; cursor: pointer; user-select: none; }

        .prof-card-note { font-size: 11px; color: #94a3b8; }
        .prof-card-note.bad { color: #b91c1c; }

        /* Состояние импорта рядом с кнопкой. Словом, а не только цветом кнопки:
           погашенная кнопка говорит «нельзя», но не говорит почему, а причина у
           неё бывает разная — сайт без сценария или недоступный сосед. */
        .import-state { font-size: 11px; font-weight: 600; white-space: nowrap; }
        .import-state.on { color: #166534; }
        .import-state.off { color: #94a3b8; }

        /* Счёт строк в подвале таблицы: слева, кнопки страниц по центру. Он же
           держит подвал непустым там, где страница одна. */
        .prof-pane .pane-foot { justify-content: flex-start; }
        .prof-count { font-size: 11px; color: #94a3b8; margin-right: auto; }

        /* ---------- Расписание входов и выходов ---------- */

        /* Ширину задаёт колонка настроек — своей у блока нет. Она подобрана как
           раз под строку расписания: метка, два времени и удаление в один ряд. */

        .sched-list { display: flex; flex-direction: column; gap: 4px; }

        /* Строка расписания. Слева цветная планка — по ней тип читается раньше,
           чем слово: вход и выход чередуются, и глаз ищет ритм, а не текст. */
        .sched-row {
            display: flex; flex-direction: column; gap: 2px;
            padding: 5px 8px 6px 6px; border-radius: 6px;
            background: #f8fafc; border-left: 3px solid transparent;
        }
        .sched-head { display: flex; align-items: center; gap: 7px; }
        .sched-row { border-left-color: #818cf8; }

        /* Смена, налезающая на предыдущую. Красим её саму, а не только пишем под
           кнопкой: в расписании из шести смен пересечение без подсветки надо ещё
           найти. */
        .sched-row.clash { background: #fef2f2; border-left-color: #dc2626; }
        .sched-row.clash .sched-kind { color: #b91c1c; }

        .sched-kind { font-size: 11px; font-weight: 700; color: #64748b;
                      width: 62px; flex: 0 0 auto; }

        /* Время — подписью, а не полем ввода: задают его ползунком ниже. Шрифт
           моноширинный, столбик времён читают сверху вниз, и цифры должны стоять
           друг под другом. */
        .sched-time {
            margin-left: auto; font-family: ui-monospace, Menlo, monospace;
            font-size: 12px; color: #374151; white-space: nowrap;
        }
        /* Стрелка между входом и выходом — бледнее самих времён: читают времена,
           а она лишь показывает направление. */
        .sched-time .exact { color: #cbd5e1; }

        /* ---------- Двойной ползунок суток ---------- */

        /* Вся ширина — сутки, две ручки сужают её до интервала. Собран из двух
           нативных `input[type=range]`, наложенных друг на друга: у двойного
           ползунка нет своего элемента, а свой на указателях отнял бы клавиатуру
           и фокус — по стрелкам такой не подвинешь.

           Поверх ползунков не должно быть ничего, что ловит указатель, поэтому
           дорожка и заливка нарисованы под ними и `pointer-events` не берут. */
        .sched-range { position: relative; height: 18px; margin-top: 2px; }

        .sched-track, .sched-fill {
            position: absolute; top: 7px; height: 4px; border-radius: 2px;
            pointer-events: none;
        }
        .sched-track { left: 0; right: 0; background: #e2e8f0; }
        .sched-fill { background: #818cf8; }


        .sched-range input[type=range] {
            position: absolute; left: 0; width: 100%; height: 18px; margin: 0;
            -webkit-appearance: none; appearance: none;
            background: none; pointer-events: none;
        }
        /* Ловит указатель только сама ручка: иначе верхний ползунок накрыл бы
           нижний целиком, и вторую ручку было бы не взять. */
        .sched-range input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; pointer-events: auto; cursor: grab;
            width: 13px; height: 13px; border-radius: 50%;
            background: #fff; border: 2px solid #4f46e5;
        }
        .sched-range input[type=range]::-moz-range-thumb {
            pointer-events: auto; cursor: grab;
            width: 13px; height: 13px; border-radius: 50%;
            background: #fff; border: 2px solid #4f46e5;
        }
        .sched-range input[type=range]:focus-visible::-webkit-slider-thumb {
            box-shadow: 0 0 0 3px #c7d2fe;
        }
        /* Пересекающиеся смены — красным и на ручках: строка и лента говорят об
           одном, и глаз не должен искать, к какой из них относится сообщение. */
        .sched-row.clash .sched-range input[type=range]::-webkit-slider-thumb { border-color: #dc2626; }
        .sched-row.clash .sched-range input[type=range]::-moz-range-thumb { border-color: #dc2626; }
        .sched-row.clash .sched-fill { background: #fca5a5; }

        .sched-drop {
            margin-left: auto; border: none; background: none; cursor: pointer;
            color: #cbd5e1; font-size: 15px; line-height: 1; padding: 0 2px;
        }
        .sched-drop:hover { color: #b91c1c; }

        .sched-add { display: flex; gap: 6px; margin-top: 7px; }
        .sched-add-btn { font-size: 11px; padding: 3px 9px; }

        /* Лента суток — то единственное, ради чего этот блок выглядит не как
           список полей. Расписание отвечает на вопрос «когда анкета в сети», и
           ответ на него — полоса, а не строки: по ней сразу видно и дыры между
           сменами, и главную беду — вход, за которым не идёт выход. */
        .sched-day {
            position: relative; height: 16px; margin-top: 9px;
            border-radius: 4px; background: #f1f5f9; overflow: hidden;
        }
        /* Полоса смены. «Незакрытой» полосы больше не бывает: выход есть у каждой
           записи по устройству — смена и есть пара «вход-выход». */
        .sched-span { position: absolute; top: 0; bottom: 0; background: #a5b4fc; }
        .sched-span.clash { background: #fca5a5; }

        .sched-hours {
            display: flex; justify-content: space-between;
            font-size: 9px; color: #cbd5e1; margin-top: 2px;
        }

        .sched-empty { font-size: 11px; color: #94a3b8; padding: 6px 0; }
        .sched-warn { color: #b91c1c; }
    </style>
{% endblock %}

{% block content %}
<div class="dating-page">

    <div class="dating-head">
        <h1>🌐 Сайт</h1>
        <select id="siteSelect" title="Сайт, на котором заведены анкеты"></select>
        <button type="button" class="dating-btn" id="importBtn" disabled>Импортировать профили</button>
        <span class="import-state" id="importState"></span>
        <span class="dating-hint" id="hint"></span>
    </div>

    <div class="pane prof-pane">
        <div class="pane-head">
            Профили <span id="profilesN"></span>
            <input type="search" id="profileFind" class="pane-find" placeholder="имя или почта"
                   spellcheck="false" autocomplete="off"
                   title="Ищет и по имени, и по почте — одним полем, любой кусок строки">
        </div>
        <div class="pane-body prof-body" id="table"></div>
        <div class="pane-foot" id="profilesPager"></div>
    </div>

    <div class="split split-col" id="splitCol" title="Потяните, чтобы изменить ширину"></div>

    <div class="pane work-pane">
        <div class="pane-head">
            <div class="work-tabs" id="workTabs">
                <button type="button" class="work-tab on" data-tab="chat">Чат</button>
                <button type="button" class="work-tab" data-tab="mail">Письма</button>
                <button type="button" class="work-tab" data-tab="event">Ивенты</button>
                <button type="button" class="work-tab" data-tab="setup">Настройки</button>
            </div>
            <span id="workWho"></span>
        </div>
        <div class="pane-body" id="work"></div>
        <div class="pane-foot" id="contactsPager"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import {getData, postData, putData, deleteData} from '{{ base }}/static/js/api.js';
    import {showNotification} from '{{ base }}/static/js/notification.js';
    import {esc, onlineDot, warnBadge, seenText, pagerRender, logRender}
        from '{{ base }}/static/js/dating_view.js';
    // Загрузка селекта общая на весь раздел: ключ выбора у страниц один, и
    // разъехавшиеся копии писали бы в него разное.
    import {DATING_SITE_KEY, datingSiteFill} from '{{ base }}/static/js/dating_site.js';

    const BASE = '{{ base }}';

    // Список освежается сам: статус, непрочитанные и время входа меняет не эта
    // страница, а опрос присутствия на сервере. Реже минуты — и таблица врёт
    // молча; чаще — незачем, опрос всё равно ходит раз в 15 секунд.
    const RELOAD_MS = 30000;

    // Журнал ходит чаще списка: в него пишут пинг, вход и отключение — то, что
    // человек только что нажал и чей результат ждёт. Строка на одну анкету стоит
    // одного запроса, и десять секунд здесь дешевле, чем ожидание вслепую.
    const LOG_MS = 10000;

    // Сколько строк на странице — считается от высоты панели, а не задано числом.
    // Смысл пейджера в том, чтобы прокрутки не было вовсе: с ней теряется место, а
    // вернуться к строке, которую только что смотрел, нечем. Постоянное число не
    // годится — на ноутбуке оно даёт прокрутку, на большом экране пустоту внизу.
    //
    // Это первая прикидка, до того как измерена настоящая высота строки.
    const PAGE_SIZE_GUESS = 15;

    // Где лежат ширина списка и высота журнала. Ключ свой, не общий с «Анкетами»:
    // раскладки у страниц разные, и одно значение на две означало бы, что подгонка
    // одной портит вторую.
    const LAYOUT_KEY = 'dating_profile_layout';

    const siteEl = document.getElementById('siteSelect');
    const importBtn = document.getElementById('importBtn');
    const importStateEl = document.getElementById('importState');
    const tableEl = document.getElementById('table');
    const hintEl = document.getElementById('hint');
    const countEl = document.getElementById('profilesN');
    const findEl = document.getElementById('profileFind');
    const pagerEl = document.getElementById('profilesPager');
    const workEl = document.getElementById('work');
    const workWhoEl = document.getElementById('workWho');
    const workTabsEl = document.getElementById('workTabs');
    const pageEl = document.querySelector('.dating-page');
    const contactsPagerEl = document.getElementById('contactsPager');

    let profiles = [];
    let page = 0;
    let perPage = PAGE_SIZE_GUESS;
    // Какая анкета раскрыта. Она же выбранная: журнал справа показывает её, и
    // двух выбранных «где я сейчас» не бывает. Ноль — не раскрыта ни одна.
    let openId = 0;
    // Кого сейчас держит долгое действие: вход идёт минутами, и перерисовка не
    // должна ни затирать «Вхожу…», ни подсовывать кнопку под руку второй раз.
    const busy = new Set();
    // Ход последнего импорта — строками, как их вернул сервер. Держим здесь, а не
    // в разметке: панель журнала перерисовывается своим кругом, и ход импорта
    // должен её пережить.
    let importLog = [];
    let importBusy = false;
    // Какая вкладка открыта. Переживает смену анкеты: человек читает переписку и
    // переключается между анкетами, а не между вкладками — сбрасывать её на «Чат»
    // при каждом выборе значило бы отнимать у него то, что он только что открыл.
    let workTab = 'chat';
    // Страница собеседниц: серверная, и живёт здесь, а не в разметке — вкладка
    // перерисовывается своим кругом, и читай мы номер из активной кнопки, он
    // возвращался бы на первую страницу прямо под руками.
    let contactsPage = 0;
    // Какой диалог раскрыт. Выбор переживает перерисовку и живёт между заходами:
    // диалогов сотни, и возвращаться к нужному заново — работа на каждый круг.
    let openUid = localStorage.getItem('dating_open_dialog') || '';
    // Последний ответ `/card` выбранной анкеты. Держим, чтобы смена выбранного
    // собеседника перерисовывала переписку без второго запроса: данные те же.
    let chatData = null;

    // Расписание выбранной анкеты, пока его набирают. Живёт здесь, а не в
    // разметке: колонка настроек перерисовывается при каждой правке, и набранное
    // обязано это пережить. Ключ — id анкеты, значение — массив смен
    // `{from: '10:00', to: '15:00'}`: вход и выход одной записью.
    //
    // ⚠ Сервера у расписания пока нет: ручка и таблица появятся отдельным шагом.
    // Здесь только вид и правила ввода, поэтому набранное живёт до перезагрузки
    // страницы — и об этом прямо сказано под блоком, чтобы никто не решил, будто
    // расписание уже работает.
    const scheduleDraft = new Map();

    const siteId = () => Number(siteEl.value || 0);
    const openRow = () => profiles.find(row => row.id === openId) || null;

    function empty(text) {
        tableEl.innerHTML = `<div class="prof-empty">${esc(text)}</div>`;
        countEl.textContent = '';
    }

    async function sitesLoad() {
        try {
            await datingSiteFill(siteEl, BASE);
        } catch (e) {
            siteEl.innerHTML = '<option value="">сайты не пришли</option>';
            showNotification('Список сайтов не пришёл: ' + e.message, 'error');
            return;
        }

        importReadyLoad();
        profilesLoad();
    }

    async function profilesLoad() {
        if (!siteId()) {
            empty('Сайтов нет — заведите закладку в RhapsodyAi.');
            return;
        }

        // Запрошенный сайт запоминаем: ответ приходит не мгновенно, а человек за
        // это время может переключить селект. Без сверки поздний ответ старого
        // сайта затирал бы список нового.
        const requestSite = siteId();
        try {
            profiles = (await getData(`${BASE}/api/dating/profile?site_id=${requestSite}`)).result || [];
        } catch (e) {
            if (siteId() !== requestSite) return;
            empty('Список не пришёл.');
            showNotification('Список профилей не пришёл: ' + e.message, 'error');
            return;
        }

        if (siteId() !== requestSite) return;

        // Раскрытой анкеты могло не стать: её удалили здесь же или она ушла вместе
        // со сменой сайта. Держать открытой строку, которой в списке нет, нельзя —
        // журнал справа показывал бы чужое.
        if (openId && !openRow()) openSet(0);

        tablePaint();
    }

    function shownRows() {
        const needle = findEl.value.trim().toLowerCase();
        if (!needle) return profiles;

        // Одним полем по трём приметам: имя, почта (она же логин) и номер анкеты
        // на сайте. Человек не обязан помнить, что из этого где лежит, — он ищет
        // «ту самую Diana» или «ту, что с bigmir», и оба пути должны работать.
        return profiles.filter(row => [row.name, row.login, row.site_uid]
            .map(part => String(part || '')).join(' ')
            .toLowerCase().includes(needle));
    }

    function actCell(row) {
        // Кнопка одна и всегда одна и та же — в отличие от «Анкет», где их три и
        // они меняются по состоянию учётки. Здесь смотрят на список целиком, и
        // столбец, в котором у каждой строки своя кнопка, читается как сыпь.
        // Остальные действия уехали внутрь карточки: они над одной анкетой, и
        // место им там, где на неё и смотрят.
        if (busy.has(row.id)) {
            return '<button type="button" class="dating-btn busy" disabled>'
                 + '<span class="dating-spin"></span>Жду…</button>';
        }

        // Пинг идёт по сохранённым cookie: нет входа — нечем и стучаться.
        return `<button type="button" class="dating-btn ping-btn"${row.has_state ? '' : ' disabled'}`
             + ` title="${row.has_state ? 'Спросить сайт, жив ли вход — по HTTP, без браузера'
                                        : 'входа ещё не было: нечем стучаться'}">Пинг</button>`;
    }

    // Сколько строк влезает в панель. Меряем по уже нарисованной таблице: высота
    // строки зависит от шрифта и аватара, и зашитое число разъехалось бы с
    // разметкой при первой же правке стилей.
    //
    // Меряем строку списка (`.prof-row`): в таблице других строк и не бывает —
    // настройки выбранной анкеты стоят в соседней колонке, а не внутри списка.
    function rowsFit() {
        const probe = tableEl.querySelector('tbody tr.prof-row');
        const head = tableEl.querySelector('thead');
        if (!probe) return perPage;

        const rowH = probe.getBoundingClientRect().height;
        if (rowH < 1) return perPage;

        const free = tableEl.clientHeight - (head ? head.getBoundingClientRect().height : 0);

        return Math.max(1, Math.floor(free / rowH));
    }

    // `tries` — сколько ещё раз можно перерисовать, подгоняя число строк.
    //
    // Заходов нужно больше одного, и вот почему. Первый рисует прикидкой, когда
    // подвала с пейджером ещё нет, и меряет тело панели во всю высоту. Как только
    // пейджер появляется, тело сжимается на его высоту — и последняя строка
    // уезжает под него. Второй заход меряет уже с пейджером и снимает лишнюю
    // строку; третий обычно только подтверждает, что сошлось.
    //
    // Счётчик, а не «можно/нельзя»: без потолка подгонка могла бы качаться
    // туда-сюда, если строка и пейджер совпадут по высоте неудачно.
    function tablePaint(tries = 3) {
        const found = shownRows();
        countEl.textContent = found.length === profiles.length
            ? profiles.length : `${found.length} из ${profiles.length}`;

        if (!profiles.length) {
            empty('На этом сайте учёток пока нет. Заводят их на странице «Анкеты».');
            pagerRender(pagerEl, 0, 0, () => {});
            return;
        }
        if (!found.length) {
            tableEl.innerHTML = '<div class="prof-empty">Ничего не нашлось.</div>';
            pagerRender(pagerEl, 0, 0, () => {});
            return;
        }

        // Номер страницы правим здесь, а не при вводе в поиск: страниц могло
        // стать меньше — и седьмая, на которой человек стоял, показала бы пустоту
        // вместо найденного.
        const pages = Math.ceil(found.length / perPage);
        if (page > pages - 1) page = pages - 1;
        if (page < 0) page = 0;

        const rows = found.slice(page * perPage, (page + 1) * perPage);

        const body = rows.map(row => {
            const open = row.id === openId;

            return `<tr class="prof-row${open ? ' open' : ''}" data-id="${row.id}">`
                // Пустой колонки под подсветку больше нет: полоса выбранной
                // строки рисуется на первой же содержательной, а отступ слева
                // держит её на расстоянии от фотографии.
                //
                // Тревога автовхода (⚠) переехала сюда же, к имени: она про
                // конкретную анкету, и отдельная колонка под один значок стоила
                // дороже, чем сообщала.
                + '<td class="prof-first"><span class="prof-who">'
                + `<img class="profile-face" src="${esc(row.photo || '')}" alt="" referrerpolicy="no-referrer"`
                + ' onerror="this.style.visibility=\'hidden\'">'
                + '<span class="prof-who-text">'
                // Имя режется многоточием — полное отдаём подсказкой.
                + '<span class="prof-name-row">'
                + `<span class="prof-name" title="${esc(row.name || row.login)}">${esc(row.name || row.login)}</span>`
                + warnBadge(row)
                + '</span>'
                + `<span class="prof-login" title="${esc(row.login)}">${esc(row.login)}</span>`
                + '</span></span></td>'
                // Чекбокс, а не значок: автоответ переключают часто, и ходить
                // за этим в настройки — три нажатия вместо одного. Работает
                // прямо в списке, той же ручкой `PUT /{id}/auto`.
                //
                // Подпись у каждой строки своя, хотя в столбце они повторяются:
                // без неё голый чекбокс в безымянной колонке не говорит, что
                // включает. Заголовка у колонки нет намеренно — он повторял бы
                // подпись, стоящую в каждой строке.
                + '<td class="prof-ai">'
                + `<label class="prof-check" title="Отвечает агентом на новые сообщения">`
                + `<input type="checkbox" class="ai-box"${row.auto_answer ? ' checked' : ''}>`
                + 'ai-ответ</label></td>'
                + `<td class="prof-online">${onlineDot(row)}</td>`
                + `<td class="prof-act">${actCell(row)}</td>`
                + '</tr>';
        }).join('');

        tableEl.innerHTML =
            '<table class="prof-table"><thead><tr>'
            + '<th class="prof-first">Анкета</th><th></th><th>В сети</th><th></th>'
            + '</tr></thead><tbody>' + body + '</tbody></table>';

        // Пейджер рисуем до замера: он занимает высоту, и мерить тело панели без
        // него значит насчитать на строку больше, чем влезет.
        pagerRender(pagerEl, pages, page, (pick) => {
            page = pick;
            tablePaint(0);
        });

        // Подвал **виден всегда**, даже когда страница одна. Общий `pagerRender`
        // при одной странице прячет его целиком — на «Анкетах» это верно, там под
        // списком идёт ещё и форма. Здесь под таблицей пусто, и пропавший подвал
        // читается как «пагинации нет вообще»: человек не понимает, показали ему
        // всё или только начало. Поэтому слева от кнопок — счёт строк, и он
        // отвечает на этот вопрос прямо.
        pagerEl.classList.add('open');
        const counted = document.createElement('span');
        counted.className = 'prof-count';
        counted.textContent = pages > 1
            ? `${found.length} анкет · страница ${page + 1} из ${pages}`
            : `${found.length} ${found.length === profiles.length ? '' : `из ${profiles.length} `}`
              + 'анкет — всё на одной странице';
        pagerEl.prepend(counted);

        // Число строк подгоняем всегда. Раньше подгонка отключалась у раскрытой
        // анкеты — карточка стояла прямо в таблице и была выше любой строки;
        // теперь настройки живут в своей колонке, и мешать замеру нечему.
        const fit = rowsFit();
        if (tries > 0 && fit !== perPage) {
            perPage = fit;
            tablePaint(tries - 1);
            return;
        }

        bindActions();
    }

    // В колонке пометки важнее ошибка: пометку человек писал сам и помнит, а
    // причина отказа — то, ради чего он в таблицу и смотрит.

    // ── Раскрытая карточка ───────────────────────────────────────────────────

    // Настройки выбранной анкеты — содержимое средней колонки. Формы две, потому
    // что и ручки две: учётка правится целиком (`PUT /{id}`), автоответ — отдельно
    // (`PUT /{id}/auto`), и он включается сразу, разбирая накопившееся. Слить их
    // в одну кнопку «Сохранить» значило бы запускать разбор писем при правке
    // пометки.
    function editForms(row) {
        const state = row.has_state
            ? `вход снят ${esc(seenText(row.last_seen_at) || 'когда-то')}`
            : 'входа ещё не было';

        return '<div class="edit-body">'

            // Действия — первыми: на вкладку заходят чаще нажать «Войти», чем
            // править логин. Формы ниже — то, что заполняют один раз и почти не
            // трогают; кнопка, за которой пришли, не должна быть под ними.
            + '<div class="prof-form">'
            + '<h4>Действия</h4>'
            + '<div class="prof-line">'
            + `<button type="button" class="dating-btn login-btn"${row.has_password ? '' : ' disabled'}`
            + ` title="${row.has_password ? 'Сценарий входа в живом браузере — идёт минутами'
                                          : 'у учётки не задан пароль'}">Войти</button>`
            + `<button type="button" class="dating-btn off-btn"${row.has_state ? '' : ' disabled'}`
            + ' title="Выход на сайте, закрытие вкладок, снятие с автовхода">Отключить</button>'
            + '<button type="button" class="dating-btn danger del-btn"'
            + ' title="Удалить учётку вместе с перепиской и журналом">Удалить</button>'
            + '</div>'
            + `<span class="prof-card-note${row.status === 'error' ? ' bad' : ''}">`
            + `${esc(row.last_error || state)}</span>`
            + '</div>'

            + '<form class="prof-form" data-form="save">'
            + '<h4>Учётка</h4>'
            + '<div class="prof-line">'
            + field('Логин', `<input name="login" value="${esc(row.login)}" required`
                           + ' maxlength="190" spellcheck="false" autocomplete="off" size="26">')
            + field('Пароль', '<input name="password" type="password" placeholder="не менять"'
                            + ' maxlength="255" autocomplete="new-password" size="14">')
            + field('Роль', '<select name="role">'
                          + `<option value="lady"${row.role !== 'man' ? ' selected' : ''}>женская</option>`
                          + `<option value="man"${row.role === 'man' ? ' selected' : ''}>мужская</option>`
                          + '</select>')
            + field('Пометка', `<input name="note" value="${esc(row.note || '')}"`
                             + ' maxlength="255" size="24">')
            + '<button type="submit" class="dating-btn primary">Сохранить</button>'
            + '</div>'
            // Пустой пароль — «не трогать», а не «стереть»: форма его не
            // показывает, и по пустому полю не отличить одно от другого.
            + '<span class="prof-card-note">Пароль пустым — прежний остаётся.'
            + (row.has_password ? '' : ' Сейчас пароль не задан: войти под анкетой нечем.')
            + '</span>'
            + '</form>'

            + '<form class="prof-form" data-form="auto">'
            + '<h4>Автоответ</h4>'
            + '<div class="prof-line">'
            + '<label class="prof-check"><input type="checkbox" name="auto_answer"'
            + `${row.auto_answer ? ' checked' : ''}>отвечает сама</label>`
            + field('Кому отвечать', `<input name="auto_answer_only"`
                                   + ` value="${esc(row.auto_answer_only || '')}"`
                                   + ' maxlength="500" spellcheck="false" autocomplete="off"'
                                   + ' placeholder="всем" size="22">')
            + '<button type="submit" class="dating-btn primary">Сохранить</button>'
            + '</div>'
            // Каждый ответ стоит дважды — прогон LLM и платное сообщение на сайте,
            // — поэтому «всем» у анкеты с сотнями диалогов это рассылка.
            + '<span class="prof-card-note">Номера собеседниц через запятую;'
            + ' пусто — отвечать всем.</span>'
            + '</form>'

            + scheduleBlock(row)

            + '</div>';
    }

    // ── Правая колонка: вкладки работы с анкетой ─────────────────────────────

    // Рисует открытую вкладку. Отдельно от списка и **не по его таймеру**: в
    // настройках поля ввода, и перерисовка под руками стёрла бы набранное вместе
    // с местом курсора. Чат обновляется своим кругом — у него полей нет.
    function workPaint() {
        const row = openRow();
        workWhoEl.textContent = row ? (row.name || row.login) : '';
        workTabsEl.querySelectorAll('.work-tab').forEach(btn =>
            btn.classList.toggle('on', btn.dataset.tab === workTab));

        if (!row) {
            // Пустая правая колонка — единственное место, где виден ход импорта:
            // у него нет своей анкеты, а показать его надо, человек только что
            // нажал кнопку и ждёт, чем кончилось.
            workEl.classList.remove('chat');
            workEl.innerHTML = importLog.length
                ? '<div class="chat-log-head">Импорт</div><div id="log"></div>'
                : '<div class="edit-empty">Выберите анкету в списке — '
                  + 'здесь будет работа с ней.</div>';
            if (importLog.length) logRender(document.getElementById('log'), importLog, '');
            pagerRender(contactsPagerEl, 0, 0, () => {});
            return;
        }

        if (workTab === 'setup') {
            workEl.classList.remove('chat');
            workEl.innerHTML = editForms(row);
            pagerRender(contactsPagerEl, 0, 0, () => {});
            editBind(row);
            return;
        }

        if (workTab === 'chat') { chatLoad(); return; }

        // «Письма» и «Ивенты» — каркас: ручек под них нет, и рисовать нечего.
        // Говорим это прямо, а не пустой панелью: пустое место читается как
        // «не загрузилось».
        workEl.classList.remove('chat');
        workEl.innerHTML = '<div class="work-soon">'
            + (workTab === 'mail' ? 'Почта анкеты появится здесь.'
                                  : 'События анкеты появятся здесь.')
            + '</div>';
        pagerRender(contactsPagerEl, 0, 0, () => {});
    }

    function editBind(row) {
        workEl.querySelector('[data-form="save"]').addEventListener('submit', (e) => {
            e.preventDefault();
            profileSave(row, e.target);
        });
        workEl.querySelector('[data-form="auto"]').addEventListener('submit', (e) => {
            e.preventDefault();
            profileAuto(row, e.target);
        });
        scheduleBind(workEl, row);
        workEl.querySelector('.login-btn').addEventListener('click', () => profileLogin(row));
        workEl.querySelector('.off-btn').addEventListener('click', () => profileDisconnect(row));
        workEl.querySelector('.del-btn').addEventListener('click', () => profileDelete(row));
    }

    // ── Вкладка «Чат»: анкета с сайта, собеседницы, переписка ────────────────
    //
    // Перенесено со страницы «Анкеты» — та же ручка `/card`, та же разметка, те
    // же стили (`dating_page.css`). Здесь чат стоит рядом со списком профилей, а
    // там — рядом со списком девушек: разные списки, одна и та же переписка.

    async function chatLoad() {
        if (!openId || workTab !== 'chat') return;

        // Гонка сети, а не логики: вкладка ходит своим кругом, и ответ по уже
        // снятой анкете может прийти позже ответа по вновь выбранной. Тот же
        // приём, что у списка с `site_id`.
        const requestId = openId;
        let data;
        try {
            data = (await getData(`${BASE}/api/dating/profile/${requestId}/card`
                                  + `?page=${contactsPage + 1}`)).result || {};
        } catch (e) {
            if (openId !== requestId || workTab !== 'chat') return;
            workEl.innerHTML = `<div class="work-soon">переписка не пришла: ${esc(e.message)}</div>`;
            return;
        }
        if (openId !== requestId || workTab !== 'chat') return;

        // Номер страницы берём из ответа: сервер поправит его, если собеседниц
        // стало меньше и страница уехала за конец. Ручка нумерует с единицы,
        // пейджер — с нуля.
        contactsPage = Math.max(0, Number(data.page || 1) - 1);
        chatData = data;
        const row = openRow() || {};
        workWhoEl.textContent = `${row.name || row.login || ''}`
            + (data.contacts_total ? ` · собеседников: ${data.contacts_total}` : '');

        // Прокрутку возвращаем на место: вкладка перерисовывается своим кругом, а
        // человек в это время читает переписку.
        // Прокрутку возвращаем той части, что её и держит: переписке. Вкладка
        // перерисовывается своим кругом, а человек в это время читает.
        const dialogs = workEl.querySelector('.chat-dialogs');
        const scroll = dialogs ? dialogs.scrollTop : 0;

        workEl.classList.add('chat');
        workEl.innerHTML = '<div class="chat-wrap">'
            + '<div class="chat-main">'
            + `<div class="chat-cols">`
            // Первая колонка — два ряда: список диалогов и переписка с выбранным.
            // Карточки анкеты (`.card`) здесь больше нет: имя и фото анкеты и так
            // стоят в шапке панели и в списке слева, а место в колонке нужно
            // разговору.
            + '<div class="chat-talk">'
            + '<div class="chat-dialogs-head">'
            + '<span>Диалоги на сайте</span>'
            + `<span class="chat-dialogs-count">${dialogsCount()}</span>`
            + '<button type="button" class="dating-btn chat-dialogs-btn"'
            + ' title="Войти на сайт под анкетой и снять список тех, с кем есть переписка">'
            + 'Загрузить диалоги</button>'
            + '</div>'
            + `<div class="chat-dialogs">${chatContacts(data)}</div>`
            + '<div class="split split-row" id="splitTalk"'
            + ' title="Потяните, чтобы изменить высоту"></div>'
            + `<div class="chat-msgs">${chatTalk(data)}</div>`
            + '</div>'
            + '<div class="split split-people" data-var="--fav"'
            + ' title="Потяните, чтобы изменить ширину"></div>'
            + peopleCol('favorite', 'Favorite')
            + '<div class="split split-people" data-var="--online"'
            + ' title="Потяните, чтобы изменить ширину"></div>'
            + peopleCol('online', 'Все онлайн')
            + '</div>'
            + '</div>'
            + '<div class="split split-row" id="splitRow" title="Потяните, чтобы изменить высоту"></div>'
            + '<div class="chat-log"><div class="chat-log-head">Журнал</div>'
            + '<div class="chat-log-body" id="log"></div></div>'
            + '</div>';
        workEl.querySelector('.chat-dialogs').scrollTop = scroll;

        // Разделитель живёт внутри перерисовываемой разметки, поэтому вешаем
        // обработчик каждый раз заново — узел новый.
        splitDrag(workEl.querySelector('#splitRow'), '--log', 80,
                  Math.round(innerHeight * 0.6),
                  (e) => workEl.getBoundingClientRect().bottom - e.clientY);

        splitDrag(workEl.querySelector('#splitTalk'), '--talk', 90,
                  Math.round(innerHeight * 0.5),
                  (e) => workEl.querySelector('.chat-talk').getBoundingClientRect().bottom
                         - e.clientY);

        // Колонки собеседников растут **влево**, к переписке: правый край каждой
        // стоит на месте, а тянут за левый. Поэтому ширина считается от правого
        // края самой колонки, а не от края панели.
        //
        // Обработчики вешаем заново на каждую отрисовку — разметка вкладки
        // пересобирается, и узлы каждый раз новые.
        workEl.querySelectorAll('.split-people').forEach(split => {
            const col = split.nextElementSibling;
            splitDrag(split, split.dataset.var, 90, 400,
                      (e) => col.getBoundingClientRect().right - e.clientX);
        });

        logLoad();

        // Листаем запросом: страница собеседниц серверная. После перехода
        // прокрутка в начало — на новой странице сохранять место незачем.
        pagerRender(contactsPagerEl, Number(data.pages || 1), contactsPage, async (page) => {
            contactsPage = page;
            await chatLoad();
            workEl.scrollTop = 0;
        });

        chatBind();
        peopleBind();
    }

    function chatContacts(data) {
        const rows = (data.contacts || []).map(c => {
            const last = (c.messages_last || []).slice(-1)[0] || {};
            const open = openUid === String(c.uid);

            // Строка больше не раскрывается: переписка живёт ниже, в своём ряду, и
            // одна и та же — какую бы колонку ни выбрали. Раскрытие внутри строки
            // означало бы два места для одного разговора.
            return `<div class="contact${c.needs_answer ? ' wait' : ''}${open ? ' open' : ''}"`
                + ` data-uid="${esc(c.uid)}">`
                + '<div class="contact-bar">'
                + `<span class="contact-face">${esc((c.name || '?').slice(0, 1).toUpperCase())}`
                + (c.photo ? `<img src="${esc(c.photo)}" alt="" referrerpolicy="no-referrer"`
                             + ' onerror="this.remove()">' : '')
                + '</span>'
                + `<span class="contact-name">${esc(c.name || 'без имени')}</span>`
                + `<span class="contact-id" title="номер анкеты на сайте">ID ${esc(c.uid)}</span>`
                + `<span class="contact-last">${esc(last.direction === 'out' ? 'вы: ' : '')}`
                + `${esc(last.text || 'сообщений нет')}</span>`
                + `<span class="contact-time">${esc(String(last.created_at || '').slice(11, 16))}</span>`
                + (c.needs_answer
                    ? '<span class="need" title="последнее слово за собеседником">нужен ответ</span>'
                    : `<span class="contact-id" title="реплик в переписке">✉ ${c.messages}</span>`)
                + '</div></div>';
        }).join('');

        return rows || '<div class="work-soon">собеседников пока нет — '
                     + 'запустите «Диалоги» на «Анкетах»</div>';
    }

    // Переписка с выбранным собеседником — нижний ряд первой колонки.
    //
    // **Собеседника выбирают в любой из трёх колонок**, и переписка одна на все:
    // человек находит кого-то в «Все онлайн», нажимает — и сразу видит, говорили
    // ли с ним раньше. Раньше переписка раскрывалась внутри строки диалога, и
    // выбранный из колонки собеседник показать её не мог вовсе.
    function chatTalk(data) {
        if (!openUid) {
            return '<div class="talk-empty">Выберите собеседника — '
                 + 'здесь будет переписка с ним.</div>';
        }

        const found = (data.contacts || []).find(c => String(c.uid) === String(openUid));
        const who = peopleName(openUid) || (found && found.name) || openUid;

        // Собеседник есть в списках сайта, но переписки с ним нет: это законный
        // ответ, а не пустота. Говорим прямо — иначе пустой ряд читается как
        // «не загрузилось».
        if (!found) {
            return `<div class="talk-head">${esc(who)}</div>`
                 + '<div class="talk-empty">Диалог ещё не осуществлялся.</div>';
        }

        const p = data.profile || {};
        const me = p.name || data.login || 'мы';
        const msgs = (found.messages_last || []).map(m =>
            `<div class="msg ${m.direction === 'out' ? 'out' : 'in'}">`
            + '<span class="msg-body">'
            + `<span class="msg-who">${esc(m.direction === 'out' ? me : (found.name || 'он'))}</span>`
            + `${esc(m.text)}</span></div>`).join('');

        return `<div class="talk-head">${esc(found.name || who)}`
             + `<span class="talk-id">ID ${esc(found.uid)}</span></div>`
             + `<div class="talk-body">${msgs || '<div class="talk-empty">'
                                               + 'Диалог ещё не осуществлялся.</div>'}</div>`;
    }

    // Имя выбранного из колонок собеседника: в переписке его может не быть, а
    // подписать ряд надо. Ищем в снятых списках — они уже в памяти.
    function peopleName(uid) {
        for (const kind of ['favorite', 'online']) {
            const state = peopleCache.get(`${openId}|${kind}`);
            const found = (state && state.people || []).find(p => String(p.uid) === String(uid));
            if (found) return found.name;
        }

        return '';
    }

    // ── Колонки собеседников с сайта ──────────────────────────────────────────
    //
    // Списки снимает RhapsodyAi, входя под анкетой в её кабинет: это десятки
    // секунд живого браузера. Поэтому у ручки кэш с выдержкой и жёсткий пол, а
    // страница может спрашивать сколько угодно — подробности в `dating_people.py`.

    // Снятые списки: ключ `id анкеты|вид`. Держим здесь, чтобы перерисовка чата
    // (она идёт своим кругом) не оставляла колонки пустыми на время запроса —
    // мигание пустотой каждые десять секунд читалось бы как «список пропал».
    const peopleCache = new Map();

    function peopleCol(kind, title) {
        const state = peopleCache.get(`${openId}|${kind}`);

        return `<div class="people-col" data-kind="${kind}">`
            + '<div class="people-head">'
            + `<span>${esc(title)}</span>`
            // Счёт показываем, только когда список **снят**. У колонки, которая
            // не снялась, `people` тоже пуст — но это «неизвестно», а не «ноль»,
            // и написать там 0 значило бы сообщить, что на сайте никого нет.
            + `<span class="people-count">${peopleCount(state)}</span>`
            + '<button type="button" class="people-reload" title="Снять список заново">⟳</button>'
            + '</div>'
            + `<div class="people-when">${peopleWhen(state)}</div>`
            + `<div class="people-body">${peopleRows(state)}</div>`
            + '</div>';
    }

    function peopleCount(state) {
        return state && state.taken_at ? `${state.people.length}` : '';
    }

    // Когда список снят с сайта — строкой под заголовком колонки.
    //
    // ⚠ **Без неё показанное нельзя истолковать.** Список живёт в кэше и отдаётся
    // из него по пять минут, а при отказе соседа — сколько угодно долго: браузер у
    // него общий, и свободной вкладки может не находиться часами. Человек в это
    // время смотрит на имена и не знает, они ли сейчас на сайте.
    //
    // Отказ приписываем сюда же, к самому старому: «12:15 · не обновилось» — это
    // одно сообщение, а не два. Полная причина — в подсказке.
    // Снимка нет вовсе — здесь пусто: про это говорит само тело колонки («не
    // снялось» с причиной в подсказке), и вторая такая же надпись строкой выше
    // сообщала бы то же самое дважды.
    function peopleWhen(state) {
        if (!state || !state.taken_at) return '';

        const time = String(state.taken_at).slice(11, 16);

        return state.error
            ? `<span class="bad" title="${esc(state.error)}">${esc(time)} · не обновилось</span>`
            : `<span title="снято ${esc(state.taken_at)}">${esc(time)}</span>`;
    }

    function peopleRows(state) {
        if (!state) return '<div class="people-empty">гружу…</div>';
        if (state.error && !state.people.length) {
            return `<div class="people-empty bad" title="${esc(state.error)}">не снялось</div>`;
        }
        if (!state.people.length) return '<div class="people-empty">пусто</div>';

        return state.people.map(p =>
            `<div class="person${String(openUid) === String(p.uid) ? ' open' : ''}"`
            + ` data-uid="${esc(p.uid)}"`
            + ` title="${esc(p.name)}${p.age ? ', ' + p.age : ''}`
            + `${p.online ? ' · в сети' : ''}">`
            // Точка — перед лицом: столбец точек у левого края читается сверху
            // вниз одним движением глаза. Стояла она справа, у переменного края
            // строки, и «кто в сети» приходилось выискивать по всей колонке.
            + `<span class="person-dot${p.online ? ' online' : ''}"></span>`
            + `<span class="person-face">${esc((p.name || '?').slice(0, 1).toUpperCase())}`
            + (p.photo ? `<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer"`
                         + ' onerror="this.remove()">' : '')
            + '</span>'
            + '<span class="person-text">'
            + `<span class="person-name">${esc(p.name || 'без имени')}</span>`
            + `<span class="person-meta">${p.age ? p.age : ''}`
            + `${p.age && p.uid ? ' · ' : ''}${esc(p.uid)}</span>`
            + '</span>'
            + (dialogHas(p) ? '<span class="person-talk" title="с ним есть переписка">💬</span>' : '')
            + '</div>').join('');
    }

    // Грузит один список. `fresh` ставит только кнопка: сам по себе круг
    // перерисовки его не ставит, иначе кэш на сервере терял бы смысл.
    async function peopleLoad(kind, fresh = false) {
        if (!openId) return;

        const requestId = openId;
        let state;
        try {
            state = (await getData(`${BASE}/api/dating/people/${requestId}/${kind}`
                                   + (fresh ? '?fresh=1' : ''))).result || {};
        } catch (e) {
            state = {people: [], error: e.message};
        }

        // Та же гонка, что у списка и журнала: ответ по уже снятой анкете может
        // прийти позже ответа по вновь выбранной.
        if (openId !== requestId) return;

        peopleCache.set(`${requestId}|${kind}`, state);
        peoplePaint(kind);
    }

    // Перерисовываем только свою колонку: пересобирать вкладку целиком значило бы
    // сбросить прокрутку списка диалогов и снять выбор.
    function peoplePaint(kind) {
        const col = workEl.querySelector(`.people-col[data-kind="${kind}"]`);
        if (!col) return;

        const state = peopleCache.get(`${openId}|${kind}`);
        col.querySelector('.people-body').innerHTML = peopleRows(state);
        col.querySelector('.people-count').textContent = peopleCount(state);
        col.querySelector('.people-when').innerHTML = peopleWhen(state);
        peopleBindRows(col);
    }

    // Строки колонки выбирают собеседника — тем же способом, что список диалогов.
    function peopleBindRows(col) {
        col.querySelectorAll('.person').forEach(person => {
            person.addEventListener('click', () => chatSelect(person.dataset.uid));
        });
    }

    function peopleBind() {
        workEl.querySelectorAll('.people-col').forEach(col => {
            const kind = col.dataset.kind;
            const btn = col.querySelector('.people-reload');

            btn.addEventListener('click', async () => {
                btn.disabled = true;
                col.querySelector('.people-body').innerHTML =
                    '<div class="people-empty">снимаю…</div>';
                try {
                    await peopleLoad(kind, true);
                } finally {
                    btn.disabled = false;
                }
            });

            peopleBindRows(col);

            // Список грузим, только если его ещё нет: перерисовка чата идёт каждые
            // десять секунд, и запрос на каждый круг был бы лишним даже с кэшем.
            if (!peopleCache.has(`${openId}|${kind}`)) peopleLoad(kind);
        });
    }

    // Есть ли с этим человеком переписка на сайте.
    //
    // ⚠ **Сводим по фотографии и по имени, а не по номеру.** Номера у одного и
    // того же человека разные: в кабинете он `812886` из ссылки на анкету, а в
    // чате номера нет вовсе — разговор открывает скрипт, и ссылка приходит голой.
    // Общее у записей — файл фотографии (суффикс размера снимается при разборе) и
    // имя. По ним и сходятся.
    function dialogHas(person) {
        const state = peopleCache.get(`${openId}|dialog`);
        if (!state) return false;

        return (state.people || []).some(d =>
            (person.photo_uid && d.photo_uid === person.photo_uid)
            || (person.name && d.name.toLowerCase() === person.name.toLowerCase()));
    }

    function dialogsCount() {
        return peopleCount(peopleCache.get(`${openId}|dialog`));
    }

    // ── Выбор собеседника: один на все три колонки ────────────────────────────

    // Выбрали в «Все онлайн» — снялся выбор в списке диалогов, и наоборот. Двух
    // выбранных «с кем я сейчас говорю» не бывает, а переписка ниже одна.
    //
    // Повторное нажатие снимает выбор. Выбор живёт между заходами
    // (`localStorage`): диалогов сотни, и возвращаться к нужному заново — работа
    // на каждый круг.
    function chatSelect(uid) {
        openUid = String(openUid) === String(uid) ? '' : String(uid);
        localStorage.setItem('dating_open_dialog', openUid);

        // Подсветку правим на месте, переписку перерисовываем: пересобирать
        // вкладку целиком значило бы сбросить прокрутку и снять фокус.
        workEl.querySelectorAll('.contact, .person').forEach(el =>
            el.classList.toggle('open', el.dataset.uid === openUid));

        talkPaint();
    }

    // Перерисовывает нижний ряд первой колонки. Данные берём из последнего ответа
    // `/card` — он уже в памяти, и второй запрос ради смены выбранного не нужен.
    function talkPaint() {
        const box = workEl.querySelector('.chat-msgs');
        if (box && chatData) box.innerHTML = chatTalk(chatData);
    }

    function chatBind() {
        workEl.querySelectorAll('.contact-bar').forEach(bar => {
            bar.addEventListener('click', () => chatSelect(bar.parentElement.dataset.uid));
        });

        const btn = workEl.querySelector('.chat-dialogs-btn');
        if (!btn) return;

        // Прогон входит на сайт под анкетой и идёт **десятки секунд** — кнопка
        // занята всё это время. Список потом лежит в кэше ручки, и повторное
        // нажатие в ближайшие минуты вернётся сразу.
        //
        // ⚠ **`busy` здесь обязателен.** Вкладка чата перерисовывается своим
        // кругом раз в `LOG_MS`, а перерисовка пересобирает разметку целиком — и
        // кнопку вместе с ней. Без `busy` посреди прогона она возвращалась бы к
        // обычному виду, и её нажимали бы снова: второй вход на сайт под той же
        // анкетой за минуту, ровно то, от чего бережёт кэш ручки. Круг это
        // ожидание пережидает — так же, как ждёт долгие действия в списке.
        btn.addEventListener('click', async () => {
            busy.add(`dialog:${openId}`);
            btn.disabled = true;
            btn.innerHTML = '<span class="dating-spin"></span>Захожу на сайт…';
            try {
                await peopleLoad('dialog', true);
                const state = peopleCache.get(`${openId}|dialog`);
                if (state && state.error) {
                    showNotification('Диалоги не снялись: ' + state.error, 'error');
                } else if (state) {
                    showNotification(`Диалогов на сайте: ${state.people.length}`, 'success');
                }
            } finally {
                busy.delete(`dialog:${openId}`);
                btn.disabled = false;
                btn.innerHTML = 'Загрузить диалоги';
            }

            // Перерисовываем вкладку целиком, а не счётчик и колонки по
            // отдельности: значки «есть переписка» стоят в обеих колонках
            // собеседников и в списке диалогов, и собирать их руками по трём
            // местам — три случая забыть одно из них. Данные уже в памяти,
            // лишнего запроса к сайту перерисовка не делает.
            await chatLoad();
        });
    }

    function field(label, control) {
        return `<label class="prof-field"><span>${esc(label)}</span>${control}</label>`;
    }

    // ── Расписание: смены анкеты по времени суток ────────────────────────────

    // Одна запись — **смена целиком**: вход и выход в одной строке, на одном
    // ползунке. Левая ручка — вход, правая — выход.
    //
    // Так устроено не для краткости. Вход и выход обязаны чередоваться, и в паре
    // «две отдельные записи» это правило приходилось проверять и чинить: список
    // сортируется временем, и сдвинутый ползунок превращал верное расписание в
    // «вход, вход, выход». Смена целой записью делает чередование **структурным**:
    // нарушить его нечем, а «вошла и не вышла» не выражается вовсе.

    // Смены, отсортированные по времени входа. Сортируем при каждой отрисовке:
    // время правят ползунком, и смена, заведённая последней, может оказаться
    // первой по времени.
    function scheduleRows(profileId) {
        const rows = scheduleDraft.get(profileId) || [];

        return [...rows].sort((a, b) => (a.from || '').localeCompare(b.from || ''));
    }

    // Расписание годно, когда у каждой смены выход позже входа и смены не
    // налезают друг на друга.
    function scheduleCheck(rows) {
        if (!rows.length) return 'Расписания нет — анкета входит и выходит вручную';

        const empty = rows.find(row => !row.from || !row.to);
        if (empty) return 'У каждой смены должны быть вход и выход';

        // Выход строго позже входа. Равенство тоже не годится: смена нулевой
        // длины — это вход, за которым сразу выход, то есть ничего.
        const backwards = rows.find(row => row.to <= row.from);
        if (backwards) return `Смена ${backwards.from}–${backwards.to}: выход не позже входа`;

        // **Смены не перекрываются.** Анкета не может войти второй раз, не выйдя:
        // сайт держит одну сессию на учётку, и второй вход выбросил бы первую.
        // Проверяем по соседям в отсортированном списке — этого достаточно, чтобы
        // поймать любое пересечение.
        const overlap = scheduleOverlap(rows);
        if (overlap >= 0) {
            return `Смены ${rows[overlap - 1].from}–${rows[overlap - 1].to} и `
                 + `${rows[overlap].from}–${rows[overlap].to} налезают друг на друга`;
        }

        return '';
    }

    // Номер смены, которая начинается раньше, чем кончилась предыдущая.
    // `-1` — пересечений нет. Отдельной функцией: ответ нужен и словами под
    // кнопкой, и подсветкой самой строки.
    function scheduleOverlap(rows) {
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].from < rows[i - 1].to) return i;
        }

        return -1;
    }

    // Сутки в минутах — мера всей шкалы: ползунок ходит от 0 до 1440.
    const DAY_MINUTES = 24 * 60;

    // Шаг ползунка. Четверть часа, а не минута: на ширине колонки минутный шаг
    // даёт меньше пикселя на деление, и попасть в «10:00» мышью нельзя. Круглые
    // времена, которыми расписание и задают, кратны пятнадцати все до одного.
    const STEP_MINUTES = 15;

    const timeText = (minutes) => {
        const m = Math.max(0, Math.min(Number(minutes) || 0, DAY_MINUTES));
        return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:`
             + `${String(m % 60).padStart(2, '0')}`;
    };

    const timeMinutes = (text) => {
        const [h, m] = String(text || '0:0').split(':').map(Number);
        return (Number.isFinite(h) ? h : 0) * 60 + (Number.isFinite(m) ? m : 0);
    };

    // Подпись к смене: «10:00 → 15:00». Стрелка, а не тире: это не диапазон
    // значений, а вход и выход — у них есть направление.
    function timeLabel(item) {
        return `${esc(item.from)} <span class="exact">→</span> ${esc(item.to)}`;
    }

    // Ползунок смены: вся ширина — сутки, левая ручка вход, правая выход.
    // Заливка между ними и есть время, когда анкета в сети.
    function rangeInput(item) {
        const from = timeMinutes(item.from);
        const to = timeMinutes(item.to);
        const left = (Math.min(from, to) / DAY_MINUTES) * 100;
        const width = (Math.abs(to - from) / DAY_MINUTES) * 100;

        const slider = (edge, value) =>
            `<input type="range" min="0" max="${DAY_MINUTES}" step="${STEP_MINUTES}"`
            + ` value="${value}" data-edge="${edge}"`
            + ` aria-label="${edge === 'from' ? 'вход' : 'выход'}">`;

        return '<div class="sched-range">'
             + '<div class="sched-track"></div>'
             + `<div class="sched-fill" style="left:${left}%;width:${width}%"></div>`
             + slider('from', from) + slider('to', to)
             + '</div>';
    }

    // Лента суток: смены полосами на шкале от полуночи до полуночи.
    //
    // Ради неё блок и не выглядит списком полей. Расписание отвечает на вопрос
    // «когда анкета в сети», а строки на него не отвечают — это надо складывать в
    // уме. На ленте сразу видны и дыры между сменами, и налезающие друг на друга
    // смены: их полосы перекрываются.
    function scheduleDay(rows) {
        const percent = (time) => (timeMinutes(time) / DAY_MINUTES) * 100;

        const spans = rows.map((item, index) => {
            const left = percent(item.from);
            const width = Math.max(percent(item.to) - left, 0.6);

            return `<span class="sched-span${index === scheduleOverlap(rows) ? ' clash' : ''}"`
                 + ` style="left:${left}%;width:${width}%"></span>`;
        }).join('');

        return `<div class="sched-day">${spans}</div>`
             + '<div class="sched-hours"><span>00</span><span>06</span><span>12</span>'
             + '<span>18</span><span>24</span></div>';
    }

    // Правит черновик и перерисовывает настройки. Перерисовываем целиком, а не
    // одну строку: от правки времени меняется порядок смен и вся лента суток, и
    // подновлять их по кусочкам значило бы держать два способа рисовать одно.
    //
    // Только настройки, не список: расписание в таблице не показано, а лишняя
    // перерисовка под руками стоит мигания.
    function scheduleEdit(profileId, change) {
        const rows = [...(scheduleDraft.get(profileId) || [])];
        change(rows);
        scheduleDraft.set(profileId, rows);
        workPaint();
    }

    function scheduleBind(card, row) {
        const form = card.querySelector('[data-form="schedule"]');
        if (!form) return;

        // Новая смена встаёт в **первый свободный промежуток**, а не в конец:
        // смены не перекрываются, и запись, севшая поверх соседки, была бы
        // негодной с первой секунды.
        form.querySelector('.sched-add-btn').addEventListener('click', () => {
            const room = scheduleRoom(scheduleRows(row.id));
            if (!room) return;

            scheduleEdit(row.id, rows => rows.push({from: timeText(room.from),
                                                    to: timeText(room.to)}));
        });

        // Строки читаем в том же порядке, в каком нарисовали (по времени входа), —
        // иначе `data-index` указывал бы не на ту смену.
        const shown = scheduleRows(row.id);
        form.querySelectorAll('.sched-row').forEach((line, index) => {
            const item = shown[index];

            line.querySelector('.sched-drop').addEventListener('click', () =>
                scheduleEdit(row.id, rows => rows.splice(rows.indexOf(item), 1)));

            // Ползунок шлёт `input` на каждое движение ручки. Перерисовывать по
            // нему всю колонку нельзя: новый узел не получит захвата указателя, и
            // ручка выскользнет из-под пальца на первом же шаге. Поэтому пока
            // тянут — правим черновик и подкрашиваем эту же строку на месте, а
            // перерисовку откладываем до `change`, то есть до отпускания.
            const sliders = [...line.querySelectorAll('input[type=range]')];
            const fill = line.querySelector('.sched-fill');
            const label = line.querySelector('.sched-time');

            const readEdges = () => {
                // Ручки не меняются местами: меньшая — вход, большая — выход.
                // Иначе, перетащив вход за выход, человек получил бы смену
                // наизнанку и отрицательную ширину заливки.
                const values = sliders.map(s => Number(s.value)).sort((a, b) => a - b);
