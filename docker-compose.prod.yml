# Прод: два сервиса вместо четырёх.
#
# Сервер один на оба проекта, и поднимать там второй MySQL со вторым Redis значило
# бы платить памятью за то, что уже работает. Поэтому на проде DatingAi берёт
# движки RhapsodyAi, оставаясь хозяином своих данных:
#
#   * MySQL — тот же сервер, но **своя база** `dating` со своим пользователем.
#     Схема, права и бэкапы остаются раздельными; общий только процесс.
#   * Redis — тот же, но **своя база по номеру** (`/1`). Ключи и очередь `dating`
#     не пересекаются с чужими, а один Redis на два проекта нормален: он и заводится
#     ради того, чтобы его делить.
#
# Локально (`docker-compose.yml`) всё наоборот: свои `dating_mysql` и `dating_redis`.
# Разработке нужна установка, которую можно уронить и поднять, не спрашивая соседа.
#
# Запуск на проде:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d dating_uvicorn dating_worker

services:
  dating_uvicorn:
    # Порт наружу не публикуется: снаружи в панель ходят через Caddy соседа
    # (`92.5.17.195.sslip.io/dating`), а прямой порт был бы вторым, неохраняемым
    # входом в неё.
    ports: !override []
    # Зависимости снимаем целиком. `replicas: 0` гасит сервис, но не убирает
    # ссылку на него: compose всё равно требует `dating_mysql` и отказывается
    # поднимать — «is missing dependency». База и очередь на проде чужие, ждать
    # своих нечего.
    depends_on: !reset []
    env_file:
      - .env
      - .env.prod
    networks:
      - dating-net
      - rhapsody-net

  dating_worker:
    depends_on: !reset []
    env_file:
      - .env
      - .env.prod
    # Адрес разворачивает **оболочка внутри контейнера**, а не compose. Разница
    # принципиальна: `${REDIS_URL}` в команде compose берёт из `.env` проекта и
    # ничего не знает про `env_file` — на проде туда попадал локальный
    # `dating_redis`, которого там нет, и воркер падал на разрешении имени.
    command: sh -c 'rq worker --url "$$REDIS_URL" dating'
    networks:
      - dating-net
      - rhapsody-net

  # Свои движки на проде не нужны: их роль исполняют контейнеры RhapsodyAi.
  # Описания оставлены (оверрайд не умеет убирать сервисы), но их никто не
  # поднимает: в команде запуска перечислены только `dating_uvicorn` и
  # `dating_worker`, а ссылки на них сняты выше через `depends_on: !reset`.
  dating_mysql:
    profiles: ["local_only"]

  dating_redis:
    profiles: ["local_only"]
