# Состав DatingAi на проде: два сервиса и ни одного лишнего.
#
# `dating_uvicorn` — панель и API, `dating_worker` — смена держателя чат-сокетов.
# Браузера, Qdrant, OpenSearch и прочего здесь нет: это хозяйство RhapsodyAi, к
# которому проект ходит по HTTP.
#
# **Этот файл описывает прод.** Локальные особенности — свои MySQL, Redis и
# phpMyAdmin, публикация портов, работа без `.env.prod` — лежат в
# `docker-compose.override.yml`, который compose подхватывает **сам**, без `-f`.
# Отсюда правило: на машине разработчика запускается `docker compose up -d`, а
# на проде того же файла нет, и та же команда поднимает прод.
#
# Почему так, а не наоборот. Прод — то, что должно работать по умолчанию: забыть
# флаг легко, и цена забытого флага здесь «панель поднялась не той стороной».
# Локальная установка, наоборот, всегда стоит на машине, где накладка лежит
# рядом и подхватывается сама, — забыть её нельзя.
#
# Сервер один на оба проекта, и поднимать там второй MySQL со вторым Redis
# значило бы платить памятью за то, что уже работает. Поэтому на проде DatingAi
# берёт движки RhapsodyAi, оставаясь хозяином своих данных:
#
#   * MySQL — тот же сервер, но **своя база** `dating` со своим пользователем.
#     Схема, права и бэкапы остаются раздельными; общий только процесс.
#   * Redis — тот же, но **своя база по номеру** (`/1`). Ключи и очередь `dating`
#     не пересекаются с чужими, а один Redis на два проекта нормален: он и
#     заводится ради того, чтобы его делить.
#
# Сеть внешняя (`rhapsody-net`): контейнеры должны видеть `uvicorn` соседа по
# имени. Без общей сети адресом пришлось бы делать `host.docker.internal`, а он
# ведёт себя по-разному на Linux и Mac и ломается на сервере.

# Имена сервисов с префиксом `dating_` — не для красоты. Compose регистрирует имя
# сервиса псевдонимом в каждой сети, а сеть с RhapsodyAi общая: сервис по имени
# `uvicorn` перехватывал бы обращения соседа к самому себе. Проверено — так и
# вышло: в журнал нового контейнера посыпались чужие запросы `/telegram-app/...`.
services:
  dating_uvicorn:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: dating_uvicorn
    volumes:
      - ./:/app
    # Два слоя: `.env` — общий, `.env.prod` — прод поверх него (чужой MySQL,
    # `BASE_PATH=/dating`, боевой токен соседа). На машине разработчика второй
    # слой снимает накладка: `.env.prod` лежит и локально, и подхватись он тут —
    # разработка пошла бы в прод-базу.
    env_file:
      - .env
      - .env.prod
    networks:
      - dating-net
      - rhapsody-net
    restart: always
    # Порт наружу не публикуется: снаружи в панель ходят через Caddy соседа
    # (`92.5.17.195.sslip.io/dating`), а прямой порт был бы вторым, неохраняемым
    # входом в неё. Публикацию добавляет локальная накладка.

  dating_worker:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: dating_worker
    # Адрес разворачивает **оболочка внутри контейнера**, а не compose. Разница
    # принципиальна: `${REDIS_URL}` в команде compose берёт значение из `.env`
    # проекта и ничего не знает про `env_file` — на проде туда попадал локальный
    # `dating_redis`, которого там нет, и воркер падал на разрешении имени.
    command: sh -c 'rq worker --url "$$REDIS_URL" dating'
    volumes:
      - ./:/app
    env_file:
      - .env
      - .env.prod
    depends_on:
      - dating_uvicorn
    networks:
      - dating-net
      - rhapsody-net
    restart: always

networks:
  dating-net:
  rhapsody-net:
    external: true
    # Сеть поднимает RhapsodyAi; имя складывается из имени его каталога и имени
    # сети в его compose. Своей копии этой сети быть не может — она общая.
    name: rhapsodyai_os-net
