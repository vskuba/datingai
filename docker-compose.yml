# Состав DatingAi на проде: два сервиса и ни одного лишнего.
#
# `dating_uvicorn` — панель и API, `dating_worker` — смена держателя чат-сокетов.
# Браузера, Qdrant, OpenSearch и прочего здесь нет: это хозяйство RhapsodyAi, к
# которому проект ходит по HTTP.
#
# **Этот файл описывает прод.** Локальные особенности — свои MySQL, Redis и
# phpMyAdmin, публикация портов, работа без `.env.prod` — лежат в
# `docker-compose.override.yml`, который compose подхватывает **сам**, без `-f`.
# Отсюда правило: на машине разработчика запускается `docker compose up -d`, а
# на проде того же файла нет, и та же команда поднимает прод.
#
# Почему так, а не наоборот. Прод — то, что должно работать по умолчанию: забыть
# флаг легко, и цена забытого флага здесь «панель поднялась не той стороной».
# Локальная установка, наоборот, всегда стоит на машине, где накладка лежит
# рядом и подхватывается сама, — забыть её нельзя.
#
# Сервер один на оба проекта, но движки у каждого свои: MySQL, Redis и
# phpMyAdmin поднимаются здесь.
#
# Раньше их брали у RhapsodyAi — считалось, что второй MySQL это плата памятью за
# то, что уже работает. Цену экономии узнали 25 августа: сосед пересоздал свой
# MySQL, и база `dating` вместе с её пользователем исчезла. Панель три дня
# отвечала «Access denied» на каждый вход, а снаружи выглядела живой — `/health`
# в базу не ходит. Своя база стоит ~400 МБ и не зависит от чужих выкладок.
#
# С соседом осталось ровно две связи, и обе осознанные:
#
#   * его API по публичному HTTPS (`RHAPSODY_URL`) — сценарии, сайты, агенты,
#     ответы в чате. Это связь по существу: продукт без него не работает;
#   * его Caddy как вход снаружи — 80 и 443 одни на машину, и второй Caddy рядом
#     не встанет. Он ходит к нам по адресу `172.17.0.1:8021`, а не по имени
#     контейнера, поэтому общая docker-сеть для этого не нужна.
#
# Имена сервисов с префиксом `dating_` — не для красоты. Пока сеть с RhapsodyAi
# была общей, compose регистрировал имя сервиса псевдонимом в ней, и сервис по
# имени `uvicorn` перехватывал бы обращения соседа к самому себе. Проверено — так
# и вышло: в журнал нового контейнера посыпались чужие запросы `/telegram-app/…`.
# Сети больше нет, а правило осталось: имена на общей машине должны быть свои.
services:
  dating_uvicorn:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: dating_uvicorn
    volumes:
      - ./:/app
    # Один слой, а не два. `.env` сюда не входит намеренно: он машинный — в нём
    # локальные пароли и токены разработчика, и на сервере ему делать нечего.
    # Пока слоёв было два, значение могло молча прийти из `.env` — так на проде
    # и оказался локальный адрес phpMyAdmin вместо соседского.
    #
    # Значит `.env.prod` обязан быть полным: всё, что читает приложение, есть в
    # нём. Локальная накладка ставит на это место `.env` через `!override`.
    env_file:
      - .env.prod
    depends_on:
      dating_mysql:
        condition: service_healthy
      dating_redis:
        condition: service_started
    networks:
      - dating-net

    # ⚠⚠ **Предел на журнал контейнера: без него он растёт без границ.**
    # На сервере логи Docker занимали 12 ГБ — больше всей базы, — и наш
    # воркер был самым громким: полтора гигабайта в сутки.
    #
    # ⚠ Здесь, а не только в `daemon.json`. Умолчание демона применяется
    # к новым контейнерам и требует **полного рестарта Docker**, то есть
    # даунтайма всех контейнеров сервера, включая чужие проекты.
    # `systemctl reload` (SIGHUP) перечитывает лишь часть опций, и
    # `log-opts` в неё не входит — проверено пробным контейнером: он
    # написал 137 МБ в один файл. Своя секция действует сразу.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: always
    # Порт слушает **шлюз docker0**, а не петлю и не все адреса.
    #
    # Петля не годится: Caddy соседа живёт в контейнере, и `127.0.0.1` для него —
    # он сам. `0.0.0.0` не годится по другой причине — панель оказалась бы открыта
    # на всех интерфейсах машины вторым, неохраняемым входом. Шлюз docker0 —
    # ровно то, во что докер разворачивает `host-gateway`, и достучаться до него
    # может только контейнер на этой машине.
    #
    # Адрес записан числом, а не переменной, намеренно: подстановку `${...}` в
    # `ports` делает compose из `.env` проекта, а `.env` на сервер не едет — вышла
    # бы пустота вместо адреса. Локальная накладка заменяет эту строку целиком.
    ports:
      - "172.17.0.1:${UVICORN_PORT:-8021}:8000"

  dating_worker:
    build:
      context: .
      dockerfile: docker/uvicorn/dockerfile
    container_name: dating_worker
    # Адрес разворачивает **оболочка внутри контейнера**, а не compose. Разница
    # принципиальна: `${REDIS_URL}` в команде compose берёт значение из `.env`
    # проекта и ничего не знает про `env_file` — на проде туда попадал локальный
    # `dating_redis`, которого там нет, и воркер падал на разрешении имени.
    command: sh -c 'rq worker --url "$$REDIS_URL" dating'
    volumes:
      - ./:/app
    env_file:
      - .env.prod
    depends_on:
      dating_mysql:
        condition: service_healthy
      dating_redis:
        condition: service_started
      dating_uvicorn:
        condition: service_started
    networks:
      - dating-net

    # ⚠⚠ **Предел на журнал контейнера: без него он растёт без границ.**
    # На сервере логи Docker занимали 12 ГБ — больше всей базы, — и наш
    # воркер был самым громким: полтора гигабайта в сутки.
    #
    # ⚠ Здесь, а не только в `daemon.json`. Умолчание демона применяется
    # к новым контейнерам и требует **полного рестарта Docker**, то есть
    # даунтайма всех контейнеров сервера, включая чужие проекты.
    # `systemctl reload` (SIGHUP) перечитывает лишь часть опций, и
    # `log-opts` в неё не входит — проверено пробным контейнером: он
    # написал 137 МБ в один файл. Своя секция действует сразу.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: always

  # ── Свои движки ──────────────────────────────────────────────────────────
  #
  # Раньше прод брал MySQL и Redis у соседа: считалось, что поднимать вторые
  # значит платить памятью за то, что уже работает. Цену этой экономии узнали
  # 25 августа — сосед пересоздал свой MySQL, база `dating` и её пользователь
  # исчезли вместе с ним, и панель три дня отвечала «Access denied» на каждый
  # вход. Своя база стоит ~400 МБ и не зависит от чужих выкладок.
  #
  # Переменные приходят из `.env.prod` тем же `env_file`, что у панели: подстановка
  # `${...}` здесь не годится — её делает compose из `.env` проекта, а `.env` на
  # сервер не едет вовсе, и значения молча оказались бы пустыми.

  dating_mysql:
    image: mysql:8.0
    container_name: dating_mysql
    command: mysqld --sql-mode="NO_ENGINE_SUBSTITUTION"
    env_file:
      - .env.prod
    volumes:
      - dating_mysql_data:/var/lib/mysql
    # Панель без базы не поднимается, поэтому ждём не запуска контейнера, а
    # готовности сервера принимать запросы.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p$$MYSQL_ROOT_PASSWORD", "--protocol", "tcp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dating-net

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: always

  dating_redis:
    image: redis:7-alpine
    container_name: dating_redis
    volumes:
      - dating_redis_data:/data
    networks:
      - dating-net

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: always

  # Веб-морда к своей базе — пункт «Инструменты → phpMyAdmin» в шапке панели.
  # Порт на петле: снаружи он не нужен, а ssh-туннель до него доходит.
  dating_phpmyadmin:
    image: phpmyadmin:latest
    container_name: dating_phpmyadmin
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-9637}:80"
    environment:
      PMA_HOST: dating_mysql
    depends_on:
      dating_mysql:
        condition: service_healthy
    networks:
      - dating-net

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: always

volumes:
  dating_mysql_data:
  dating_redis_data:

# Сеть одна и своя. Общей с RhapsodyAi (`rhapsodyai_os-net`) здесь больше нет, и
# это не уборка ради красоты: пока мы в ней сидели, чужие движки выглядели
# «своими» — база бралась у соседа по имени контейнера, и пересоздание того
# контейнера 25 августа унесло нашу базу вместе с пользователем.
#
# Что осталось от соседства и почему это нормально:
#
#   * его API — по публичному HTTPS (`RHAPSODY_URL`), как к любому чужому
#     сервису. Продукт без него не работает по сути, а не по инфраструктуре;
#   * его Caddy — общий вход на машине: 80 и 443 одни на хост, и второй Caddy
#     рядом не встанет. Он ходит к нам на `172.17.0.1:8021` — по адресу, а не по
#     имени контейнера, поэтому общая сеть для этого не нужна.
networks:
  dating-net:
