[tool.pytest.ini_options]
asyncio_mode = "auto"
# Область цикла для async-фикстур. Задана явно, потому что значение по умолчанию
# у pytest-asyncio меняется, и он предупреждает об этом на каждом прогоне —
# предупреждение на всю сюиту прячет настоящие.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Гасим одно чужое предупреждение: pytest-asyncio 0.25 зовёт
# `asyncio.get_event_loop_policy()`, а Python 3.14 объявил его устаревшим. Полторы
# тысячи одинаковых строк на прогон прячут настоящие предупреждения, а починить
# это у себя нечем — код чужой. Фильтр узкий намеренно: остальные `DeprecationWarning`
# обязаны быть видны.
filterwarnings = [
    "ignore:'asyncio.[gs]et_event_loop_policy' is deprecated:DeprecationWarning",
]
# `py_modules` — общая библиотека отдельным каталогом, а не установленным пакетом.
pythonpath = [".", "py_modules"]

# Группы тестов по подсистемам. Смысл — прогонять то, что задето правкой, а не всё
# подряд: полная сюита идёт девять минут, и платить их после каждой правки в одном
# углу проекта значит проверять реже, чем следует.
#
# Группа ставится **файлу целиком**: `pytestmark = pytest.mark.<группа>` под
# докстрингом. Файл принадлежит ровно одной — тест, покрывающий стык двух
# подсистем, идёт в ту, чей контракт он стережёт.
#
# ⚠ Деление — по **предмету**, а не по слою: «письма» это и ручки, и круги, и
# агент у соседа. Правят их вместе, значит и гонять надо вместе; деление по слоям
# («роутеры», «воркер») заставляло бы гонять три группы на одну правку.
#
# Как выбрать группу под свою правку и как запускать — `.claude/docs/testing.md`.
markers = [
    "mail: почта — рассылка, входящие, ответы, шаблоны, переменные, избранные, собеседники",
    "chat: чат — сокет, кадры, диалоги, инвайты, импорт из панели, автоответ",
    "profile: анкета — CRUD, вход и восстановление, расписание, присутствие, списки людей",
    "page: страницы панели — вёрстка вкладок, шаблон работы, журналы, пейджер, время",
    "core: общее — доступ, пользователи, настройки, сайты, дверь к соседу",
]
