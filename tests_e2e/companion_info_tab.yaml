name: Собеседник — вкладка «Информация» и его Bio
description: >
  В карточке собеседника три вкладки, и вторая показывает то, что уезжает
  агенту переменной companion_bio: слева сведения о человеке и поля правки,
  справа собранный текст. Случай стережёт обе колонки разом — что они не
  слиплись и не вылезли за край, — и то, ради чего вкладка заведена: Bio
  непусто и подписи в нём английские. Русская подпись в Bio означает, что
  перевод при сборке отвалился, а глазами это видно только в журнале прогонов
  у соседа.

page: /admin/dating
widths: [1440, 900]

steps:
  # ⚠⚠ Ждём ВКЛАДКИ, а не `<option>`. Селект сайта стал полосой вкладок
  # (`<div id="siteSelect" class="site-tabs">` плюс `.site-tab` внутри), и
  # элементов `<option>` на странице нет вовсе. Условие по ним не наступало
  # никогда: заход висел до таймаута, список собеседников не загружался, и
  # все области падали «селектор не нашёл узла» — то есть случай сообщал про
  # пропавшую карточку там, где пропал его собственный первый шаг.
  - wait_for: |
      return document.querySelectorAll('#siteSelect .site-tab').length > 0;
    timeout: 20000

  # ⚠ Сайт выбираем явно: список собеседников — ПО САЙТУ, а страница
  # открывается на том, что запомнен в браузере прогона. По подписи, а не по
  # значению: в `value` лежит номер сайта, он внешний и ничего не объясняет.
  - set: '#siteSelect'
    label: Ladadate

  - click: '.page-tab[data-tab="companion"]'

  # ⚠⚠ Ждём СТРОКИ списка, а не «вкладка открылась»: до ответа на месте списка
  # лежит заглушка, и кадр снялся бы с неё — пустая карточка справа выглядит
  # на кадре честно.
  - wait_for: |
      return document.querySelectorAll('.comp-card').length > 0;
    timeout: 30000

  # ⚠⚠ Строку списка **не щёлкаем**, и это не лень. Карточка открывается сама
  # на первом собеседнике (`companionId` падает на первую строку), а щелчок по
  # строке — переключатель: `companionId = row.id === companionId ? 0 : row.id`.
  # Щелчок по уже открытой строке её закрывает, и кадр снимался с пустой
  # карточкой «Выберите собеседника в списке» — честно выглядящей и ничего не
  # доказывающей. Поймано кадром; числа при этом говорили только «селектор не
  # нашёл узла».
  - wait_for: |
      return !!document.querySelector('#companion .card-tab[data-tab="info"]');
    timeout: 20000

  - click: '#companion .card-tab[data-tab="info"]'

  # ⚠⚠ Ждём ПРИШЕДШЕЕ Bio, а не появление поля. Поле рисуется пустым сразу, а
  # текст приезжает ручкой `POST /{id}/bio`: отпусти условие на самом поле —
  # кадр снимется с пустой правой колонкой, то есть ровно без того, ради чего
  # вкладка и заведена.
  - wait_for: |
      const box = document.querySelector('#compBio');
      return !!box && box.value.trim().length > 0;
    timeout: 30000

areas:
  - name: Сведения и поля правки
    selector: '#companion .info-left'
    rules: [visible, inside, whole, filled]

  # ⚠⚠ Без `filled`, и это не поблажка. Правило меряет `innerText`, а у
  # `<textarea>`, заполненного из JS (`box.value = …`), текстового узла нет
  # вовсе: `innerText` пуст при полном поле. Правило честно отвечало «знаков
  # текста 0» на кадре, где Bio читается глазами. Непустоту здесь стережёт
  # проверка ниже — она смотрит в `value`, то есть туда, где текст и лежит.
  - name: Bio собеседника
    selector: '#compBio'
    rules: [visible, inside, whole]

  - name: Кнопка «Обновить био»
    selector: '#compBioGet'
    rules: [visible, inside, whole]

checks:
  # ⚠⚠ Главное утверждение: ни одной кириллической подписи в Bio. Подписи
  # хранятся по-русски (их читает человек в поле «Описание» слева) и
  # переводятся при сборке; отвались перевод — агент снова получит русский
  # абзац внутри английского промпта, и узнать об этом можно будет только из
  # журнала прогонов у соседа.
  - name: строк Bio с кириллической подписью
    expect: 0
    js: |
      const box = document.querySelector('#compBio');
      if (!box) return 99;
      return box.value.split('\n').filter(line => {
        const i = line.indexOf(':');
        return i > 0 && /[А-Яа-яЁё]/.test(line.slice(0, i));
      }).length;

  # Защита от ложной зелени: проверка выше зеленеет и на пустом поле.
  - name: Bio пусто, доказывать было нечего (1 — пусто)
    expect: 0
    js: |
      const box = document.querySelector('#compBio');
      return box && box.value.trim().length > 0 ? 0 : 1;

  # ⚠ Правка живёт на ЭТОЙ вкладке и только на ней: копия на «Общей
  # информации» означала бы два состояния одного текста на экране разом.
  - name: полей правки на вкладке — почта и описание, ждём 2
    expect: 2
    js: |
      return document.querySelectorAll('#companion .info-pane [data-field]').length;

  # ⚠ Сведения с сайта правке не поддаются: механизма «правлено руками» у
  # карточек собеседников нет, и первое же снятие анкеты затёрло бы правку.
  - name: сведений с сайта, открытых для правки
    expect: 0
    js: |
      return [...document.querySelectorAll('#companion .info-left input')]
        .filter(el => !el.readOnly && !el.dataset.field).length;

  # Вёрстка: горизонтальной прокрутки нет ни на одной ширине. Под 1000
  # пикселей колонки обязаны встать друг под друга, а не выдавить страницу.
  - name: элементов за правым краем экрана
    expect: 0
    js: |
      return [...document.querySelectorAll('#companion .info-pane *')]
        .filter(e => e.getBoundingClientRect().right > window.innerWidth + 1).length;
