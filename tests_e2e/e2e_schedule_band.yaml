name: E2E — лента расписания прогона
description: >
  На странице «Тесты → E2E» стоит лента: двадцать четыре часа суток, и
  закрашенные — это когда прогон случается сам. Случай стережёт, что лента
  поднялась и подписана, а не висит пустой полосой. Пустая полоса здесь —
  худший исход: она выглядит как «смен нет», то есть как настройка, которой
  человек не делал.

page: /admin/e2e
widths: [1440, 900]

steps:
  # ⚠⚠ Ждём КЛЕТКИ, а не появление самой ленты. Полоса лежит в разметке и
  # пуста до того, как модуль её нарисует: условие по самому узлу отпускало бы
  # сразу, и кадр снимался бы с пустой лентой — честно выглядящей и ничего не
  # доказывающей. Та же грабля, что уже ловилась на списках панели.
  - wait_for: |
      return document.querySelectorAll('#e2eBand .e2e-band-hour').length === 24;
    timeout: 20000

  # ⚠ Подпись приезжает той же отрисовкой; ждём её отдельно, потому что она
  # отвечает на другой вопрос — «что сейчас задано» либо «почему ленты нет».
  - wait_for: |
      const note = document.getElementById('e2eBandNote');
      return !!note && note.textContent.trim().length > 0;
    timeout: 20000

areas:
  # ⚠⚠ Без `visible`: лента прячется целиком там, где планировщика нет вовсе
  # (у соседней установки его может не быть), и требовать её видимости значило
  # бы красить случай в красный за законное состояние. Что она не пуста и не
  # вылезла за край — стерегут числа ниже и правило `inside` у подписи.
  - name: Подпись расписания
    selector: '#e2eBandNote'
    rules: [visible, inside, whole, filled]

checks:
  - name: часов в ленте, ждём 24
    expect: 24
    js: |
      return document.querySelectorAll('#e2eBand .e2e-band-hour').length;

  # Защита от ложной зелени: лента из двадцати четырёх клеток бывает и у
  # модуля, который не дошёл до ответа сервера. Подпись доказывает, что дошёл.
  - name: подпись пуста, доказывать было нечего (1 — пуста)
    expect: 0
    js: |
      const note = document.getElementById('e2eBandNote');
      return note && note.textContent.trim().length > 0 ? 0 : 1;

  # ⚠ Клетки обязаны уложиться в ленту: двадцать четыре штуки на узком окне —
  # первое, что вылезает за правый край.
  - name: клеток за правым краем экрана
    expect: 0
    js: |
      return [...document.querySelectorAll('#e2eBand .e2e-band-hour')]
        .filter(one => one.getBoundingClientRect().right > window.innerWidth + 1).length;
