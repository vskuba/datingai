name: Настройки — таблица цела на трёх ширинах
description: >
  Страница значений (/admin/setting): поиск, кнопка заведения и сама таблица.
  Стережёт, что таблица не вылезает за вьюпорт и не режет содержимое, когда
  окно узкое, — на широкой это невидимо, а на телефоне даёт горизонтальный
  скролл всей страницы.

page: /admin/setting
widths: [360, 768, 1440]

steps:
  # ⚠⚠ Ждём ПРИЗНАК, а не секунды. Строки приходят запросом, и пустая таблица
  # от «ещё не пришло» неотличима от «настроек нет»: тест зеленел бы на
  # непроверенной странице. Признак — в таблице появилась хотя бы одна строка.
  - wait_for: |
      const rows = document.querySelectorAll('table tbody tr');
      return rows.length > 0;
    timeout: 15000

areas:
  - name: Поиск по названию
    selector: '#search'
    rules: [visible, inside]

  - name: Кнопка заведения
    selector: '#addBtn'
    rules: [visible, inside]

  - name: Таблица значений
    selector: table
    rules: [visible, inside, whole, filled]

checks:
  # Число, а не «да/нет»: вердикт читается как «ожидали 0, получили 3».
  - name: элементов за правым краем экрана
    expect: 0
    js: |
      return [...document.querySelectorAll('body *')]
        .filter(e => e.getBoundingClientRect().right > window.innerWidth + 1)
        .length;
