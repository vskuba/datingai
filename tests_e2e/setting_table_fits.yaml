name: Настройки — таблица цела на трёх ширинах
description: >
  Страница значений (/admin/setting): поиск, кнопка заведения и сама таблица.
  Стережёт, что таблица не вылезает за вьюпорт и не режет содержимое, когда
  окно узкое, — на широкой это невидимо, а на телефоне даёт горизонтальный
  скролл всей страницы.

page: /admin/setting
widths: [360, 768, 1440]

steps:
  # ⚠⚠ Ждём ПРИЗНАК, а не секунды. Строки приходят запросом, и пустая таблица
  # от «ещё не пришло» неотличима от «настроек нет»: тест зеленел бы на
  # непроверенной странице. Признак — в таблице появилась хотя бы одна строка.
  - wait_for: |
      const rows = document.querySelectorAll('table tbody tr');
      return rows.length > 0;
    timeout: 15000

areas:
  - name: Поиск по названию
    selector: '#search'
    rules: [visible, inside]

  - name: Кнопка заведения
    selector: '#addBtn'
    rules: [visible, inside]

  - name: Таблица значений
    selector: table
    rules: [visible, inside, whole, filled]

checks:
  # Число, а не «да/нет»: вердикт читается как «ожидали 0, получили 3».
  # ⚠⚠ Считаем тех, кто ТЯНЕТ СТРАНИЦУ, а не всех, кто правее вьюпорта.
  # Разница по существу: элемент внутри горизонтального скроллера (лента меню,
  # обёртка широкой таблицы) тоже лежит правее края — и это нормальный приём,
  # а не дефект. Прежний счёт красил его как беду, и отличить «страницу увело
  # вбок» от «широкое ездит внутри своей рамки» было нечем.
  - name: элементов, тянущих страницу вбок
    expect: 0
    js: |
      const free = (el) => {
        let p = el.parentElement;
        while (p && p !== document.body) {
          if (getComputedStyle(p).overflowX !== 'visible') return false;
          p = p.parentElement;
        }
        return true;
      };
      return [...document.querySelectorAll('body *')]
        .filter(e => e.getBoundingClientRect().right > window.innerWidth + 1)
        .filter(free)
        .length;

  # ⚠ Прямой вопрос «уехала ли страница» — числом в пикселях. Проверка выше
  # называет виновных, эта отвечает за итог: ноль значит, что горизонтальной
  # прокрутки у страницы нет вовсе.
  - name: на сколько пикселей страница шире экрана
    expect: 0
    js: |
      return Math.max(0,
        document.documentElement.scrollWidth - window.innerWidth);
